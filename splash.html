<!DOCTYPE html>
<html lang="te"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BM మహిమ సన్నిధి</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B3D2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="మహిమ సన్నిధి">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B3D2E;overflow:hidden;font-family:sans-serif}
.splash{position:fixed;inset:0;width:100%;height:100dvh;background:#0B3D2E;display:flex;flex-direction:column;align-items:center;justify-content:center}
.splash img{width:100%;height:100%;object-fit:cover;object-position:center;position:absolute;inset:0}
.top-text{position:absolute;top:20px;left:0;right:0;text-align:center;color:white;font-weight:bold;font-size:19px;text-shadow:0 2px 8px #000;z-index:2}
.install-box{position:absolute;bottom:30px;left:12px;right:12px;z-index:3;text-align:center}
#installBtn{background:#FFC107;color:#000;border:3px solid white;padding:16px 20px;border-radius:50px;font-size:19px;font-weight:bold;width:100%;box-shadow:0 5px 20px rgba(0,0,0,.5);cursor:pointer}
#installBtn small{display:block;font-size:13px;font-weight:normal;margin-top:3px}
.enter-btn{background:rgba(0,0,0,.6);color:white;border:1px solid white;padding:10px 20px;border-radius:30px;font-size:15px;font-weight:bold;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="splash">
  <img src="IMG-20261104-WA0008.jpg" alt="BM మహిమ సన్నిధి">
  <div class="top-text">📖 BM మహిమ సన్నిధి</div>
  <div class="install-box">
    <button id="installBtn">📱 యాప్ లాగా ఇన్‌స్టాల్ చేసుకోండి<br><small>ఒక్కసారి నొక్కండి - హోమ్ స్క్రీన్ లో యాప్ వస్తుంది</small></button>
    <br>
    <button class="enter-btn" onclick="location.href='index.html'">➡️ ఇన్స్టాల్ వద్దు - లోపలికి వెళ్ళండి</button>
  </div>
</div>
<script>
let deferredPrompt;
let btn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt = e;
  btn.style.display='block';
});
btn.onclick = ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(r=>{
      if(r.outcome==='accepted'){ location.href='index.html'; }
      deferredPrompt=null;
    });
  } else {
    alert('ఇప్పటికే ఇన్స్టాల్ అయి ఉండవచ్చు!\nపైన 3 చుక్కలు ⋮ నొక్కి Install నొక్కండి, లేదా లోపలికి వెళ్ళండి.');
    location.href='index.html';
  }
};
// 3 సెకన్ల ఆటో వెళ్ళడం తీసేసాను - ఇప్పుడు వాళ్ళు నొక్కితేనే వెళ్తుంది
</script>
</body></html>
