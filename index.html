<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>మహిమ సన్నిధి బైబిల్ మిషన్</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Telugu',sans-serif}body{background:linear-gradient(180deg,#0a1931 0%,#0d2a54 100%);color:white;min-height:100vh}header{padding:25px 15px;text-align:center;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}header h1{font-size:28px;color:#ffdd57;text-shadow:2px 2px 4px rgba(0,0,0,0.5)}header p{opacity:0.9;margin-top:5px}.nav{display:flex;gap:8px;justify-content:center;padding:15px;flex-wrap:wrap}.nav button{padding:10px 18px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;background:white;color:#0d2a54;transition:0.3s}.nav button.active{background:#ffdd57;color:#0d2a54;transform:scale(1.05)}.links{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}.link-card{background:linear-gradient(135deg,white 0%,#f0f0f0 100%);color:#0d2a54;padding:18px;border-radius:18px;text-align:center;font-weight:bold;box-shadow:0 8px 20px rgba(0,0,0,0.3);text-decoration:none;display:block;transition:0.3s}.link-card:hover{transform:translateY(-3px)}.link-card span{font-size:32px;display:block;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:15px}.card{background:white;color:#0d2a54;padding:18px;border-radius:18px;box-shadow:0 5px 15px rgba(0,0,0,0.2);animation:pop 0.4s}@keyframes pop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}.card h3{color:#0d2a54;margin-bottom:8px;font-size:18px}.card p{line-height:1.6}.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;margin-bottom:8px}.msg{background:#e3f2fd;color:#0d47a1}.book{background:#fff3e0;color:#e65100}.song{background:#fce4ec;color:#880e4f}footer{padding:30px 15px;text-align:center;opacity:0.7;margin-top:30px;border-top:1px solid rgba(255,255,255,0.1)}</style></head><body><header><h1>✝️ మహిమ సన్నిధి బైబిల్ మిషన్</h1><p>జాన్ డల్లి గారి పరిచర్య - మరనాత! ప్రభువు వచ్చుచున్నాడు!</p><p id="count" style="color:#ffdd57;margin-top:10px;font-weight:bold">Loading...</p></header><div class="nav"><button onclick="filterPosts('all')" id="b-all" class="active">🏠 హోమ్ - అన్నీ</button><button onclick="filterPosts('msg')" id="b-msg">💬 వాక్యాలు</button><button onclick="filterPosts('book')" id="b-book">📚 పుస్తకాలు</button><button onclick="filterPosts('song')" id="b-song">🎵 పాటలు</button></div><div class="links"><a class="link-card" href="https://youtube.com" target="_blank"><span>▶️</span>యూట్యూబ్ ఛానల్</a><a class="link-card" href="https://facebook.com" target="_blank"><span>📘</span>ఫేస్‌బుక్ పేజ్</a><a class="link-card" href="https://wa.me/919999999999" target="_blank"><span>💬</span>వాట్సాప్ గ్రూప్</a><a class="link-card" href="tel:+919999999999"><span>📞</span>ప్రార్థన కోసం</a></div><div class="grid" id="grid"><div class="card"><p>⏳ దేవుని వాక్యం లోడ్ అవుతుంది...</p></div></div><footer><p>© 2026 మహిమ సన్నిధి బైబిల్ మిషన్ | జాన్ డల్లి</p><p style="margin-top:8px">మరనాత! ప్రభువైన యేసు త్వరగా వచ్చుచున్నాడు! ఆమెన్!</p></footer><script>const API_URL="https://api.npoint.io/3ee443f4b9d6fcc74a09";let allData=[];let cur='all';async function load(){try{let r=await fetch(API_URL);let data=await r.json();if(!Array.isArray(data)){if(data.why){data=[{ty:'msg',t:'మహిమ సన్నిధి బైబిల్ మిషన్',c:'దేవుని వాక్యం నిత్యమూ నిలుచును - Admin లో కొత్త పోస్ట్ పెట్టండి!',dt:new Date().toLocaleDateString('te-IN')}]}else{data=[data]}}allData=data;render();}catch(e){document.getElementById('grid').innerHTML=`<div class="card"><h3>⚠️ లోడింగ్ లోపం</h3><p>${e.message}</p><p style="margin-top:10px">Admin లో పోస్ట్ పెట్టిన తర్వాత ఇక్కడ కనబడుతుంది</p></div>`}}function render(){let list=cur==='all'?allData:allData.filter(x=>x.ty===cur);document.getElementById('count').innerText=`మొత్తం ${allData.length} పోస్ట్ లు - LIVE AUTO | ${cur==='all'?'అన్నీ':cur} చూస్తున్నారు`;if(list.length===0){document.getElementById('grid').innerHTML=`<div class="card"><h3>📭 ఇంకా పోస్ట్ లు లేవు</h3><p>${cur==='all'?'Admin లో మొదటి పోస్ట్ పెట్టండి!':'ఈ విభాగంలో పోస్ట్ లు లేవు'}</p></div>`;return}let h='';list.forEach(d=>{let badgeClass=d.ty==='book'?'book':d.ty==='song'?'song':'msg';let badgeText=d.ty==='book'?'📚 పుస్తకం':d.ty==='song'?'🎵 పాట':'💬 వాక్యం';h+=`<div class="card"><span class="badge ${badgeClass}">${badgeText}</span><h3>${d.t}</h3><p>${d.c}</p><small style="opacity:0.6;display:block;margin-top:10px">📅 ${d.dt}</small></div>`});document.getElementById('grid').innerHTML=h}function filterPosts(type){cur=type;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+type).classList.add('active');render()}load();setInterval(load,10000);</script></body></html>
