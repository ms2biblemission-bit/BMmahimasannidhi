l)el.classList.add('active');let h='';let filtered=f==='all'?allData:allData.filter(d=>d.ty===f);if(filtered.length===0)h='<div class="card">ఇంకా పోస్ట్ లు లేవు - Admin లో పోస్ట్ చేయండి!</div>';else filtered.forEach(d=>{let icon=d.ty==='book'?'📚':d.ty==='song'?'🎵':'💬';h+=`<div class="card"><b>${icon} ${d.t}</b><small style="float:right">${d.dt||''}</small><br><br><div style="white-space:pre-wrap">${d.c}</div></div>`});document.getElementById('list').innerHTML=h}show('all');</script></body></html>
