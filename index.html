<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>మహిమ సన్నిధి</title><style>body{margin:0;font-family:sans-serif;background:#fff8f0}header{background:linear-gradient(135deg,#0d2a54,#1e6bff);color:white;padding:35px 20px;text-align:center;border-radius:0 0 30px 30px}.card{background:white;margin:15px;padding:20px;border-radius:20px;box-shadow:0 4px 15px #0001;text-align:center}.btn{display:block;color:white;padding:15px;border-radius:12px;text-decoration:none;font-weight:bold;margin:12px 0;border:none;width:100%;font-size:16px;cursor:pointer}.c1{background:#1e6bff}.c2{background:#0d2a54}.c3{background:#25D366}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#verseBox{display:none;background:#eef3ff;padding:15px;border-radius:12px;margin-top:15px;border-left:5px solid #1e6bff}</style></head><body><header><div style="font-size:55px">✝️</div><h1>బైబిల్ మిషన్<br>మహిమ సన్నిధి</h1><p>చినగంజాం</p></header><div class="card"><h3 style="color:#0d2a54" id="mainVerse">"నేను మార్గమును, సత్యమును, జీవమును"</h3><p id="verseRef">- యోహాను 14:6</p><div id="verseBox"></div></div><div class="card"><div class="grid"><button class="btn c1" onclick="newVerse()">📖 నేటి వాక్యం</button><button class="btn c2" onclick="prayer()">🙏 ప్రార్థన</button><button class="btn c2" onclick="window.open('https://youtube.com','_blank')">🎥 వీడియోలు</button><button class="btn c1" onclick="timings()">⛪ సమయాలు</button></div><button class="btn c3" onclick="whatsapp()">💬 వాట్సాప్ మెసేజ్</button></div><div class="card"><p><b>ఆరాధన:</b> ప్రతి ఆదివారం ఉదయం 10 గంటలకు</p><p>చినగంజాం ప్రార్థన మందిరం</p></div><script>
const verses=[["యెహోవా నా కాపరి, నాకు లేమి కలుగదు","కీర్తన 23:1"],["నీవు నమ్మినయెడల దేవుని మహిమను చూతువు","యోహాను 11:40"],["భయపడకుము, నేను నీకు తోడైయున్నాను","యెషయా 41:10"],["ఆయన గాయముల చేత మనకు స్వస్థత కలిగెను","యెషయా 53:5"]];
function newVerse(){let v=verses[Math.floor(Math.random()*verses.length)];document.getElementById('mainVerse').innerText='"'+v[0]+'"';document.getElementById('verseRef').innerText='- '+v[1];let b=document.getElementById('verseBox');b.style.display='block';b.innerHTML='🙏 ఈ వాక్యాన్ని ధ్యానించండి, దేవుడు మీతో మాట్లాడతాడు!';}
function prayer(){let name=prompt("మీ పేరు రాయండి:");if(name){alert("హల్లెలూయా "+name+" గారు! మీ ప్రార్థన కొరకు మేము ప్రార్థిస్తాము! దేవుడు మీ మొర వింటాడు! 🙏");}}
function timings(){alert("⛪ ఆరాధన సమయాలు:\n\nఆదివారం - ఉదయం 10 గం\nబుధవారం - సాయంత్రం 7 గం\nశుక్రవారం - ఉపవాస ప్రార్థన - ఉదయం 10 గం\n\nస్థలం: చినగంజాం");}
function whatsapp(){let msg=prompt("మీ ప్రార్థన అవసరం రాయండి:");if(msg){let num="919885579798";window.open("https://wa.me/"+num+"?text="+encodeURIComponent("Praise the Lord Anna, Prayer: "+msg),"_blank");}}
</script></body></html>
