<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>మహిమ సన్నిధి బైబిల్ మిషన్</title><style>body{margin:0;font-family:sans-serif;background:#0a1931;color:white}header{padding:20px;text-align:center;background:#0d2a54}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}.card{background:white;color:#0d2a54;padding:15px;border-radius:15px;animation:pop .3s}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}</style></head><body><header><h1>✝️ మహిమ సన్నిధి బైబిల్ మిషన్</h1><p>జాన్ డల్లి - మరనాత!</p><p id="count">Loading...</p></header><div class="grid" id="grid"></div><script>const API_URL="https://api.npoint.io/3ee443f4b9d6fcc74a09";async function load(){try{let r=await fetch(API_URL);let data=await r.json();let h='';data.forEach(d=>{h+=`<div class="card"><h3>${d.t}</h3><p>${d.c}</p><small>📅 ${d.dt}</small></div>`});document.getElementById('grid').innerHTML=h||'<p>పోస్ట్ లు లేవు</p>';document.getElementById('count').innerText=`మొత్తం ${data.length} పోస్ట్ లు - LIVE AUTO`}catch(e){document.getElementById('grid').innerHTML='Error: '+e.message}}load();setInterval(load,5000);</script></body></html>
