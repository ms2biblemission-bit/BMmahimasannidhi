<!DOCTYPE html>
<html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>వీడియోస్ - మహిమ సన్నిధి</title><style>body{font-family:system-ui;padding:12px;max-width:650px;margin:auto;background:#fff8ec}h2{color:#8B0000;text-align:center}.card{background:#fff;padding:14px;border-radius:14px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}video{width:100%;border-radius:12px;background:#000;max-height:320px}a.btn{display:block;text-align:center;padding:16px;border-radius:12px;text-decoration:none;font-weight:bold;margin-top:10px;color:#fff;font-size:18px}.watch{background:#E53935}.down{background:#4CAF50;font-size:20px!important;padding:18px!important}.back{display:block;text-align:center;margin:10px 0;color:#8B0000;text-decoration:none;font-weight:bold}.tip{background:#E8F5E9;padding:10px;border-radius:10px;font-size:14px;text-align:center}</style></head><body>
<a class="back" href="index.html">⬅️ వెనక్కి - హోమ్</a><h2>🎥 వీడియోస్</h2><p style="text-align:center">వీడియో మీద నొక్కితే ఇక్కడే ఆడుతుంది 🙏</p>
<div class="tip">📌 <b>పెద్దవారికి ఈజీ:</b> వీడియో కిందే పెద్ద <b>⬇️ డౌన్లోడ్</b> బటన్ ఉంటుంది - అది నొక్కితే ఫోన్ లోకి వచ్చేస్తుంది ✅</div>
<div id="list">లోడ్ అవుతోంది...</div>
<script>
function did(l){ let m=(l||"").match(/\/d\/([^\/\?]+)/); return m?m[1]:""; }
async function load(){ try{ let r=await fetch("videos.json?v="+Date.now()); let d=await r.json(); let b=document.getElementById("list"); if(!d.length){ b.innerHTML="<p style='text-align:center'>📭 ఇంకా వీడియోస్ లేవు</p>"; return; } b.innerHTML=""; d.forEach((v,i)=>{ let id=did(v.link); let direct=id?"https://drive.google.com/uc?export=download&id="+id:(v.link||""); let view=id?"https://drive.google.com/file/d/"+id+"/view":(v.link||"#"); let div=document.createElement("div"); div.className="card"; let vid=""; if(id){ vid='<video controls playsinline preload="none" src="'+direct+'"></video>'; } div.innerHTML="<b>"+(i+1)+". "+(v.title||"వీడియో")+"</b><p>"+(v.msg||"")+"</p>"+vid+"<a class='btn down' href='"+direct+"' download>⬇️ డౌన్లోడ్ చేసుకోండి - ఇక్కడ నొక్కండి</a><a class='btn watch' href='"+view+"' target='_blank'>▶️ Drive లో పెద్దగా చూడండి</a>"; b.appendChild(div); }); }catch(e){ document.getElementById("list").innerHTML="<p style='text-align:center'>📭 ఇంకా వీడియోస్ లేవు</p>"; } }
load();
</script></body></html>
