<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🙏 LIVE ప్రార్థన చాట్ - BM మహిమ సన్నిధి</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;font-weight:900 !important}
body{margin:0;font-family:sans-serif;background:#ECE5DD}
.top{background:#075E54;color:#fff;padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10}
.top button{background:none;border:none;color:#fff;font-size:22px}
.top b{flex:1}
#toast{display:none;background:#FFD54F;color:#222;text-align:center;padding:10px;font-size:14px;position:sticky;top:60px;z-index:9}
.prayer-time{background:#FFD54F;color:#222;text-align:center;padding:10px;font-size:14px}
#adminBox{display:none;background:#fff;border:2px solid #FFD54F;padding:12px;margin:12px;border-radius:12px;text-align:center}
#adminBox button{border:none;padding:10px 16px;border-radius:20px;font-size:14px;margin:4px}
#voiceBar{background:#fff;border:2px solid #075E54;border-radius:16px;padding:12px;margin:12px;text-align:center}
#voiceBar button{border:none;padding:12px 18px;border-radius:25px;font-size:15px;margin:4px}
#handQueue{display:none;background:#fff;border:2px solid #FFD54F;padding:12px;margin:12px;border-radius:12px}
#handQueue button{border:none;padding:8px 14px;border-radius:20px;font-size:13px;margin:3px}
#speakerBar{display:none;background:#25D366;color:#fff;text-align:center;padding:12px;font-size:15px}
#msgs{padding:12px 10px 110px}
.msg{max-width:82%;padding:10px 12px;border-radius:14px;margin:8px 0;font-size:15px;background:#fff;word-break:break-word}
.msg.me{margin-left:auto;background:#DCF8C6}
.msg .name{font-size:12px;color:#075E54;display:block}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#F0F0F0;padding:8px;display:flex;gap:6px;align-items:center}
.bottom input{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
.bottom button{border:none;width:48px;height:48px;border-radius:50%;font-size:20px;flex-shrink:0}
</style>
</head>
<body>
<div class="top"><button onclick="location.href='index.html'">⬅️</button><b>🙏 LIVE ప్రార్థన చాట్</b></div>
<div id="toast"></div>
<div class="prayer-time">🙏 <b>ఉదయం 6:00 - ప్రార్థన టైమ్</b> - వాయిస్ + చాట్ - మన App లోనే!</div>

<div id="adminBox">
<b style="color:#7A0C1D">👑 అడ్మిన్ - పాస్టర్ - ఇది మన App - మన కంట్రోల్!</b><br><br>
<button onclick="stopSpeaker()" style="background:#222;color:#fff">🔇 అందరినీ మ్యూట్ - నేనే మాట్లాడతా</button>
</div>

<!-- ✅ వాయిస్ - మన App లోనే - పైన చిన్న బార్ - వేరే సైట్ కాదు! -->
<div id="voiceBar">
<div style="font-size:28px">🎤</div>
<b id="voiceStatus" style="color:#075E54">వాయిస్ లో జాయిన్ అవ్వలేదు</b><br>
<span style="font-size:12px;color:#666">వీడియో లేదు - కెమెరా లేదు - వాయిస్ మాత్రమే!</span><br>
<button id="voiceBtn" onclick="toggleVoice()" style="background:#075E54;color:#fff">🎤 వాయిస్ లో జాయిన్ అవ్వండి</button>
</div>

<div id="handQueue">
<b style="color:#7A0C1D">✋ హ్యాండ్ రైస్ చేసిన వారు:</b>
<div id="handList" style="margin-top:8px"></div>
</div>
<div id="speakerBar">🎤 <span id="speakerName"></span> ప్రార్థన చేస్తున్నారు... 🙏 మిగతా వాళ్ళు వినండి!</div>

<div id="msgs"></div>

<!-- ✅ మైక్ - కింద - చాట్ దగ్గరే! -->
<div class="bottom">
<button onclick="raiseHand()" style="background:#FFD54F">✋</button>
<button id="micBtn" onclick="toggleVoice()" style="background:#FF0000;color:#fff">🎤</button>
<input id="txt" placeholder="🙏 ఎవరి కోసం ప్రార్థన...">
<button onclick="sendMsg()" style="background:#25D366;color:#fff">➤</button>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script>
const TOPIC='ms2-prayer-chat-2026';
let IS_ADMIN=location.search.includes('admin=1');
if(IS_ADMIN){document.getElementById('adminBox').style.display='block';document.getElementById('handQueue').style.display='block';}
function myName(){let n=localStorage.getItem('ms_prayer_name');if(!n){n=prompt('🙏 మీ పేరు:')||'భక్తుడు';localStorage.setItem('ms_prayer_name',n);}return n;}
function getHands(){try{return JSON.parse(localStorage.getItem('ms_prayer_hands')||'[]');}catch(e){return [];}}
function setHands(a){localStorage.setItem('ms_prayer_hands',JSON.stringify(a));}
function getSpeaker(){return localStorage.getItem('ms_prayer_speaker')||'';}
function setSpeaker(n){if(n)localStorage.setItem('ms_prayer_speaker',n);else localStorage.removeItem('ms_prayer_speaker');}
let toastTimer=null;
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{e.style.display='none';},4000);}

// ===== ✅ మన సొంత వాయిస్ - Jitsi లేదు! - PeerJS - Audio Only! =====
let peer=null, myPeerId='', myStream=null, currentCalls={}, joined=false, isMuted=true;
let peersList={}; // name -> peerId

function myPeerIdGen(){
  let id=localStorage.getItem('ms_voice_peer');
  if(!id){id='BM-'+Math.random().toString(36).slice(2,8);localStorage.setItem('ms_voice_peer',id);}
  return id;
}
async function toggleVoice(){
  if(!joined){ await joinVoice(); } else { toggleMic(); }
}
async function joinVoice(){
  let name=myName(); myPeerId=myPeerIdGen();
  try{
    // ✅ Audio Only - వీడియో లేదు - కెమెరా లేదు!
    myStream=await navigator.mediaDevices.getUserMedia({audio:true, video:false});
    // మొదట మ్యూట్ - పాస్టర్ / ఓకే వచ్చిన వాళ్ళు మాత్రమే మాట్లాడతారు!
    myStream.getAudioTracks().forEach(t=>t.enabled=false); isMuted=true;
  }catch(e){ alert('⚠️ మైక్ కి Allow నొక్కండి అండి!'); return; }
  peer=new Peer(myPeerId);
  peer.on('open', async ()=>{
    joined=true;
    document.getElementById('voiceStatus').textContent='✅ వాయిస్ లో ఉన్నారు - వింటున్నారు...';
    document.getElementById('voiceBtn').textContent='🔇 వాయిస్ నుండి బయటకు వెళ్ళు';
    document.getElementById('micBtn').style.background='#666';
    toast('🎤 వాయిస్ లో జాయిన్ అయ్యారు! మన App లోనే - వీడియో లేదు!');
    // అందరికీ చెప్పు - నేను వచ్చాను!
    try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'VOICE_JOIN|'+name+'|'+myPeerId});}catch(e){}
    // ✅ పాస్టర్ అయితే - వెంటనే స్పీకర్ - మాట్లాడతారు!
    if(IS_ADMIN){ setSpeaker(name); await broadcastToAll(); unmuteMe(); }
  });
  // ✅ ఎవరైనా కాల్ చేస్తే - విను - మాట్లాడకు!
  peer.on('call', call=>{
    call.answer(null);
    call.on('stream', s=>{
      let a=document.getElementById('remoteAudio');
      a.srcObject=s; a.play().catch(()=>{});
    });
    currentCalls[call.peer]=call;
  });
  peer.on('error', e=>{ console.log(e); });
}
function unmuteMe(){
  if(!myStream) return;
  myStream.getAudioTracks().forEach(t=>t.enabled=true); isMuted=false;
  document.getElementById('micBtn').style.background='#25D366';
  toast('🎤 మీ మైక్ ON అయ్యింది - మాట్లాడండి!');
}
function muteMe(){
  if(!myStream) return;
  myStream.getAudioTracks().forEach(t=>t.enabled=false); isMuted=true;
  document.getElementById('micBtn').style.background='#FF0000';
}
function toggleMic(){
  // ✅ పాస్టర్ / ఓకే వచ్చిన వాళ్ళు మాత్రమే - మైక్ ON చేయగలరు!
  if(getSpeaker()!==myName() && !IS_ADMIN){
    toast('⚠️ పాస్టర్ ఓకే ఇస్తేనే - మీరు మాట్లాడగలరు! ముందు ✋ నొక్కండి!');
    return;
  }
  if(isMuted){ unmuteMe(); broadcastToAll(); } else { muteMe(); }
}
async function broadcastToAll(){
  if(!peer || !myStream) return;
  // నాకు తెలిసిన అందరికీ - నా వాయిస్ పంపు!
  for(let pid in peersList){
    if(pid===myPeerId) continue;
    try{
      if(currentCalls[pid]){ try{currentCalls[pid].close();}catch(e){} }
      let call=peer.call(pid, myStream);
      currentCalls[pid]=call;
    }catch(e){}
  }
}
function updateSpeakerUI(){
  let sp=getSpeaker();
  document.getElementById('speakerBar').style.display=sp?'block':'none';
  document.getElementById('speakerName').textContent=sp;
  if(IS_ADMIN) renderHandQueue();
  // ✅ నేను స్పీకర్ కాకపోతే - నా మైక్ ఆఫ్!
  if(joined && sp!==myName() && !IS_ADMIN){ muteMe(); }
}
function renderHandQueue(){
  let hands=getHands();
  document.getElementById('handList').innerHTML=hands.length?hands.map(n=>'<div style="background:#FFF3E0;padding:10px;border-radius:10px;margin:4px;display:flex;justify-content:space-between;align-items:center"><b>✋ '+n+' - ప్రార్థన చేస్తా!</b><span><button onclick="approveHand(\''+n+'\')" style="background:#25D366;color:#fff">✅ ఓకే - వీళ్ళకే మైక్</button><button onclick="rejectHand(\''+n+'\')" style="background:#999;color:#fff">❌ వద్దు</button></span></div>').join(''):'<p style="color:#666">ఇంకా ఎవరూ హ్యాండ్ రైస్ చేయలేదు</p>';
}
async function raiseHand(){
  let me=myName();let h=getHands();
  if(h.includes(me)){toast('✋ మీరు ఆల్రెడీ హ్యాండ్ రైస్ చేశారు!');return;}
  h.push(me);setHands(h);
  try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_HAND|'+me});}catch(e){}
  updateSpeakerUI();toast('✋ హ్యాండ్ రైస్ చేశారు! పాస్టర్ ఓకే కోసం వెయిట్ చేయండి!');
}
async function approveHand(name){
  setSpeaker(name);setHands(getHands().filter(n=>n!==name));
  try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_APPROVE|'+name});}catch(e){}
  updateSpeakerUI();toast('✅ '+name+' కి మైక్ ఇచ్చారు!');
  // ✅ పాస్టర్ - తన మైక్ ఆఫ్ చేసి - వాళ్ళని వినాలి!
  if(IS_ADMIN) muteMe();
}
async function rejectHand(name){setHands(getHands().filter(n=>n!==name));try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_REJECT|'+name});}catch(e){}updateSpeakerUI();}
async function stopSpeaker(){
  setSpeaker('');setHands([]);
  // ✅ పాస్టరే మళ్ళీ స్పీకర్!
  if(IS_ADMIN){ setSpeaker(myName()); unmuteMe(); broadcastToAll(); }
  try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_STOP|'});}catch(e){}
  updateSpeakerUI();toast('🔇 అందరినీ మ్యూట్ చేశారు - పాస్టర్ మాత్రమే మాట్లాడతారు!');
}
function loadLocal(){try{return JSON.parse(localStorage.getItem('ms_prayer_local')||'[]');}catch(e){return [];}}
function renderMsgs(){
  let a=loadLocal();
  document.getElementById('msgs').innerHTML=a.map(m=>'<div class="msg '+(m.name===myName()?'me':'')+'">'+(m.name===myName()?'':'<span class="name">🙏 '+m.name+'</span>')+m.msg+'</div>').join('');
}
async function sendMsg(){
  let t=document.getElementById('txt');let msg=t.value.trim();if(!msg)return;
  let m={name:myName(),msg:msg};
  let a=loadLocal();a.push(m);localStorage.setItem('ms_prayer_local',JSON.stringify(a));
  try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER|'+m.name+'||'+m.msg+'|'});}catch(e){}
  t.value='';renderMsgs();
}
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
async function poll(){
  try{
    let r=await fetch('https://ntfy.sh/'+TOPIC+'/json?since=all&poll=1');
    let txt=await r.text();let a=loadLocal();let ch=false;
    txt.split('\n').filter(Boolean).forEach(l=>{
      try{
        let j=JSON.parse(l);if(!j.message)return;
        if(j.message.startsWith('VOICE_JOIN|')){
          let p=j.message.split('|');let nm=p[1], pid=p[2];
          if(pid && pid!==myPeerId){ peersList[pid]=nm;
            // ✅ కొత్త వాళ్ళు వస్తే - నేను స్పీకర్ అయితే - వాళ్ళకి నా వాయిస్ పంపు!
            if(joined && getSpeaker()===myName() && myStream){ try{ peer.call(pid, myStream); }catch(e){} }
          }
          return;
        }
        if(j.message.startsWith('PRAYER_HAND|')){let n=j.message.split('|')[1];let h=getHands();if(n&&!h.includes(n)){h.push(n);setHands(h);}updateSpeakerUI();return;}
        if(j.message.startsWith('PRAYER_APPROVE|')){let n=j.message.split('|')[1];setSpeaker(n);setHands(getHands().filter(x=>x!==n));updateSpeakerUI();
          if(n===myName()){ unmuteMe(); broadcastToAll(); toast('✅ 🎉 పాస్టర్ మీకు ఓకే ఇచ్చారు! ఇప్పుడు మాట్లాడండి!'); }
          else toast('🎤 '+n+' కి పాస్టర్ ఓకే ఇచ్చారు - వాళ్ళు మాట్లాడుతున్నారు!');return;}
        if(j.message.startsWith('PRAYER_REJECT|')){let n=j.message.split('|')[1];setHands(getHands().filter(x=>x!==n));updateSpeakerUI();return;}
        if(j.message.startsWith('PRAYER_STOP|')){setSpeaker('');setHands([]);updateSpeakerUI();return;}
        if(j.message.startsWith('PRAYER|')){let p=j.message.split('|');let m={name:p[1],msg:p[3]};if(!m.msg||m.msg==='undefined'||m.msg==='')return;if(!a.some(x=>x.msg===m.msg&&x.name===m.name)){a.push(m);ch=true;}}
      }catch(e){}
    });
    if(ch){localStorage.setItem('ms_prayer_local',JSON.stringify(a));renderMsgs();}
  }catch(e){}
}
updateSpeakerUI();renderMsgs();poll();setInterval(poll,5000);
</script>
</body>
</html>
