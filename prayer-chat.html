<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🙏 ప్రేయర్ చాట్ - BM మహిమ సన్నిధి</title>
<style>
*{box-sizing:border-box;font-weight:900 !important}
body{margin:0;font-family:sans-serif;background:#ECE5DD}
.top{background:#075E54;color:#fff;padding:12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.top button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.top img{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:cover}
.top b{flex:1;font-size:17px}
.top small{display:block;font-size:11px;opacity:.9}
.prayer-time{background:#FFD54F;color:#222;text-align:center;padding:10px;font-size:14px}
.prayer-time b{color:#7A0C1D}
#adminBox{display:none;background:#fff;border:2px solid #FFD54F;padding:12px;margin:12px;border-radius:12px;text-align:center}
#adminBox input{padding:10px;border-radius:10px;border:1px solid #ccc;font-size:16px}
#adminBox button{border:none;padding:10px 16px;border-radius:20px;font-size:14px;cursor:pointer;margin:4px}
.quick{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#fff}
.quick button{background:#ECE5DD;border:none;padding:8px 12px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer}
#msgs{padding:12px 10px 110px;min-height:60vh}
.msg{max-width:82%;padding:10px 12px;border-radius:14px;margin:8px 0;font-size:15px;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.2);position:relative;word-break:break-word}
.msg.me{margin-left:auto;background:#DCF8C6;border-bottom-right-radius:2px}
.msg.other{margin-right:auto;background:#fff;border-bottom-left-radius:2px}
.msg .name{font-size:12px;color:#075E54;display:block;margin-bottom:2px}
.msg .time{font-size:10px;color:#777;text-align:right;display:block;margin-top:4px}
.blockBtn{font-size:11px;background:#FFEBEE;color:#C62828;border:1px solid #E53935;padding:3px 8px;border-radius:12px;float:right;cursor:pointer}
.date-sep{text-align:center;margin:14px 0}
.date-sep span{background:#fff;padding:6px 14px;border-radius:10px;font-size:12px;color:#555}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#F0F0F0;padding:8px;display:flex;gap:8px;align-items:center}
.bottom input{flex:1;padding:12px;border-radius:25px;border:none;font-size:15px;outline:none}
.bottom button{background:#25D366;color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer}
#blockedMsg{display:none;background:#FFEBEE;border:2px solid #E53935;color:#C62828;text-align:center;padding:12px;margin:12px;border-radius:12px}
</style>
</head>
<body>
<div class="top"><button onclick="location.href='index.html'">⬅️</button><img src="jesus.jpg"><div><b>🙏 ప్రేయర్ గ్రూప్</b><small id="online">● ఆన్‌లైన్ - మరనాత ✝️</small></div><span onclick="alert('🙏 ప్రేయర్ టైమ్ లో - అందరం కలిసి ప్రార్థిద్దాం!')">🔔</span></div>

<div class="prayer-time" id="prayerTime">🙏 <b>ఉదయం 6:00 - ప్రేయర్ టైమ్</b> - ఇక్కడే కలిసి ప్రార్థిద్దాం!</div>

<!-- ✅ అడ్మిన్ మాత్రమే - prayer-chat.html?admin=1 -->
<div id="adminBox">
<b style="color:#7A0C1D">⚙️ అడ్మిన్ ప్యానెల్</b><br><br>
🕐 ప్రేయర్ టైమ్: <input id="prayerTimeInput" type="time" value="06:00">
<button onclick="savePrayerTime()" style="background:#075E54;color:#fff">✅ టైమ్ సేవ్</button><br>
<button onclick="startPrayerLive()" style="background:#FF0000;color:#fff;padding:12px 20px;font-size:15px">🔴 LIVE - ప్రేయర్ స్టార్ట్ - అందరికీ చెప్పండి</button><br>
<small style="color:#666">LIVE నొక్కితే - ఆన్‌లైన్ లో ఉన్న వాళ్ళందరికీ నోటిఫికేషన్ వెళ్తుంది!</small>
</div>

<div id="blockedMsg">🚫 మీరు బ్లాక్ అయ్యారు - మెసేజ్ పంపలేరు!</div>

<div class="quick">
<button onclick="sendQuick('🙏 ఆమెన్!')">🙏 ఆమెన్!</button>
<button onclick="sendQuick('🙏 నా కోసం ప్రార్థించండి')">🙏 నా కోసం ప్రార్థించండి</button>
<button onclick="sendQuick('✝️ ప్రభువా నీకు స్తోత్రం')">✝️ స్తోత్రం</button>
<button onclick="sendQuick('🙏 నా కుటుంబం కోసం ప్రార్థించండి')">🙏 కుటుంబం కోసం</button>
</div>

<div id="msgs"></div>

<div class="bottom"><input id="txt" placeholder="🙏 ప్రార్థన రాయండి..."><button onclick="sendMsg()">➤</button></div>

<script>
const TOPIC='ms2-prayer-chat-2026';
let IS_ADMIN=location.search.includes('admin=1');
if(IS_ADMIN){document.getElementById('adminBox').style.display='block';localStorage.setItem('ms_is_admin','1');}
if(localStorage.getItem('ms_is_admin')==='1' && !IS_ADMIN){/* అడ్మిన్ కి ఎప్పుడూ బ్లాక్ బటన్ కనిపించాలంటే - ?admin=1 తో ఓపెన్ చేయండి */}

// 1. నా పేరు
function myName(){let n=localStorage.getItem('ms_prayer_name');if(!n){n=prompt('🙏 మీ పేరు చెప్పండి:')||'భక్తుడు';localStorage.setItem('ms_prayer_name',n);}return n;}
function myVillage(){return localStorage.getItem('ms_chat_village')||'';}
function timeNow(){let d=new Date();return d.toLocaleString('te-IN',{hour:'numeric',minute:'numeric',hour12:true});}
function loadLocal(){let a=[];try{a=JSON.parse(localStorage.getItem('ms_prayer_local')||'[]');}catch(e){}return a;}
function getBlocked(){try{return JSON.parse(localStorage.getItem('ms_prayer_blocked')||'[]');}catch(e){return [];}}
function getPrayerTime(){return localStorage.getItem('ms_prayer_time')||'06:00';}
function formatTime(t){let h=parseInt(t.split(':')[0]);let m=t.split(':')[1];let ap=h>=12?'PM':'AM';let hh=h%12||12;return hh+':'+m+' '+ap;}

// 2. బ్లాక్ చెక్
function checkBlocked(){
 let b=getBlocked();
 if(b.includes(myName())){
   document.getElementById('blockedMsg').style.display='block';
   document.getElementById('txt').disabled=true;
   return true;
 }
 return false;
}

// 3. చాట్ చూపించడం
function render(){
 let box=document.getElementById('msgs');
 let msgs=loadLocal();
 let blocked=getBlocked();
 msgs=msgs.filter(m=>!blocked.includes(m.name));
 if(!msgs.length){
   box.innerHTML='<div class="date-sep"><span>🙏 ఈరోజు - ప్రేయర్ గ్రూప్ లోకి స్వాగతం!</span></div><div class="msg other"><span class="name">✝️ అడ్మిన్ - BM మహిమ సన్నిధి</span>🙏 మరనాత! ప్రేయర్ టైమ్ లో ఇక్కడే కలిసి ప్రార్థిద్దాం! మీ ప్రార్థన అవసరం ఇక్కడ రాయండి!<span class="time">6:00 AM ✔️</span></div>';
   return;
 }
 box.innerHTML='<div class="date-sep"><span>📅 ఈరోజు - '+formatTime(getPrayerTime())+' ప్రేయర్ టైమ్</span></div>'+msgs.map(m=>{
  let me=m.name===myName();
  let blockBtn=(IS_ADMIN && !me)?'<button class="blockBtn" onclick="blockUser(\''+m.name.replace(/'/g,'')+'\')">🚫 బ్లాక్</button>':'';
  return '<div class="msg '+(me?'me':'other')+'">'+blockBtn+(me?'':'<span class="name">🙏 '+m.name+(m.village?' • 🏡 '+m.village:'')+'</span>')+m.msg+'<span class="time">'+m.time+' '+(me?'✔️✔️':'')+'</span></div>';
 }).join('');
 window.scrollTo(0,document.body.scrollHeight);
}

// 4. మెసేజ్ పంపడం
async function sendMsg(){
 if(checkBlocked()){alert('🚫 మీరు బ్లాక్ అయ్యారు!');return;}
 let t=document.getElementById('txt');let msg=t.value.trim();if(!msg)return;
 let m={name:myName(),village:myVillage(),msg:msg,time:timeNow()};
 let a=loadLocal();a.push(m);localStorage.setItem('ms_prayer_local',JSON.stringify(a));
 try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER|'+m.name+'|'+m.village+'|'+m.msg+'|'+m.time});}catch(e){}
 t.value='';render();
}
function sendQuick(txt){document.getElementById('txt').value=txt;sendMsg();}
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});

// 5. ✅ అడ్మిన్ - టైమ్ సెట్
async function savePrayerTime(){
 let t=document.getElementById('prayerTimeInput').value||'06:00';
 localStorage.setItem('ms_prayer_time',t);
 try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_TIME|'+t});}catch(e){}
 updatePrayerTimeUI();
 alert('✅ ప్రేయర్ టైమ్ - '+formatTime(t)+' కి సెట్ అయ్యింది! అందరికీ తెలిసిపోతుంది!');
}

// 6. ✅ అడ్మిన్ - LIVE స్టార్ట్ - అందరికీ నోటిఫికేషన్
async function startPrayerLive(){
 try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_LIVE|🙏 ప్రేయర్ స్టార్ట్ అయ్యింది! ఇప్పుడే జాయిన్ అవ్వండి!'});}catch(e){}
 alert('🔴 LIVE - అందరికీ నోటిఫికేషన్ వెళ్ళిపోయింది! వాళ్ళు వస్తారు!');
}

// 7. ✅ అడ్మిన్ - బ్లాక్
async function blockUser(name){
 if(!confirm(name+' ని బ్లాక్ చేయాలా?')) return;
 let b=getBlocked();if(!b.includes(name))b.push(name);
 localStorage.setItem('ms_prayer_blocked',JSON.stringify(b));
 try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_BLOCK|'+name});}catch(e){}
 alert('🚫 '+name+' బ్లాక్ అయ్యారు!');
 render();
}

// 8. టైమ్ UI అప్డేట్
function updatePrayerTimeUI(){
 let t=getPrayerTime();
 let el=document.getElementById('prayerTime');
 let now=new Date();let hh=now.getHours();let mm=now.getMinutes();
 let th=parseInt(t.split(':')[0]);let tm=parseInt(t.split(':')[1]);
 if(hh===th && Math.abs(mm-tm)<30){
   el.innerHTML='🙏 <b>🔴 LIVE - ప్రేయర్ టైమ్ నడుస్తోంది! '+formatTime(t)+'</b> - ఇప్పుడే జాయిన్ అవ్వండి!';
   el.style.background='#25D366';el.style.color='#fff';
 }else{
   el.innerHTML='🙏 <b>'+formatTime(t)+' - ప్రేయర్ టైమ్</b> - ఇక్కడే కలిసి ప్రార్థిద్దాం!';
   el.style.background='#FFD54F';el.style.color='#222';
 }
 let inp=document.getElementById('prayerTimeInput');if(inp)inp.value=t;
}

// 9. కొత్త మెసేజ్ లు - ఆన్‌లైన్ వాళ్ళకి తెలిసేలా
async function poll(){
 try{
  let r=await fetch('https://ntfy.sh/'+TOPIC+'/json?since=all&poll=1');
  let txt=await r.text();let a=loadLocal();let changed=false;
  txt.split('\n').filter(Boolean).forEach(l=>{
   try{
    let j=JSON.parse(l);if(!j.message)return;
    if(j.message.startsWith('PRAYER_TIME|')){let t=j.message.split('|')[1];if(t){localStorage.setItem('ms_prayer_time',t);updatePrayerTimeUI();}return;}
    if(j.message.startsWith('PRAYER_BLOCK|')){let n=j.message.split('|')[1];let b=getBlocked();if(n && !b.includes(n)){b.push(n);localStorage.setItem('ms_prayer_blocked',JSON.stringify(b));}checkBlocked();render();return;}
    if(j.message.startsWith('PRAYER_LIVE|')){if(document.hidden){try{new Notification('🙏 ప్రేయర్ స్టార్ట్!',{body:'ఇప్పుడే జాయిన్ అవ్వండి - BM మహిమ సన్నిధి'});}catch(e){}}alert('🔴 🙏 ప్రేయర్ స్టార్ట్ అయ్యింది! ఇప్పుడే జాయిన్ అవ్వండి!');return;}
    if(j.message.startsWith('PRAYER|')){let p=j.message.split('|');if(p.length<5)return;let m={name:p[1],village:p[2],msg:p[3],time:p[4]};if(!a.some(x=>x.msg===m.msg&&x.name===m.name&&x.time===m.time)){a.push(m);changed=true;}}
   }catch(e){}
  });
  if(changed){localStorage.setItem('ms_prayer_local',JSON.stringify(a));render();}
 }catch(e){}
}

checkBlocked();
updatePrayerTimeUI();
render();poll();setInterval(poll,5000);setInterval(updatePrayerTimeUI,60000);
if('Notification' in window && Notification.permission==='default'){Notification.requestPermission();}
</script>
</body>
</html>
