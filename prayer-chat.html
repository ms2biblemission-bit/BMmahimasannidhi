<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🙏 ప్రార్థన చాట్ - BM మహిమ సన్నిధి</title>
<style>
*{box-sizing:border-box;font-weight:900 !important}
body{margin:0;font-family:sans-serif;background:#ECE5DD;padding-bottom:120px}
.top{background:#075E54;color:#fff;padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10}
.top button{background:none;border:none;color:#fff;font-size:22px}
.top b{flex:1}
#toast{display:none;background:#FFD54F;color:#222;text-align:center;padding:10px;font-size:14px;position:sticky;top:60px;z-index:9}
#groupStatus{background:#E8F5E9;color:#2E7D32;text-align:center;padding:10px;font-size:14px}
#speakerBar{display:none;background:#25D366;color:#fff;text-align:center;padding:12px;font-size:15px}
#adminBox{display:none;background:#fff;border:2px solid #FFD54F;padding:12px;margin:12px;border-radius:12px;text-align:center}
#adminBox button{border:none;padding:10px 14px;border-radius:20px;font-size:13px;margin:4px}
#handQueue{display:none;background:#fff;border:2px solid #FFD54F;padding:12px;margin:12px;border-radius:12px}
#recBox{display:none;background:#FFEBEE;border:2px solid #E53935;border-radius:14px;padding:12px;margin:12px;text-align:center}
#msgs{padding:12px 10px}
.msg{max-width:84%;padding:10px 12px;border-radius:14px;margin:8px 0;font-size:15px;background:#fff;word-break:break-word;position:relative}
.msg.me{margin-left:auto;background:#DCF8C6}
.msg.admin{border:2px solid #FFD54F;background:#FFF8E1}
.msg .name{font-size:12px;color:#075E54;display:block}
.msg.admin .name{color:#7A0C1D}
.msg audio{width:100%;margin-top:6px}
.msg .delBtn{background:#E53935;color:#fff;border:none;padding:5px 10px;border-radius:20px;font-size:12px;margin-top:6px;cursor:pointer}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#F0F0F0;padding:8px;display:flex;gap:6px;align-items:center;z-index:20}
.bottom input{flex:1;padding:12px;border-radius:25px;border:none;outline:none;font-size:15px}
.bottom button{border:none;width:48px;height:48px;border-radius:50%;font-size:20px;flex-shrink:0}
.bottom button:disabled{opacity:.4}
#emojiBox{display:none;position:fixed;left:8px;right:8px;bottom:72px;background:#fff;border-radius:16px;padding:12px;z-index:30;text-align:center;box-shadow:0 4px 20px #0003}
#emojiBox span{font-size:28px;padding:6px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><button onclick="location.href='index.html'">⬅️</button><b>🙏 ప్రార్థన చాట్</b></div>
<div id="toast"></div>
<div id="groupStatus">🟢 OPEN</div>
<div id="speakerBar">🎤 <span id="speakerName"></span> ప్రార్థన చేస్తున్నారు... 🙏 మిగతా వాళ్ళు వినండి!</div>
<div id="adminBox"><b style="color:#7A0C1D">👑 అడ్మిన్ - పాస్టర్</b><br><br>
<button onclick="openGroup()" style="background:#25D366;color:#fff">🟢 OPEN</button>
<button onclick="closeGroup()" style="background:#999;color:#fff">🔴 CLOSE</button>
<button onclick="stopSpeaker()" style="background:#222;color:#fff">🔇 ఆపేయి</button><br>
<button onclick="clearChatAdmin()" style="background:#E53935;color:#fff;width:90%">🧹 క్లియర్ చాట్ - అందరికీ క్లియర్ అవుతుంది</button></div>
<div id="handQueue"><b style="color:#7A0C1D">✋ హ్యాండ్ రైస్ చేసిన వారు:</b><div id="handList" style="margin-top:8px"></div></div>
<div id="recBox"><b style="color:#C62828">🔴 రికార్డ్ అవుతుంది... <span id="recTimer">30</span> సెకన్లు!</b><br><button onclick="stopRecording()" style="background:#C62828;color:#fff;padding:10px 18px;border-radius:20px;border:none">⏹️ ఆపేయి + పంపు</button></div>
<div id="msgs"></div>
<div id="emojiBox">
<span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('✝️')">✝️</span><span onclick="addEmoji('😭')">😭</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('👏')">👏</span><span onclick="addEmoji('🕊️')">🕊️</span><br>
<button onclick="document.getElementById('emojiBox').style.display='none'" style="background:#eee;padding:8px 18px;border-radius:20px;border:none">✖️ మూసేయి</button>
</div>
<div class="bottom">
<button onclick="toggleEmoji()" style="background:#FFD54F">😊</button>
<button id="handBtn" onclick="raiseHand()" style="background:#FFD54F">✋</button>
<button id="voiceBtn" onclick="toggleRecord()" style="background:#075E54;color:#fff">🎙️</button>
<input id="txt" placeholder="🙏 నా కోసం ప్రార్థించండి...">
<button id="sendBtn" onclick="sendMsg()" style="background:#25D366;color:#fff">➤</button>
</div>
<script>
const TOPIC='ms2-prayer-chat-2026';
let IS_ADMIN=location.search.includes('admin=1');
if(IS_ADMIN){document.getElementById('adminBox').style.display='block';document.getElementById('handQueue').style.display='block';}
function myName(){let n=localStorage.getItem('ms_prayer_name');if(!n){n=prompt('🙏 మీ పేరు:')||'భక్తుడు';localStorage.setItem('ms_prayer_name',n);}return n;}
let toastTimer=null;
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{e.style.display='none';},4000);}
function isGroupOpen(){return localStorage.getItem('ms_prayer_open')!=='0';}
function getHands(){try{return JSON.parse(localStorage.getItem('ms_prayer_hands')||'[]');}catch(e){return [];}}
function setHands(a){localStorage.setItem('ms_prayer_hands',JSON.stringify(a));}
function getSpeaker(){return localStorage.getItem('ms_prayer_speaker')||'';}
function setSpeaker(n){if(n)localStorage.setItem('ms_prayer_speaker',n);else localStorage.removeItem('ms_prayer_speaker');}
function canSpeak(){if(IS_ADMIN)return true;if(!isGroupOpen())return false;let sp=getSpeaker();if(!sp)return false;return sp===myName();}
function updateGroupUI(){let o=isGroupOpen();let s=document.getElementById('groupStatus');if(o){s.innerText='🟢 OPEN - ✋ హ్యాండ్ రైస్ చేయండి! పాస్టర్ ఓకే ఇస్తేనే మాట్లాడగలరు!';s.style.background='#E8F5E9';s.style.color='#2E7D32';}else{s.innerText='🔴 CLOSE - పాస్టర్ OPEN చేసే వరకు ఆగండి 🙏';s.style.background='#FFEBEE';s.style.color='#C62828';}updateSpeakerUI();}
function updateSpeakerUI(){let sp=getSpeaker();document.getElementById('speakerBar').style.display=sp?'block':'none';document.getElementById('speakerName').textContent=sp;let can=canSpeak();let txt=document.getElementById('txt');let send=document.getElementById('sendBtn');let voice=document.getElementById('voiceBtn');let hand=document.getElementById('handBtn');if(IS_ADMIN){txt.disabled=false;send.disabled=false;voice.disabled=false;txt.placeholder='👑 అడ్మిన్ - మీరు ఎప్పుడైనా మాట్లాడొచ్చు!';}else if(can){txt.disabled=false;send.disabled=false;voice.disabled=false;txt.placeholder='🎤 🟢 మీకు ఓపెన్ అయ్యింది - మాట్లాడండి!';voice.style.background='#25D366';}else{txt.disabled=true;send.disabled=true;voice.disabled=true;txt.placeholder='🔴 మ్యూట్ - ముందు ✋ హ్యాండ్ రైస్ చేయండి!';voice.style.background='#999';}if(sp===myName()&&!IS_ADMIN){hand.style.background='#25D366';hand.textContent='🎤';}else{hand.style.background='#FFD54F';hand.textContent='✋';}if(IS_ADMIN)renderHandQueue();}
function renderHandQueue(){let hands=getHands();document.getElementById('handList').innerHTML=hands.length?hands.map(n=>'<div style="background:#FFF3E0;padding:10px;border-radius:10px;margin:4px;display:flex;justify-content:space-between;align-items:center"><b>✋ '+n+'</b><span><button onclick="approveHand(\''+n+'\')" style="background:#25D366;color:#fff;border:none;padding:8px 12px;border-radius:20px">✅ ఓకే</button><button onclick="rejectHand(\''+n+'\')" style="background:#999;color:#fff;border:none;padding:8px 12px;border-radius:20px">❌ వద్దు</button></span></div>').join(''):'<p style="color:#666">ఇంకా ఎవరూ హ్యాండ్ రైస్ చేయలేదు</p>';}
async function openGroup(){localStorage.setItem('ms_prayer_open','1');try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_OPEN|OPEN'});}catch(e){}updateGroupUI();toast('✅ OPEN అయ్యింది!');}
async function closeGroup(){localStorage.setItem('ms_prayer_open','0');setSpeaker('');setHands([]);try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_CLOSE|CLOSE'});}catch(e){}updateGroupUI();toast('🔴 CLOSE అయ్యింది!');}
async function stopSpeaker(){setSpeaker('');setHands([]);if(IS_ADMIN)setSpeaker(myName());try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_STOP|'});}catch(e){}updateSpeakerUI();toast('🔇 అందరినీ మ్యూట్ చేశారు!');}
async function clearChatAdmin(){if(!confirm('🧹 చాట్ అంతా క్లియర్ చేయాలా? అందరికీ పోతుంది!'))return;localStorage.setItem('ms_prayer_local',JSON.stringify([]));try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_CLEAR|'});}catch(e){}renderMsgs();toast('🧹 క్లియర్ అయ్యింది!');}
async function raiseHand(){let me=myName();if(getSpeaker()===me){toast('🎤 మీకే ఓపెన్ ఉంది!');return;}let h=getHands();if(h.includes(me)){toast('✋ మీరు ఆల్రెడీ హ్యాండ్ రైస్ చేశారు!');return;}h.push(me);setHands(h);try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_HAND|'+me+'|'+Date.now()});}catch(e){}updateSpeakerUI();toast('✋ హ్యాండ్ రైస్ చేశారు! పాస్టర్ ఓకే కోసం ఆగండి!');}
async function approveHand(name){setSpeaker(name);setHands(getHands().filter(n=>n!==name));try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_APPROVE|'+name});}catch(e){}updateSpeakerUI();toast('✅ '+name+' కి ఓపెన్ చేశారు!');}
async function rejectHand(name){setHands(getHands().filter(n=>n!==name));try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_REJECT|'+name});}catch(e){}updateSpeakerUI();}
function toggleEmoji(){let b=document.getElementById('emojiBox');b.style.display=b.style.display==='block'?'none':'block';}
function addEmoji(e){let t=document.getElementById('txt');if(t.disabled){toast('🔴 ముందు ✋ హ్యాండ్ రైస్ చేయండి!');return;}t.value+=' '+e+' ';t.focus();}
function loadLocal(){try{return JSON.parse(localStorage.getItem('ms_prayer_local')||'[]');}catch(e){return [];}}
// ✅ డిలీట్ బటన్ - అడ్మిన్ కి మాత్రమే!
function renderMsgs(){let a=loadLocal();document.getElementById('msgs').innerHTML=a.map(m=>{let isAdmin=m.isAdmin===true;let cls='msg '+(isAdmin?'admin':(m.name===myName()?'me':'')));let label=isAdmin?'👑 '+m.name+' (అడ్మిన్)':'🙏 '+m.name;let audioHtml=m.audio?'<audio controls src="'+m.audio+'"></audio>':'';let textHtml=m.msg?'<div>'+m.msg+'</div>':'';let delHtml=IS_ADMIN?'<br><button class="delBtn" onclick="deleteOneMsg(\''+m.id+'\')">🗑️ డిలీట్ - అందరికీ పోతుంది</button>':'';return '<div class="'+cls+'"><span class="name">'+label+'</span>'+textHtml+audioHtml+delHtml+'</div>';}).join('');window.scrollTo(0,document.body.scrollHeight);}
// ✅ ఒక్క మెసేజ్ డిలీట్ - అందరికీ పోతుంది!
async function deleteOneMsg(id){
if(!IS_ADMIN){toast('❌ అడ్మిన్ మాత్రమే డిలీట్ చేయగలరు!');return;}
if(!confirm('🗑️ ఈ మెసేజ్ డిలీట్ చేయాలా? అందరికీ పోతుంది!'))return;
let a=loadLocal().filter(x=>x.id!==id);
localStorage.setItem('ms_prayer_local',JSON.stringify(a));
renderMsgs();
try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER_DEL|'+id});}catch(e){}
toast('🗑️ డిలీట్ అయ్యింది!');
}
async function sendMsg(){if(!canSpeak()){toast('🔴 మ్యూట్ లో ఉన్నారు! ముందు ✋ హ్యాండ్ రైస్ చేయండి!');return;}let t=document.getElementById('txt');let msg=t.value.trim();if(!msg)return;let m={name:myName(),msg:msg,isAdmin:IS_ADMIN,id:'M'+Date.now()+'_'+Math.random().toString(36).slice(2,6)};let a=loadLocal();a.push(m);localStorage.setItem('ms_prayer_local',JSON.stringify(a));try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'PRAYER|'+m.name+'||'+m.msg+'|'+m.id+'|'+(IS_ADMIN?'1':'0')});}catch(e){}t.value='';document.getElementById('emojiBox').style.display='none';renderMsgs();}
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
let mediaRecorder=null,audioChunks=[],recInterval=null,recLeft=30,recStream=null,isRecording=false;
async function toggleRecord(){if(isRecording){stopRecording();return;}if(!canSpeak()){toast('🔴 మ్యూట్ లో ఉన్నారు! ముందు ✋ హ్యాండ్ రైస్ చేయండి!');return;}try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('⚠️ మైక్ కి Allow నొక్కండి!');return;}audioChunks=[];recLeft=30;isRecording=true;document.getElementById('recBox').style.display='block';document.getElementById('recTimer').innerText='30';document.getElementById('voiceBtn').style.background='#E53935';document.getElementById('voiceBtn').textContent='🔴';try{mediaRecorder=new MediaRecorder(recStream,{audioBitsPerSecond:16000});}catch(e){mediaRecorder=new MediaRecorder(recStream);}mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};mediaRecorder.onstop=()=>{sendVoice();};mediaRecorder.start();recInterval=setInterval(()=>{recLeft--;document.getElementById('recTimer').innerText=recLeft;if(recLeft<=0)stopRecording();},1000);}
function stopRecording(){if(!isRecording)return;clearInterval(recInterval);isRecording=false;document.getElementById('recBox').style.display='none';document.getElementById('voiceBtn').style.background='#075E54';document.getElementById('voiceBtn').textContent='🎙️';if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();if(recStream)recStream.getTracks().forEach(t=>t.stop());}
async function sendVoice(){if(!audioChunks.length)return;let blob=new Blob(audioChunks,{type:'audio/webm'});let reader=new FileReader();reader.onload=async ()=>{let dataUrl=reader.result;let m={name:myName(),msg:'🎙️ వాయిస్ ప్రార్థన - వినండి 👇',audio:dataUrl,isAdmin:IS_ADMIN,id:'V'+Date.now()+'_'+Math.random().toString(36).slice(2,6)};let a=loadLocal();a.push(m);localStorage.setItem('ms_prayer_local',JSON.stringify(a));renderMsgs();toast('✅ 🎙️ వాయిస్ పంపించారు!');let base64=dataUrl.split(',')[1]||'';let CHUNK=8000;let total=Math.ceil(base64.length/CHUNK);for(let i=0;i<total;i++){let part=base64.slice(i*CHUNK,(i+1)*CHUNK);try{await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'VOICE_CHUNK|'+m.id+'|'+i+'|'+total+'|'+m.name+'|'+(IS_ADMIN?'1':'0')+'|'+part});}catch(e){}await new Promise(r=>setTimeout(r,200));}};reader.readAsDataURL(blob);}
let seenIds=new Set();let lastPollTime=Math.floor(Date.now()/1000);let voiceParts={};
async function poll(){try{let r=await fetch('https://ntfy.sh/'+TOPIC+'/json?since='+lastPollTime+'&poll=1');let txt=await r.text();let a=loadLocal();let ch=false;txt.split('\n').filter(Boolean).forEach(l=>{try{let j=JSON.parse(l);if(!j.message)return;if(j.id&&seenIds.has(j.id))return;if(j.id)seenIds.add(j.id);if(j.message.startsWith('PRAYER_OPEN|')){localStorage.setItem('ms_prayer_open','1');updateGroupUI();return;}if(j.message.startsWith('PRAYER_CLOSE|')){localStorage.setItem('ms_prayer_open','0');setSpeaker('');setHands([]);updateGroupUI();return;}if(j.message.startsWith('PRAYER_CLEAR|')){localStorage.setItem('ms_prayer_local',JSON.stringify([]));renderMsgs();return;}
// ✅ డిలీట్ - అందరికీ పోతుంది!
if(j.message.startsWith('PRAYER_DEL|')){let delId=j.message.split('|')[1];let na=loadLocal().filter(x=>x.id!==delId);localStorage.setItem('ms_prayer_local',JSON.stringify(na));renderMsgs();return;}
if(j.message.startsWith('PRAYER_HAND|')){let n=j.message.split('|')[1];let h=getHands();if(n&&!h.includes(n)){h.push(n);setHands(h);}updateSpeakerUI();if(IS_ADMIN)toast('✋ '+n+' హ్యాండ్ రైస్ చేశారు!');return;}if(j.message.startsWith('PRAYER_APPROVE|')){let n=j.message.split('|')[1];setSpeaker(n);setHands(getHands().filter(x=>x!==n));updateSpeakerUI();if(n===myName())toast('✅ 🎉 పాస్టర్ మీకు ఓకే ఇచ్చారు! ఇప్పుడు మాట్లాడండి!');else toast('🎤 '+n+' కి పాస్టర్ ఓకే ఇచ్చారు!');return;}if(j.message.startsWith('PRAYER_REJECT|')){let n=j.message.split('|')[1];setHands(getHands().filter(x=>x!==n));updateSpeakerUI();return;}if(j.message.startsWith('PRAYER_STOP|')){setSpeaker('');setHands([]);updateSpeakerUI();return;}if(j.message.startsWith('VOICE_CHUNK|')){let p=j.message.split('|');let vid=p[1],idx=parseInt(p[2]),total=parseInt(p[3]),vname=p[4],vadmin=p[5]==='1';let part=p.slice(6).join('|');if(!voiceParts[vid])voiceParts[vid]={parts:[],total:total,name:vname,isAdmin:vadmin};voiceParts[vid].parts[idx]=part;let got=voiceParts[vid].parts.filter(Boolean).length;if(got>=total){let full=voiceParts[vid].parts.join('');let dataUrl='data:audio/webm;base64,'+full;if(!a.some(x=>x.id===vid)){a.push({name:vname,msg:'🎙️ వాయిస్ ప్రార్థన - వినండి 👇',audio:dataUrl,isAdmin:vadmin,id:vid});ch=true;}delete voiceParts[vid];}return;}if(j.message.startsWith('PRAYER|')){let p=j.message.split('|');let m={name:p[1],msg:p[3],id:p[4]||('P'+j.time),isAdmin:p[5]==='1'};if(!m.msg||m.msg==='undefined'||m.msg==='')return;if(!a.some(x=>x.id===m.id)){a.push(m);ch=true;}} }catch(e){}});lastPollTime=Math.floor(Date.now()/1000);if(ch){localStorage.setItem('ms_prayer_local',JSON.stringify(a));renderMsgs();}}catch(e){}}
updateGroupUI();renderMsgs();poll();setInterval(poll,5000);
</script>
</body>
</html>
