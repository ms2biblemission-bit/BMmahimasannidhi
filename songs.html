<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 పాటలు - BM మహిమ సన్నిధి</title>
<style>
*{box-sizing:border-box} body{font-family:system-ui;margin:0;background:#E8F5E9;padding-bottom:130px}
.header{background:#0B3D2E;color:white;padding:20px 12px;text-align:center;border-radius:0 0 28px 28px}
.header a{color:white;text-decoration:none;font-weight:bold}
.wrap{padding:12px;max-width:700px;margin:auto}
.card{background:white;padding:15px;border-radius:18px;margin:12px 0;box-shadow:0 2px 8px #0001;cursor:pointer;display:flex;gap:12px;align-items:center}
.icon{width:68px;height:68px;min-width:68px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;color:white;font-weight:bold;overflow:hidden}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #C8E6C9;font-size:16px;background:white}
input:focus{outline:2px solid #0B3D2E;border-color:#0B3D2E}
.num{width:44px;height:44px;min-width:44px;border-radius:50%;background:#0B3D2E;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center}
.modalBox{background:white;width:100%;max-width:600px;height:78vh;max-height:78vh;border-radius:20px 20px 0 0;padding:0;overflow:hidden;display:flex;flex-direction:column;margin-bottom:70px}
.modalScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 40px}
.back{background:#0B3D2E;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#0B3D2E;display:flex;justify-content:space-around;align-items:center;padding:8px 2px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.25)}
.bottom-nav a,.bottom-nav button{flex:1;background:transparent;border:none;color:white;text-decoration:none;text-align:center;font-size:12px;font-weight:bold;padding:6px 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom-nav .b-icon{font-size:22px;line-height:1}
.bottom-nav .active{background:rgba(255,255,255,.18);border-radius:12px}
.songImg{width:100%;border-radius:12px;max-height:300px;object-fit:cover;margin:10px 0}
.ytBox{margin:12px 0;text-align:center}
.ytBox img{width:100%;border-radius:12px}
.ytBtn{display:block;background:#FF0000;color:#fff!important;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;margin-top:6px}
.mp3Box audio{width:100%}
.linkBtn{display:block;background:#0B3D2E;color:#fff!important;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;margin:12px 0;text-align:center}
.searchWrap{position:relative}
.suggestBox{background:white;border-radius:16px;box-shadow:0 4px 16px #0002;margin-top:8px;overflow:hidden;display:none;max-height:55vh;overflow-y:auto}
.suggestRow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}
.suggestRow:last-child{border-bottom:none}
.suggestRow:active{background:#E8F5E9}
.suggestRow b{font-size:18px;color:#0B3D2E}
</style>
</head>
<body>
<div class="header">
<a href="index.html">← హోమ్</a>
<h2 style="margin:8px 0 0">📖 BM మహిమ సన్నిధి</h2>
<div style="font-size:13px;opacity:.9">సన్నిధి వర్తమానములు - సన్నిధి సహవాసం</div>
</div>
<div class="wrap">
<div id="folderView"></div>
<div id="songView" style="display:none"></div>
</div>
<div class="modal" id="songModal"><div class="modalBox"><div style="text-align:right;padding:12px 12px 0;flex-shrink:0"><button onclick="closeSong()" style="border:none;background:#eee;padding:8px 14px;border-radius:20px;font-weight:bold">✖️ మూసేయండి</button></div><div class="modalScroll"><div id="songModalContent"></div><div style="text-align:center;color:gray;font-size:13px;margin-top:20px">🙏 పాట పూర్తయింది</div></div></div></div>
<nav class="bottom-nav">
  <a href="index.html"><span class="b-icon">🏠</span>హోమ్</a>
  <a href="books.html"><span class="b-icon">📚</span>పుస్తకాలు</a>
  <a href="songs.html" class="active"><span class="b-icon">🎵</span>పాటలు</a>
  <a href="voice.html"><span class="b-icon">🎤</span>వాయిస్<br>గ్యాలరీ</a>
  <button onclick="history.back()"><span class="b-icon">⬅️</span>బ్యాక్</button>
</nav>
<script>
let allSongs=[];
let curFolder="";
let curList=[];
let colors=["#FF9800","#2E7D32","#2196F3","#9C27B0","#E91E63","#009688","#FF5722","#673AB7"];
async function load(){
  try{let r=await fetch('songs.json?v='+Date.now()); allSongs=await r.json();}catch(e){allSongs=[];}
  if(!allSongs.length){ try{let ls=JSON.parse(localStorage.getItem('ms_songs')||'[]'); if(ls.length) allSongs=ls;}catch(e){} }
  else{ try{localStorage.setItem('ms_songs',JSON.stringify(allSongs));}catch(e){} }
  showFolders();
}
function getFolder(s){ return (s.book||s.folder||s.author||"ఆంధ్ర క్రైస్తవ కీర్తనలు").trim(); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getSongNum(s){ let m=(s||'').toString().match(/(\d+)/); return m?parseInt(m[1]):9999; }
function teluguCompare(a,b){ let na=getSongNum(a), nb=getSongNum(b); if(na!==nb) return na-nb; if(a<b) return -1; if(a>b) return 1; return 0; }
function getDisplayNum(song){ let list=allSongs.filter(s=>getFolder(s)===getFolder(song)).sort((a,b)=>(a.num||0)-(b.num||0)); let idx=list.indexOf(song); return idx>=0 ? idx+1 : (song.num||1); }
function fixT(s){ if(!s) return ''; try{ if(/[\u00C0-\u00FF]/.test(s)||s.indexOf('Ã')>=0){ let b=new Uint8Array([...s].map(c=>c.charCodeAt(0)&255)); let d=new TextDecoder('utf-8').decode(b); if(d.indexOf('[STRIPPED 3 bytes]')===-1) return d; } }catch(e){} return s; }
function linkHTML(l){
  if(!l) return "";
  let m=l.match(/(?:youtube\.com\/.*v=|youtu\.be\/|shorts\/)([^&\?\/]+)/);
  if(m) return `<div class="ytBox"><a href="${l}" target="_blank"><img src="https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg"></a><a class="ytBtn" href="${l}" target="_blank">▶️ YouTube లో ఓపెన్ చేయండి</a></div>`;
  if(l.match(/\.mp3|\.m4a|\.wav|drive\.google/i)) return `<div class="mp3Box"><audio controls src="${l}"></audio><br><a href="${l}" target="_blank">🎙️ వినండి</a></div>`;
  if(l.match(/\.pdf/i)) return `<a class="linkBtn" href="${l}" target="_blank">📖 PDF చూడండి</a>`;
  return `<a class="linkBtn" href="${l}" target="_blank">🔗 ఓపెన్ చేయండి</a>`;
}
// ✅ MAIN PAGE - పైన సెర్చ్ నొక్కగానే అన్ని పాటలు
function showFolders(){
  document.getElementById('songView').style.display='none';
  let folders={};
  allSongs.forEach(s=>{let f=getFolder(s); folders[f]=(folders[f]||0)+1;});
  let keys=Object.keys(folders).sort(teluguCompare);
  window._folderKeys=keys; window._folders=folders;
  let html=`<div style="background:white;padding:16px;border-radius:18px;text-align:center;box-shadow:0 2px 8px #0001"><div style="font-size:28px">🎵</div><div style="font-size:22px;font-weight:bold;color:#0B3D2E">పాటలు - ఫోల్డర్లు</div><div style="color:gray">మొత్తం ఫోల్డర్లు - ${keys.length} | మొత్తం పాటలు - ${allSongs.length}</div></div>`;
  html+=`<div class="searchWrap" style="margin-top:12px"><input id="searchFolder" placeholder="🔍 ఫోల్డర్ / పాట వెతకండి..." oninput="filterFolders()" onfocus="showSuggestMain()" autocomplete="off"><div id="suggestMain" class="suggestBox"></div></div>`;
  html+=`<div id="folderList"></div><div id="songSearchList"></div>`;
  if(!keys.length) html+=`<p style="text-align:center;color:gray">📭 ఇంకా పాటలు లేవు!</p>`;
  document.getElementById('folderView').innerHTML=html;
  document.getElementById('folderView').style.display='block';
  renderFolderCards(keys);
}
// ✅ పైన సెర్చ్ లో - అన్ని ఫోల్డర్ల పాటలు కలిపి చూపించేది
function showSuggestMain(){
  let q=(document.getElementById('searchFolder').value||'').toLowerCase().trim();
  let box=document.getElementById('suggestMain'); if(!box) return;
  // q ఖాళీగా ఉంటే అన్ని పాటలు, టైప్ చేస్తే ఆ పాటలు మాత్రమే - అన్ని ఫోల్డర్ల నుండి
  let filtered=allSongs.filter(s=>((s.title||'')+' '+getFolder(s)).toLowerCase().includes(q));
  // ఫోల్డర్ వారీగా వరసగా పెట్టు
  filtered.sort((a,b)=>{ let fa=getFolder(a), fb=getFolder(b); if(fa!==fb) return fa<fb?-1:1; return (a.num||0)-(b.num||0); });
  if(!filtered.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block';
  box.innerHTML=`<div style="background:#0B3D2E;color:white;padding:10px 14px;font-weight:bold">🎵 అన్ని పాటలు - ${filtered.length} దొరికాయి <span style="font-weight:normal;font-size:13px;opacity:.85">• నొక్కి చదవండి</span></div>`;
  filtered.forEach(s=>{
    let gi=allSongs.indexOf(s);
    let row=document.createElement('div'); row.className='suggestRow';
    let n=document.createElement('div'); n.className='num'; n.style.width='36px'; n.style.height='36px'; n.style.fontSize='15px'; n.textContent=getDisplayNum(s);
    let txt=document.createElement('div'); txt.style.flex='1';
    let b=document.createElement('b'); b.textContent=s.title||'';
    let small=document.createElement('div'); small.style.cssText='color:gray;font-size:13px'; small.textContent='📁 '+getFolder(s);
    txt.appendChild(b); txt.appendChild(small);
    let arr=document.createElement('div'); arr.textContent='➡️'; arr.style.color='#888';
    row.appendChild(n); row.appendChild(txt); row.appendChild(arr);
    row.onclick=()=>{ document.getElementById('searchFolder').value=''; box.style.display='none'; openSong(gi); };
    box.appendChild(row);
  });
}
function renderFolderCards(keys){
  let fl=document.getElementById('folderList'); if(!fl) return; fl.innerHTML='';
  keys.forEach((f,i)=>{
    let c=colors[i%colors.length];
    let d=document.createElement('div'); d.className='card'; d.dataset.folder=f;
    let icon=document.createElement('div'); icon.className='icon'; icon.style.background=c; icon.textContent='📁';
    let txt=document.createElement('div');
    let t1=document.createElement('div'); t1.style.cssText='font-size:19px;font-weight:bold;color:#0B3D2E'; t1.textContent=f;
    let t2=document.createElement('div'); t2.style.color='gray'; t2.textContent='🎵 '+window._folders[f]+' పాటలు - నొక్కి చదవండి ➡️';
    txt.appendChild(t1); txt.appendChild(t2);
    d.appendChild(icon); d.appendChild(txt);
    d.onclick=()=>openFolder(f);
    fl.appendChild(d);
  });
}
function filterFolders(){
  showSuggestMain();
  let q=(document.getElementById('searchFolder').value||'').toLowerCase().trim();
  let sl=document.getElementById('songSearchList');
  if(!q){ renderFolderCards(window._folderKeys||[]); sl.innerHTML=''; return; }
  let matchedFolders=(window._folderKeys||[]).filter(f=>f.toLowerCase().includes(q));
  renderFolderCards(matchedFolders);
  sl.innerHTML='';
}
function openFolder(f){
  curFolder=f;
  document.getElementById('folderView').style.display='none';
  curList=allSongs.filter(s=>getFolder(s)===f).sort((a,b)=>(a.num||0)-(b.num||0));
  let html=`<button class="back" onclick="showFolders()">← అన్ని ఫోల్డర్లు</button>
  <div style="background:white;padding:16px;border-radius:18px;text-align:center;margin-top:12px;box-shadow:0 2px 8px #0001"><div style="font-size:28px">📁</div><div style="font-size:22px;font-weight:bold;color:#0B3D2E">${esc(f)}</div><div style="color:gray">మొత్తం పాటలు - ${curList.length}</div></div>
  <div class="searchWrap" style="margin-top:12px"><input id="searchSong" placeholder="🔍 పాట వెతకండి..." oninput="filterSongs()" onfocus="showSuggest()" autocomplete="off"><div id="suggestBox" class="suggestBox"></div></div>
  <div id="songList" style="margin-top:12px"></div>`;
  let v=document.getElementById('songView'); v.innerHTML=html; v.style.display='block';
  renderSongCards(curList);
  window.scrollTo(0,0);
}
function renderSongCards(list){
  let sl=document.getElementById('songList'); if(!sl) return; sl.innerHTML='';
  if(!list.length){ sl.innerHTML=`<p style="text-align:center;color:gray">📭 ఈ ఫోల్డర్ లో పాటలు లేవు!</p>`; return; }
  list.forEach((s,idx)=>{
    let gi=allSongs.indexOf(s);
    let d=document.createElement('div'); d.className='card';
    let n=document.createElement('div'); n.className='num'; n.textContent=idx+1;
    let txt=document.createElement('div');
    let t1=document.createElement('div'); t1.style.cssText='font-size:19px;font-weight:bold;color:#0B3D2E'; t1.textContent=(idx+1)+'. '+(s.title||'');
    let t2=document.createElement('div'); t2.style.cssText='color:gray;font-size:13px'; t2.textContent='📁 '+curFolder+' - నొక్కి చదవండి ➡️';
    txt.appendChild(t1); txt.appendChild(t2);
    d.appendChild(n); d.appendChild(txt);
    d.onclick=()=>openSong(gi);
    sl.appendChild(d);
  });
}
function showSuggest(){
  let q=(document.getElementById('searchSong').value||'').toLowerCase().trim();
  let box=document.getElementById('suggestBox'); if(!box) return;
  let filtered=curList.filter(s=>(s.title||'').toLowerCase().includes(q));
  if(!filtered.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block';
  box.innerHTML='';
  filtered.forEach(s=>{
    let gi=allSongs.indexOf(s);
    let row=document.createElement('div'); row.className='suggestRow';
    let n=document.createElement('div'); n.className='num'; n.style.width='36px'; n.style.height='36px'; n.style.fontSize='15px'; n.textContent=curList.indexOf(s)+1;
    let b=document.createElement('b'); b.textContent=s.title||'';
    let sp=document.createElement('div'); sp.style.cssText='flex:1'; sp.appendChild(b);
    let arr=document.createElement('div'); arr.textContent='➡️'; arr.style.color='#888';
    row.appendChild(n); row.appendChild(sp); row.appendChild(arr);
    row.onclick=()=>{ document.getElementById('searchSong').value=''; box.style.display='none'; openSong(gi); };
    box.appendChild(row);
  });
}
function filterSongs(){
  let q=(document.getElementById('searchSong').value||'').toLowerCase().trim();
  showSuggest();
  let filtered=curList.filter(s=>(s.title||'').toLowerCase().includes(q));
  renderSongCards(filtered);
  if(!q){ let box=document.getElementById('suggestBox'); if(box) box.style.display='none'; }
}
function openSong(i){
  let s=allSongs[i]; if(!s) return;
  let dNum=getDisplayNum(s);
  let img=s.img||s.image||s.photo||"";
  let link=s.link||s.url||"";
  let msg=fixT(s.content||s.msg||"");
  let title=fixT(s.title||"");
  document.getElementById('songModalContent').innerHTML=`<div style="text-align:center"><div style="font-size:14px;color:gray">📁 ${esc(getFolder(s))}</div>${img?`<img class="songImg" src="${img}">`:""}<h2 style="color:#0B3D2E;margin:6px 0"></h2>${linkHTML(link)}<div style="white-space:pre-line;font-size:18px;line-height:1.9;text-align:center"></div>${linkHTML(link)}</div>`;
  let h=document.querySelector('#songModalContent h2'); if(h) h.textContent=dNum+'. '+title;
  let md=document.querySelector('#songModalContent div[style*="white-space"]'); if(md) md.textContent=msg;
  document.getElementById('songModal').style.display='flex';
  let sc=document.querySelector('#songModal .modalScroll'); if(sc) sc.scrollTop=0;
}
function closeSong(){ document.getElementById('songModal').style.display='none'; }
document.getElementById('songModal').addEventListener('click',e=>{ if(e.target.id==='songModal') closeSong(); });
document.addEventListener('click',e=>{ if(!e.target.closest('.searchWrap')){ let b1=document.getElementById('suggestMain'); if(b1) b1.style.display='none'; let b2=document.getElementById('suggestBox'); if(b2) b2.style.display='none'; } });
load();
</script>
</body>
</html>
