<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 పాటలు - BM మహిమ సన్నిధి</title>
<style>
*{box-sizing:border-box} body{font-family:system-ui;margin:0;background:#E8F5E9;padding-bottom:130px}
.header{background:#0B3D2E;color:white;padding:20px 12px;text-align:center;border-radius:0 0 28px 28px}
.header a{color:white;text-decoration:none;font-weight:bold}
.wrap{padding:12px;max-width:700px;margin:auto}
.card{background:white;padding:15px;border-radius:18px;margin:12px 0;box-shadow:0 2px 8px #0001;cursor:pointer;display:flex;gap:12px;align-items:center}
.icon{width:68px;height:68px;min-width:68px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;color:white;font-weight:bold}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #C8E6C9;font-size:16px;background:white}
.num{width:44px;height:44px;min-width:44px;border-radius:50%;background:#0B3D2E;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center}
.modalBox{background:white;width:100%;max-width:600px;height:78vh;max-height:78vh;border-radius:20px 20px 0 0;padding:0;overflow:hidden;display:flex;flex-direction:column;margin-bottom:70px}
.modalScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 40px}
.back{background:#0B3D2E;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#0B3D2E;display:flex;justify-content:space-around;align-items:center;padding:8px 2px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.25)}
.bottom-nav a,.bottom-nav button{flex:1;background:transparent;border:none;color:white;text-decoration:none;text-align:center;font-size:12px;font-weight:bold;padding:6px 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom-nav .b-icon{font-size:22px;line-height:1}
.bottom-nav .active{background:rgba(255,255,255,.18);border-radius:12px}
.songImg{width:100%;border-radius:12px;max-height:300px;object-fit:cover;margin:10px 0}
.ytBox{margin:12px 0;text-align:center}
.ytBox img{width:100%;border-radius:12px}
.ytBtn{display:block;background:#FF0000;color:#fff!important;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;margin-top:6px}
.mp3Box audio{width:100%}
.linkBtn{display:block;background:#0B3D2E;color:#fff!important;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;margin:12px 0;text-align:center}
</style>
</head>
<body>
<div class="header">
<a href="index.html">← హోమ్</a>
<h2 style="margin:8px 0 0">📖 BM మహిమ సన్నిధి</h2>
<div style="font-size:13px;opacity:.9">సన్నిధి వర్తమానములు - సన్నిధి సహవాసం</div>
</div>
<div class="wrap">
<div id="folderView"></div>
<div id="songView" style="display:none"></div>
</div>
<div class="modal" id="songModal"><div class="modalBox"><div style="text-align:right;padding:12px 12px 0;flex-shrink:0"><button onclick="closeSong()" style="border:none;background:#eee;padding:8px 14px;border-radius:20px;font-weight:bold">✖️ మూసేయండి</button></div><div class="modalScroll"><div id="songModalContent"></div><div style="text-align:center;color:gray;font-size:13px;margin-top:20px">🙏 పాట పూర్తయింది</div></div></div></div>
<nav class="bottom-nav">
  <a href="index.html"><span class="b-icon">🏠</span>హోమ్</a>
  <a href="books.html"><span class="b-icon">📚</span>పుస్తకాలు</a>
  <a href="songs.html" class="active"><span class="b-icon">🎵</span>పాటలు</a>
  <a href="voice.html"><span class="b-icon">🎤</span>వాయిస్<br>గ్యాలరీ</a>
  <button onclick="history.back()"><span class="b-icon">⬅️</span>బ్యాక్</button>
</nav>
<script>
let allSongs=[];
let curFolder="";
let colors=["#FF9800","#2E7D32","#2196F3","#9C27B0","#E91E63","#009688","#FF5722","#673AB7"];
async function load(){
  try{let r=await fetch('songs.json?v='+Date.now()); allSongs=await r.json();}catch(e){allSongs=[];}
  // FIX: పాత localStorage తో కొత్త songs.json ని తొక్కేయకూడదు. fetch fail అయితే మాత్రమే localStorage వాడాలి
  if(!allSongs.length){ try{let ls=JSON.parse(localStorage.getItem('ms_songs')||'[]'); if(ls.length) allSongs=ls;}catch(e){} }
  else{ try{localStorage.setItem('ms_songs',JSON.stringify(allSongs));}catch(e){} }
  showFolders();
}
function getFolder(s){ return (s.book||s.folder||s.author||"ఆంధ్ర క్రైస్తవ కీర్తనలు").trim(); }
function teluguKey(s){
  s=(s||'').toString();
  if(s.includes(' - ')) s=s.split(' - ').pop();
  s=s.replace(/[^A-Za-z0-9\u0C00-\u0C7F ]/g,'').trim();
  return s;
}
function teluguCompare(a,b){
  let ka=teluguKey(a), kb=teluguKey(b);
  function group(str){
    let ch=str.charAt(0);
    if(ch>='0' && ch<='9') return 0;
    if((ch>='A' && ch<='Z') || (ch>='a' && ch<='z')) return 1;
    return 2;
  }
  let ga=group(ka), gb=group(kb);
  if(ga!==gb) return ga-gb;
  if(ka<kb) return -1;
  if(ka>kb) return 1;
  return 0;
}
function getDisplayNum(song){
  let list=allSongs.filter(s=>getFolder(s)===getFolder(song)).sort((a,b)=>(a.num||0)-(b.num||0));
  let idx=list.indexOf(song);
  return idx>=0 ? idx+1 : (song.num||1);
}
function fixT(s){ if(!s) return ''; try{ if(/[\u00C0-\u00FF]/.test(s)||s.indexOf('Ã')>=0){ let b=new Uint8Array([...s].map(c=>c.charCodeAt(0)&255)); let d=new TextDecoder('utf-8').decode(b); if(d.indexOf('[STRIPPED 3 bytes]')===-1) return d; } }catch(e){} return s; }
function linkHTML(l){
  if(!l) return "";
  let m=l.match(/(?:youtube\.com\/.*v=|youtu\.be\/|shorts\/)([^&\?\/]+)/);
  if(m) return `<div class="ytBox"><a href="${l}" target="_blank"><img src="https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg"></a><a class="ytBtn" href="${l}" target="_blank">▶️ YouTube లో ఓపెన్ చేయండి</a></div>`;
  if(l.match(/\.mp3|\.m4a|\.wav|drive\.google/i)) return `<div class="mp3Box"><audio controls src="${l}"></audio><br><a href="${l}" target="_blank">🎙️ వినండి</a></div>`;
  if(l.match(/\.pdf/i)) return `<a class="linkBtn" href="${l}" target="_blank">📖 PDF చూడండి</a>`;
  return `<a class="linkBtn" href="${l}" target="_blank">🔗 ఓపెన్ చేయండి</a>`;
}
function showFolders(){
  document.getElementById('songView').style.display='none';
  let folders={};
  allSongs.forEach(s=>{let f=getFolder(s); folders[f]=(folders[f]||0)+1;});
  let keys=Object.keys(folders).sort(teluguCompare);
  let html=`<div style="background:white;padding:16px;border-radius:18px;text-align:center;box-shadow:0 2px 8px #0001"><div style="font-size:28px">🎵</div><div style="font-size:22px;font-weight:bold;color:#0B3D2E">పాటలు - ఫోల్డర్లు</div><div style="color:gray">మొత్తం ఫోల్డర్లు - ${keys.length} | మొత్తం పాటలు - ${allSongs.length}</div><div style="color:#2E7D32;font-size:13px;margin-top:4px">🔤 1 2 3 → A-Z → అ-ఱ ఆర్డర్ లో</div></div>`;
  html+=`<input id="searchFolder" placeholder="🔍 ఫోల్డర్ వెతకండి... దేవదాసు / అన్నమ్మ" oninput="filterFolders()" style="margin-top:12px">`;
  html+=`<div id="folderList"></div>`;
  if(!keys.length) html+=`<p style="text-align:center;color:gray">📭 ఇంకా పాటలు లేవు!</p>`;
  document.getElementById('folderView').innerHTML=html;
  document.getElementById('folderView').style.display='block';
  let fl=document.getElementById('folderList');
  keys.forEach((f,i)=>{
    let c=colors[i%colors.length];
    let d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div class="icon" style="background:${c}">📁</div><div><div style="font-size:19px;font-weight:bold;color:#0B3D2E"></div><div style="color:gray">🎵 ${folders[f]} పాటలు - నొక్కి చదవండి ➡️</div></div>`;
    d.querySelector('div div').textContent=f;
    d.onclick=()=>openFolder(f);
    fl.appendChild(d);
  });
}
function filterFolders(){
  let q=(document.getElementById('searchFolder').value||'').toLowerCase().trim();
  document.querySelectorAll('#folderList .card').forEach(c=>{ c.style.display=(c.textContent||'').toLowerCase().includes(q)?'flex':'none'; });
}
function openFolder(f){
  curFolder=f;
  document.getElementById('folderView').style.display='none';
  let list=allSongs.filter(s=>getFolder(s)===f).sort((a,b)=>(a.num||0)-(b.num||0));
  let html=`<button class="back" onclick="showFolders()">← అన్ని ఫోల్డర్లు</button>
  <div style="background:white;padding:16px;border-radius:18px;text-align:center;margin-top:12px;box-shadow:0 2px 8px #0001"><div style="font-size:28px">📁</div><div style="font-size:22px;font-weight:bold;color:#0B3D2E" id="curFolderName"></div><div style="color:gray">మొత్తం పాటలు - ${list.length}</div></div>
  <input id="searchSong" placeholder="🔍 పాట వెతకండి..." oninput="filterSongs()" style="margin-top:12px">`;
  html+=`<div id="songList"></div>`;
  let v=document.getElementById('songView'); v.innerHTML=html; v.style.display='block';
  document.getElementById('curFolderName').textContent=f;
  let sl=document.getElementById('songList');
  list.forEach((s,idx)=>{
    let gi=allSongs.indexOf(s);
    let dNum=idx+1;
    let d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div class="num">${dNum}</div><div><div style="font-size:19px;font-weight:bold;color:#0B3D2E"></div><div style="color:gray;font-size:13px">📁 ${f} - నొక్కి చదవండి ➡️</div></div>`;
    d.querySelectorAll('div div')[0].textContent=dNum+'. '+(s.title||'');
    d.onclick=()=>openSong(gi);
    sl.appendChild(d);
  });
  if(!list.length) sl.innerHTML=`<p style="text-align:center;color:gray">📭 ఈ ఫోల్డర్ లో పాటలు లేవు!</p>`;
  window.scrollTo(0,0);
}
function filterSongs(){
  let q=(document.getElementById('searchSong').value||'').toLowerCase().trim();
  document.querySelectorAll('#songList .card').forEach(c=>{ c.style.display=(c.textContent||'').toLowerCase().includes(q)?'flex':'none'; });
}
function openSong(i){
  let s=allSongs[i]; if(!s) return;
  let dNum=getDisplayNum(s);
  let img=s.img||s.image||s.photo||"";
  let link=s.link||s.url||"";
  let msg=fixT(s.content||s.msg||"");
  let title=fixT(s.title||"");
  let tmp=document.createElement('div'); tmp.textContent=dNum+'. '+title;
  document.getElementById('songModalContent').innerHTML=`<div style="text-align:center"><div style="font-size:14px;color:gray">📁 ${getFolder(s)}</div>${img?`<img class="songImg" src="${img}">`:""}<h2 style="color:#0B3D2E;margin:6px 0" id="songTitleH"></h2>${linkHTML(link)}<div style="white-space:pre-line;font-size:18px;line-height:1.9;text-align:center" id="songMsgDiv"></div>${linkHTML(link)}</div>`;
  document.getElementById('songTitleH').textContent=dNum+'. '+title;
  document.getElementById('songMsgDiv').textContent=msg;
  document.getElementById('songModal').style.display='flex';
  let sc=document.querySelector('#songModal .modalScroll'); if(sc) sc.scrollTop=0;
}
function closeSong(){ document.getElementById('songModal').style.display='none'; }
document.getElementById('songModal').addEventListener('click',e=>{ if(e.target.id==='songModal') closeSong(); });
load();
</script>
</body>
</html>
