<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 పాటలు - BM మహిమ సన్నిధి</title>
<style>
*{box-sizing:border-box} body{font-family:system-ui;margin:0;background:#E8F5E9;padding-bottom:80px}
.header{background:#0B3D2E;color:white;padding:20px 12px;text-align:center;border-radius:0 0 28px 28px}
.header a{color:white;text-decoration:none;font-weight:bold}
.wrap{padding:12px;max-width:700px;margin:auto}
.card{background:white;padding:15px;border-radius:18px;margin:12px 0;box-shadow:0 2px 8px #0001;cursor:pointer;display:flex;gap:12px;align-items:center}
.icon{width:68px;height:68px;min-width:68px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;color:white;font-weight:bold}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #C8E6C9;font-size:16px;background:white}
.num{width:44px;height:44px;min-width:44px;border-radius:50%;background:#0B3D2E;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:flex-end;justify-content:center}
.modalBox{background:white;width:100%;max-width:600px;max-height:88vh;border-radius:20px 20px 0 0;padding:18px;overflow-y:auto}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd;z-index:50}
.bottom a{text-decoration:none;color:#666;text-align:center;font-size:13px}
.bottom a.active{color:#0B3D2E;font-weight:bold}
.back{background:#0B3D2E;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<a href="index.html">← హోమ్</a>
<h2 style="margin:8px 0 0">📖 BM మహిమ సన్నిధి</h2>
<div style="font-size:13px;opacity:.9">సన్నిధి వర్తమానములు - సన్నిధి సహవాసం</div>
</div>
<div class="wrap">
<div id="folderView"></div>
<div id="songView" style="display:none"></div>
</div>

<div class="modal" id="songModal"><div class="modalBox"><div style="text-align:right"><button onclick="closeSong()" style="border:none;background:#eee;padding:8px 14px;border-radius:20px;font-weight:bold">✖️ మూసేయండి</button></div><div id="songModalContent"></div></div></div>

<div class="bottom">
<a href="index.html">🏠<br>హోమ్</a>
<a href="books.html">📚<br>పుస్తకాలు</a>
<a href="songs.html" class="active">🎵<br>పాటలు</a>
<a href="admin.html">⚙️<br>సెట్టింగ్</a>
</div>

<script>
let allSongs=[];
let curFolder="";
let colors=["#FF9800","#2E7D32","#2196F3","#9C27B0","#E91E63","#009688","#FF5722","#673AB7"];
async function load(){
  try{let r=await fetch('songs.json?v='+Date.now()); allSongs=await r.json();}catch(e){allSongs=[];}
  showFolders();
}
function getFolder(s){ return (s.book||s.folder||s.author||"ఆంధ్ర క్రైస్తవ కీర్తనలు").trim(); }
function showFolders(){
  document.getElementById('songView').style.display='none';
  let folders={};
  allSongs.forEach(s=>{let f=getFolder(s); folders[f]=(folders[f]||0)+1;});
  let keys=Object.keys(folders).sort();
  let html=`<div style="background:white;padding:16px;border-radius:18px;text-align:center;box-shadow:0 2px 8px #0001"><div style="font-size:28px">🎵</div><div style="font-size:22px;font-weight:bold;color:#0B3D2E">పాటలు - ఫోల్డర్లు</div><div style="color:gray">మొత్తం ఫోల్డర్లు - ${keys.length} | మొత్తం పాటలు - ${allSongs.length}</div></div>`;
  html+=`<input id="searchFolder" placeholder="🔍 ఫోల్డర్ వెతకండి... దేవదాసు / అన్నమ్మ" oninput="filterFolders()" style="margin-top:12px">`;
  html+=`<div id="folderList">`+keys.map((f,i)=>{
    let c=colors[i%colors.length];
    return `<div class="card" onclick="openFolder('${f.replace(/'/g,"\\'")}')"><div class="icon" style="background:${c}">📁</div><div><div style="font-size:19px;font-weight:bold;color:#0B3D2E">${f}</div><div style="color:gray">🎵 ${folders[f]} పాటలు - నొక్కి చదవండి ➡️</div></div></div>`;
  }).join('')+`</div>`;
  if(!keys.length) html+=`<p style="text-align:center;color:gray">📭 ఇంకా పాటలు లేవు!</p>`;
  document.getElementById('folderView').innerHTML=html;
  document.getElementById('folderView').style.display='block';
}
function filterFolders(){
  let q=document.getElementById('searchFolder').value.toLowerCase();
  document.querySelectorAll('#folderList .card').forEach(c=>{ c.style.display=c.innerText.toLowerCase().includes(q)?'flex':'none'; });
}
function openFolder(f){
  curFolder=f;
  document.getElementById('folderView').style.display='none';
  let list=allSongs.filter(s=>getFolder(s)===f).sort((a,b)=>(a.num||0)-(b.num||0));
  let html=`<button class="back" onclick="showFolders()">← అన్ని ఫోల్డర్లు</button>
  <div style="background:white;padding:16px;border-radius:18px;text-align:center;margin-top:12px;box-shadow:0 2px 8px #0001"><div style="font-size:28px">📁</div><div style="font-size:22px;font-weight:bold;color:#0B3D2E">${f}</div><div style="color:gray">మొత్తం పాటలు - ${list.length}</div></div>
  <input id="searchSong" placeholder="🔍 పాట వెతకండి..." oninput="filterSongs()" style="margin-top:12px">`;
  html+=`<div id="songList">`+list.map((s,idx)=>{
    let gi=allSongs.indexOf(s);
    return `<div class="card" onclick="openSong(${gi})"><div class="num">${s.num||idx+1}</div><div><div style="font-size:19px;font-weight:bold;color:#0B3D2E">${s.num||idx+1}. ${s.title||''}</div><div style="color:gray;font-size:13px">📁 ${f} - నొక్కి చదవండి ➡️</div></div></div>`;
  }).join('')+`</div>`;
  let v=document.getElementById('songView'); v.innerHTML=html; v.style.display='block';
  window.scrollTo(0,0);
}
function filterSongs(){
  let q=document.getElementById('searchSong').value.toLowerCase();
  document.querySelectorAll('#songList .card').forEach(c=>{ c.style.display=c.innerText.toLowerCase().includes(q)?'flex':'none'; });
}
function openSong(i){
  let s=allSongs[i]; if(!s) return;
  document.getElementById('songModalContent').innerHTML=`<div style="text-align:center"><div style="font-size:14px;color:gray">📁 ${getFolder(s)}</div><h2 style="color:#0B3D2E;margin:6px 0">${s.num||''}. ${s.title||''}</h2><div style="white-space:pre-line;font-size:18px;line-height:1.9;text-align:center">${(s.content||'').replace(/\n/g,'<br>')}</div></div>`;
  document.getElementById('songModal').style.display='flex';
}
function closeSong(){ document.getElementById('songModal').style.display='none'; }
document.getElementById('songModal').addEventListener('click',e=>{ if(e.target.id==='songModal') closeSong(); });
load();
</script>
</body>
</html>
