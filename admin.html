<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Public</title><style>body{margin:0;font-family:sans-serif;background:#0a1931;color:white;padding:15px;text-align:center}input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;box-sizing:border-box}button{padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.card{background:white;color:#0d2a54;padding:15px;border-radius:15px;margin:12px 0;text-align:left}.del{background:red;color:white;padding:4px 10px;float:right}</style></head><body><div id="login"><h2>✝️ Admin Login Public</h2><input id="pw" type="password" placeholder="Password"><button onclick="login()" style="background:#ffdd57;width:100%">Login</button><p style="font-size:12px">Password: jesus2026<br>Public - అందరికీ కనబడుతుంది</p></div><div id="panel" style="display:none"><h2>📚 Public Admin Panel</h2><div class="card"><h3>➕ కొత్త పోస్ట్</h3><select id="type"><option value="msg">💬 వాక్యం</option><option value="book">📚 పుస్తకం</option><option value="song">🎵 పాట</option></select><input id="t" placeholder="శీర్షిక - మరనాత"><textarea id="c" rows="4" placeholder="వివరాలు - యెహోవా నా కాపరి..."></textarea><button onclick="add()" style="background:#0d2a54;color:white;width:100%">✅ లిస్ట్ లో యాడ్ చేయండి</button></div><div class="card"><h3>📋 పోస్ట్ లు (<span id="count">0</span>)</h3><div id="list"></div><hr><h3>🌍 Public Save</h3><input id="token" type="password" placeholder="GitHub Token ghp_... (Optional)"><button onclick="saveToGithub()" style="background:#24292f;color:white;width:100%;margin-top:8px">🚀 GitHub లో Save చేయండి - Public</button><button onclick="copyJson()" style="background:#ffdd57;color:#0d2a54;width:100%;margin-top:8px">📋 JSON కాపీ చేయండి</button><textarea id="jsonout" rows="8" style="background:#f5f5f5;font-size:11px"></textarea><p style="font-size:11px;color:#666">Token లేకపోతే: JSON కాపీ -> posts.json లో పేస్ట్ -> Commit</p></div></div><script>const PASS="jesus2026";let data=[];async function login(){if(document.getElementById('pw').value!==PASS){alert('తప్పు!');return}localStorage.setItem('isAdminPublic','1');show();await loadPosts()}function show(){if(localStorage.getItem('isAdminPublic')){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block'}}async function loadPosts(){try{let r=await fetch('posts.json?v='+Date.now());data=await r.json();}catch(e){data=[]}render()}function add(){let ty=document.getElementById('type').value,t=document.getElementById('t').value.trim(),c=document.getElementById('c').value.trim();if(!t||!c){alert('రాయండి');return}data.unshift({ty,t,c,dt:new Date().toLocaleDateString('te-IN')});document.getElementById('t').value='';document.getElementById('c').value='';render();alert('యాడ్ అయ్యింది! ఇప్పుడు కింద Save చేయండి Public కోసం')}function render(){let h='';data.forEach((d,i)=>{h+=`<div style="border-bottom:1px solid #eee;padding:10px 0"><b>${d.t}</b><small style="float:right">${d.dt}</small><br><small>${d.c.substring(0,80)}</small><button onclick="del(${i})" class="del">X</button><div style="clear:both"></div></div>`});document.getElementById('list').innerHTML=h||'లేవు';document.getElementById('count').innerText=data.length;document.getElementById('jsonout').value=JSON.stringify(data,null,2)}function del(i){if(!confirm('తొలగించాలా?'))return;data.splice(i,1);render()}function copyJson(){navigator.clipboard.writeText(JSON.stringify(data,null,2));alert('కాపీ అయ్యింది! ఇప్పుడు posts.json లో పేస్ట్ చేయండి')}async function saveToGithub(){let token=document.getElementById('token').value.trim();if(!token){alert('Token లేదు! JSON కాపీ చేసి posts.json లో పేస్ట్ చేయండి');copyJson();return}let owner='ms2biblemission-bit',repo='BMmahimasannidhi',path='posts.json';try{let getR=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{headers:{Authorization:`token ${token}`}});let sha=null;if(getR.ok){let j=await getR.json();sha=j.sha}let content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));let putR=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Update posts.json Public',content,sha})});if(putR.ok){alert('🎉 సక్సెస్! Public Save అయ్యింది! 2 నిమిషాల్లో అందరికీ కనబడుతుంది!')}else{let err=await putR.text();alert('Error: '+err);copyJson()}}catch(e){alert('Error: '+e.message);copyJson()}}show();loadPosts();</script></body></html>
