<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Schedule</title>
<style>
body{font-family:system-ui;padding:15px;background:#fff8e1;max-width:700px;margin:auto}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;background:#ff9800;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.card{background:white;padding:12px;border-radius:10px;margin:10px 0;box-shadow:0 2px 5px #0001}
small{color:#666}
</style>
</head>
<body>
<h2>🙏 Admin - వాక్యం / పాట + షెడ్యూల్</h2>

<label>రకం</label>
<select id="type">
<option value="vakayam">📖 వాక్యం</option>
<option value="paata">🎵 పాట</option>
</select>

<label>టైటిల్</label>
<input id="title" placeholder="ఉదా: అమోసు 3:8 - సింహము గర్జించెను">

<label>వాక్యం / పాట మొత్తం</label>
<textarea id="content" rows="12" placeholder="ఇక్కడ మొత్తం వాక్యం రాయండి..."></textarea>

<label>చూపించే డేట్ (పైన కనిపించే డేట్)</label>
<input type="date" id="date">

<label>⏰ షెడ్యూల్ - ఎప్పుడు సైట్ లోకి వెళ్ళాలి?</label>
<input type="datetime-local" id="publishAt">
<small>ఖాళీగా వదిలితే - వెంటనే వెళ్ళిపోతుంది.<br>డేట్ + టైమ్ పెడితే - ఆ టైమ్ వచ్చేవరకు సైట్ లో కనిపించదు.</small>

<button onclick="addPost()">✅ Add చేయండి</button>
<button onclick="download()" style="background:#4caf50">⬇️ posts.json డౌన్లోడ్</button>

<h3>ఉన్న పోస్టులు</h3>
<div id="list"></div>

<script>
let posts = [];
async function load(){
  try{
    let r = await fetch('posts.json');
    posts = await r.json();
  }catch(e){ posts=[]; }
  render();
}
function render(){
  document.getElementById('list').innerHTML = posts.map((p,i)=>{
    let sched = p.publishAt ? new Date(p.publishAt).toLocaleString('te-IN') : 'వెంటనే';
    return `<div class="card"><b>${p.title}</b><br><small>${p.date} | షెడ్యూల్: ${sched} | ${p.type}</small><br><button onclick="delPost(${i})" style="background:#f44336;padding:8px;font-size:14px">Delete</button></div>`
  }).join('') || 'ఇంకా ఏమీ లేవు';
}
function addPost(){
  let title = document.getElementById('title').value.trim();
  let content = document.getElementById('content').value.trim();
  let type = document.getElementById('type').value;
  let date = document.getElementById('date').value;
  let publishAt = document.getElementById('publishAt').value;
  if(!title || !content){ alert('టైటిల్ + వాక్యం రాయండి అండీ'); return; }
  if(!date) date = new Date().toISOString().slice(0,10);
  // publishAt ఖాళీ అయితే ఇప్పుడే
  if(!publishAt) publishAt = new Date().toISOString();
  else publishAt = new Date(publishAt).toISOString();
  posts.unshift({title, content, type, date, publishAt});
  document.getElementById('title').value='';
  document.getElementById('content').value='';
  document.getElementById('publishAt').value='';
  render();
  alert('Add అయ్యింది అండీ! ఇప్పుడు posts.json డౌన్లోడ్ చేసి GitHub లో పెట్టండి!');
}
function delPost(i){ if(confirm('తీసేయమంటారా?')){ posts.splice(i,1); render(); } }
function download(){
  let blob = new Blob([JSON.stringify(posts,null,2)],{type:'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'posts.json';
  a.click();
}
document.getElementById('date').value = new Date().toISOString().slice(0,10);
load();
</script>
</body>
</html>
