<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title></head>
<body style="font-family:system-ui;padding:15px;background:#fff8e6">
<h2 style="color:#8B0000">⚙️ అడ్మిన్ - మెసేజ్ / వాయిస్</h2>
<div style="background:#fff;padding:15px;border-radius:12px">
<label>📌 టైటిల్</label><br>
<input id="title" placeholder="ఉదా: Jesus Ringtone - చెక్" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:8px 0">
<label>📖 వాక్యం - ఉంటేనే</label><br>
<textarea id="content" placeholder="వాక్యం..." style="width:100%;height:80px;padding:12px;border-radius:10px;border:1px solid #ccc;margin:8px 0"></textarea>
<label>🖼️ ఫోటో - ఉంటేనే</label><br>
<input type="file" id="imgFile" accept="image/*" style="width:100%;padding:10px;margin:8px 0"><br>
<label>🎤 వాయిస్ - mp3</label><br>
<input type="file" id="audFile" accept="audio/*,.mp3" style="width:100%;padding:10px;margin:8px 0">
<p id="audInfo" style="font-size:13px;color:green"></p>
<label>📅 తేదీ</label><br>
<input type="date" id="date" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:8px 0">
<button onclick="savePost()" id="saveBtn" style="width:100%;background:#2e7d32;color:#fff;padding:14px;border:none;border-radius:30px;font-weight:bold;font-size:16px">💾 సేవ్ చేయండి - పంపండి!</button>
<p id="msg" style="text-align:center;font-weight:bold"></p>
<a href="index.html" style="display:block;text-align:center;background:#8B0000;color:#fff;padding:12px;border-radius:30px;text-decoration:none;margin-top:10px">👀 సైట్ చూడండి</a>
</div>
<h3>📜 ఇప్పటివరకు పెట్టినవి</h3>
<div id="list"></div>
<h3>⚙️ సెట్టింగ్ - Token ఒక్కసారి</h3>
<div style="background:#fff;padding:15px;border-radius:12px">
<input id="token" placeholder="GitHub Token - ghp_..." style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:5px 0">
<button onclick="saveToken()" style="background:#333;color:#fff;padding:10px 16px;border:none;border-radius:10px">Token సేవ్ చేయండి</button>
<p style="font-size:12px;color:#666">Token కింద కనబడకపోతే - ఇంకొంచెం కిందకి స్క్రోల్ చేయండి!</p>
</div>
<script>
let OWNER="ms2biblemission-bit", REPO="BMmahimasannidhi", BRANCH="main";
function b64Decode(str){ return decodeURIComponent(atob(str).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')); }
function b64Encode(str){ return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,(m,p)=>String.fromCharCode('0x'+p))); }
document.getElementById('date').valueAsDate=new Date();
document.getElementById('token').value=localStorage.getItem('gh_token')||"";
document.getElementById('audFile').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f) return; document.getElementById('audInfo').innerText="ఎంచుకున్నారు: "+f.name+" - "+(f.size/1024).toFixed(0)+" KB"; });
function saveToken(){ localStorage.setItem('gh_token', document.getElementById('token').value.trim()); alert("Token సేవ్ అయింది!"); }
async function ghGet(path){ let t=localStorage.getItem('gh_token'); let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}}); if(!r.ok) return null; return await r.json(); }
async function ghPut(path, contentBase64, msg, sha){ let t=localStorage.getItem('gh_token'); let body={message:msg, content:contentBase64, branch:BRANCH}; if(sha) body.sha=sha; let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{method:"PUT",headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)}); return r; }
function fileToBase64(file){ return new Promise(res=>{ let rd=new FileReader(); rd.onload=()=>res(rd.result.split(',')[1]); rd.readAsDataURL(file); }); }
function cleanName(n){ return n.replace(/[^a-zA-Z0-9.-]/g,'_'); }
async function savePost(){
  let btn=document.getElementById('saveBtn'); btn.disabled=true; btn.innerText="⏳ సేవ్ అవుతోంది... ఆగండి!";
  document.getElementById('msg').innerText="";
  try{
    let title=document.getElementById('title').value.trim(); if(!title){ alert("టైటిల్ పెట్టండి!"); btn.disabled=false; btn.innerText="💾 సేవ్ చేయండి - పంపండి!"; return; }
    let content=document.getElementById('content').value; let date=document.getElementById('date').value;
    let imgF=document.getElementById('imgFile').files[0]; let audF=document.getElementById('audFile').files[0];
    let imgName="", audName=""; let time=Date.now();
    if(imgF){ imgName="img_"+time+"_"+cleanName(imgF.name); let b64=await fileToBase64(imgF); let r=await ghPut(imgName,b64,"Add image "+imgName); if(!r.ok) throw new Error("ఫోటో అప్లోడ్ కాలేదు! Token చూడండి!"); }
    if(audF){ audName="voice_"+time+"_"+cleanName(audF.name); let b64=await fileToBase64(audF); let r=await ghPut(audName,b64,"Add voice "+audName); if(!r.ok) throw new Error("వాయిస్ అప్లోడ్ కాలేదు! Token చూడండి!"); }
    let existing=await ghGet("posts.json"); let posts=[]; let sha=null;
    if(existing){ sha=existing.sha; posts=JSON.parse(b64Decode(existing.content.replace(/\n/g,''))); }
    posts.unshift({title:title, content:content, image:imgName||"", audio:audName||"", date:date});
    let newContent=b64Encode(JSON.stringify(posts,null,2));
    let r2=await ghPut("posts.json",newContent,"Add post "+title,sha); if(!r2.ok) throw new Error("posts.json సేవ్ కాలేదు!");
    document.getElementById('msg').innerText="✅ సేవ్ అయింది! 1 నిమిషం ఆగి సైట్ చూడండి!"; document.getElementById('msg').style.color="green";
    document.getElementById('title').value=""; document.getElementById('content').value=""; document.getElementById('imgFile').value=""; document.getElementById('audFile').value=""; loadList();
  }catch(e){ document.getElementById('msg').innerText="❌ "+e.message; document.getElementById('msg').style.color="red"; alert(e.message); }
  btn.disabled=false; btn.innerText="💾 సేవ్ చేయండి - పంపండి!";
}
async function loadList(){ let existing=await ghGet("posts.json"); if(!existing) return; let posts=JSON.parse(b64Decode(existing.content.replace(/\n/g,''))); document.getElementById('list').innerHTML=posts.slice(0,10).map(p=>`<div style="background:#fff;padding:10px;border-radius:10px;margin:8px 0"><b>${p.title}</b><br><small>${p.date} ${p.audio?'🎤 వాయిస్ ఉంది':''} ${p.image?'🖼️ ఫోటో ఉంది':''}</small></div>`).join(''); }
loadList();
</script></body></html>
