<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{margin:0;font-family:sans-serif;background:#0a1931;color:#fff;padding:15px;text-align:center}input,textarea,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:0}button{padding:12px;border-radius:10px;border:0;font-weight:bold} .card{background:#fff;color:#0d2a54;padding:15px;border-radius:15px;margin:12px 0;text-align:left}</style></head><body><div id="a"><h2>✝️ Admin Login</h2><p>మహిమ సన్నిధి</p><input id="p" type="password" placeholder="Password"><button onclick="if(document.getElementById('p').value==='jesus2026'){localStorage.setItem('adm','1');location.reload()}else alert('Wrong')" style="background:#ffdd57;width:100%">Login</button><p>Password: jesus2026</p></div><div id="b" style="display:none"><h2>📚 Admin Panel</h2><div class="card"><h3>➕ కొత్త పోస్ట్</h3><select id="ty"><option value="book">పుస్తకం</option><option value="song">పాట</option><option value="msg">మెసేజ్</option></select><input id="t" placeholder="శీర్షిక"><textarea id="c" placeholder="వివరాలు"></textarea><button onclick="let ty=document.getElementById('ty').value,t=document.getElementById('t').value,c=document.getElementById('c').value;if(!t||!c)return alert('రాయండి');let d=JSON.parse(localStorage.getItem('md')||'[]');d.unshift({ty,t,c,dt:new Date().toLocaleDateString()});localStorage.setItem('md',JSON.stringify(d));alert('Done');location.reload()" style="background:#0d2a54;color:#fff;width:100%">Post</button></div></div><script>if(localStorage.getItem('adm')){document.getElementById('a').style.display='none';document.getElementById('b').style.display='block'}</script></body></html>
