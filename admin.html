<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BM మహిమ సన్నిధి - Admin</title>
<style>
*{box-sizing:border-box} body{font-family:system-ui;margin:0;background:#E8F5E9;padding-bottom:30px}
.header{background:#0B3D2E;color:white;padding:20px 15px;position:sticky;top:0;z-index:10}
.header h2{margin:0;font-size:22px} .header p{margin:4px 0 0;font-size:13px;opacity:.9}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#E8F5E9;position:sticky;top:72px;z-index:9}
.tabs button{white-space:nowrap;padding:10px 16px;border-radius:25px;border:1px solid #C8E6C9;background:white;font-size:15px;font-weight:bold;cursor:pointer}
.tabs button.active{background:#0B3D2E;color:white}
.wrap{padding:0 12px;max-width:700px;margin:auto}
.card{background:white;padding:15px;border-radius:20px;margin:12px 0;box-shadow:0 2px 10px #0001}
label{font-weight:bold;color:#333;font-size:15px;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #C8E6C9;border-radius:12px;font-size:16px;background:#F1F8E9}
button.big{width:100%;padding:14px;background:#2E7D32;color:white;border:none;border-radius:25px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:12px}
button.orange{background:#FF9800} button.red{background:#0B3D2E}
.pageEdit{background:#FFF8E1;border-left:5px solid #FF9800;padding:14px;border-radius:12px;margin-top:14px}
.small-del{background:#E53935;color:white;border:none;padding:9px 16px;border-radius:20px;font-weight:bold;cursor:pointer;margin-top:10px}
.pageNav{background:#FFF3E0;border:1px solid #FFCC80;padding:12px;border-radius:12px;margin:10px 0}
.debug{background:#E3F2FD;border:1px solid #90CAF9;padding:10px;border-radius:10px;font-size:13px;word-break:break-all}
small{color:#666} .hidden{display:none}
</style>
</head>
<body>
<div class="header"><h2>📖 BM మహిమ సన్నిధి - Admin</h2><p>సన్నిధి వర్తమానములు - సన్నిధి సహవాసం</p></div>
<div class="tabs">
<button id="t1" class="active" onclick="showTab(1)">📝 మెసేజ్</button>
<button id="t2" onclick="showTab(2)">📅 షెడ్యూల్</button>
<button id="t3" onclick="showTab(3)">📚 బుక్స్</button>
<button id="t5" onclick="showTab(5)">🎵 పాటలు</button>
<button id="t4" onclick="showTab(4)">⚙️ సెట్టింగ్</button>
</div>
<div class="wrap">
<div id="status" style="text-align:center;font-weight:bold;color:#0B3D2E;margin:8px"></div>
<div id="tab1">
<div class="card"><label>రకం</label><select id="type"><option value="vakayam">📖 వాక్యం</option><option value="paata">🎵 పాట</option></select>
<label>టైటిల్</label><input id="title" placeholder="ఉదా: అమోసు 3:8">
<label>🖼️ ఫోటో</label><input type="file" id="imageFile" accept="image/*"><img id="preview" style="display:none;width:100%;border-radius:10px">
<label>వాక్యం / పాట</label><textarea id="content" rows="8" placeholder="ఇక్కడ వాక్యం రాయండి..."></textarea>
<label>చూపించే డేట్</label><input type="date" id="date"><label>⏰ షెడ్యూల్</label><input type="datetime-local" id="publishAt">
<button class="big orange" onclick="addPost()">✅ Add చేసి Auto Save</button></div>
<h3>ఉన్న మెసేజ్ లు</h3><div id="list">లోడ్ అవుతోంది...</div>
</div>
<div id="tab2" class="hidden">
<div class="card"><label>📅 రోజు</label><select id="schDay"><option>ఆదివారం</option><option>సోమవారం</option><option>మంగళవారం</option><option>బుధవారం</option><option>గురువారం</option><option>శుక్రవారం</option><option>శనివారం</option></select>
<label>⏰ టైమ్</label><input id="schTime" placeholder="ఉదా: సాయంత్రం 7:00"><label>📝 కార్యక్రమం</label><input id="schTitle" placeholder="ఉదా: బైబిల్ అధ్యయనం">
<button class="big orange" onclick="addSchedule()">✅ షెడ్యూల్ సేవ్</button></div><div id="schList"></div>
</div>
<div id="tab3" class="hidden">
<div class="card">
<h3 style="margin:0">📚 బుక్స్ - ఇక్కడే మార్చండి!</h3>
<label>బుక్ ఎంచుకోండి</label><select id="bookSelect" onchange="loadBookToEditor()"></select>
<label>📖 బుక్ పేరు</label><input id="bookTitle" placeholder="📖 బుక్ 1 ఆమోసు" oninput="updateBookField('title',this.value)">
<label>📝 బుక్ వివరణ</label><textarea id="bookDesc" rows="2" placeholder="యెహోవా ఆజ్ఞ - సింహం గర్జన" oninput="updateBookField('desc',this.value)"></textarea>
<label>📄 PDF ఫైల్ (ఉంటే)</label><input type="file" id="bookFile" accept="application/pdf"><small id="bookFileName"></small>
<div id="debugBox" class="debug" style="margin-top:12px"></div>
<div id="pagesNav" class="pageNav"></div>
<div style="margin-top:15px;border-top:2px dashed #FF9800;padding-top:10px">
<h3>📄 ఈ బుక్ లో పేజీలు - పాతవి చూసి, కొత్తది పెట్టండి!</h3>
<div id="pagesInEdit"></div>
<button class="big orange" onclick="addPage()">➕ కొత్త అధ్యాయం / పేజీ పెట్టండి</button>
<button class="big" onclick="saveBook()">💾 బుక్స్ సేవ్ చేయండి!</button>
<button class="big red" onclick="newBook()">📚 కొత్త బుక్ పెట్టండి!</button>
<button class="big" style="background:#E53935" onclick="delCurrentBook()">🗑️ ఈ బుక్ తీసేయండి</button>
</div>
</div>
</div>

<!-- 🎵 పాటలు - కొత్త ట్యాబ్ -->
<div id="tab5" class="hidden">
<div class="card">
<h3 style="margin:0">🎵 పాటలు - ఆంధ్ర క్రైస్తవ కీర్తనలు</h3>
<label>పాట ఎంచుకోండి</label><select id="songSelect" onchange="loadSongToEditor()"></select>
<label>🎵 పాట పుస్తకం</label><input id="songBook" value="ఆంధ్ర క్రైస్తవ కీర్తనలు" placeholder="ఆంధ్ర క్రైస్తవ కీర్తనలు">
<label>🔢 పాట నంబర్</label><input id="songNum" type="number" placeholder="1">
<label>🎵 పాట టైటిల్</label><input id="songTitle" placeholder="ఉదా: త్రియేక దేవునికి - స్తుతి">
<label>🎼 రాగం / తాళం</label><input id="songDesc" placeholder="రాగం: జంఝూట్ | తాళం: ఏక">
<label>📝 పాట - పూర్తిగా</label><textarea id="songContent" rows="12" placeholder="ఇక్కడ పాట మొత్తం రాయండి..."></textarea>
<button class="big" onclick="saveSong()">💾 పాట సేవ్ చేయండి!</button>
<button class="big orange" onclick="newSong()">➕ కొత్త పాట పెట్టండి</button>
<button class="big" style="background:#E53935" onclick="delCurrentSong()">🗑️ ఈ పాట తీసేయండి</button>
</div>
<div id="songList"></div>
</div>

<div id="tab4" class="hidden">
<div class="card" style="background:#E8F5E9"><b>🔑 GitHub సెట్టింగ్</b><label>Token (ghp_...)</label><input id="token" type="password" placeholder="టోకెన్ ఇక్కడ పేస్ట్ చేయండి"><label>Owner</label><input id="owner" value="ms2biblemission-bit"><label>Repo</label><input id="repo" value="BMmahimasannidhi"><button class="big" style="background:#2E7D32" onclick="saveSettings()">💾 సెట్టింగ్ సేవ్</button></div>
<button class="big red" onclick="window.open('index.html','_blank')">👀 సైట్ చూడండి</button>
</div>
</div>
<script>
let posts=[], postSha="", imageDataUrl="", books=[], bookSha="", bookPdfData="", editingBook=0;
let schedule=[], schSha="", editingSch=-1;
let songs=[], songSha="", editingSong=0;
let owner=localStorage.getItem('ms_owner')||'ms2biblemission-bit', repo=localStorage.getItem('ms_repo')||'BMmahimasannidhi', token=localStorage.getItem('ms_token')||'';
document.getElementById('owner').value=owner; document.getElementById('repo').value=repo; document.getElementById('token').value=token;
document.getElementById('date').value=new Date().toISOString().slice(0,10);
function showTab(n){[1,2,3,4,5].forEach(i=>{document.getElementById('tab'+i).classList.toggle('hidden',i!==n); let tb=document.getElementById('t'+i); if(tb) tb.classList.toggle('active',i===n);});}
function setStatus(t){document.getElementById('status').innerText=t;}
function b64Dec(b){let bin=atob(b.replace(/\n/g,'')); let u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder('utf-8').decode(u);}
function b64Enc(s){let u=new TextEncoder().encode(s); let bin=''; u.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin);}
async function getFile(n){let r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${n}`,{headers:{'Authorization':'Bearer '+token}}); return await r.json();}
async function putFile(n,sha,obj){let r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${n}`,{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Update '+n+' '+new Date().toLocaleString('te-IN'),content:b64Enc(JSON.stringify(obj,null,2)),sha:sha,branch:'main'})}); return await r.json();}
function saveSettings(){token=document.getElementById('token').value.trim(); owner=document.getElementById('owner').value.trim(); repo=document.getElementById('repo').value.trim(); localStorage.setItem('ms_token',token); localStorage.setItem('ms_owner',owner); localStorage.setItem('ms_repo',repo); alert('సేవ్ అయ్యింది అండీ!'); load(); loadBooks(); loadSch(); loadSongs();}
document.getElementById('imageFile').addEventListener('change',e=>{let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=()=>{imageDataUrl=r.result; let p=document.getElementById('preview'); p.src=imageDataUrl; p.style.display='block';}; r.readAsDataURL(f);});
document.getElementById('bookFile').addEventListener('change',e=>{let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=()=>{bookPdfData=r.result; document.getElementById('bookFileName').innerText='✅ '+f.name; if(books[editingBook]) books[editingBook].pdf=bookPdfData;}; r.readAsDataURL(f);});
async function load(){if(!token){document.getElementById('list').innerHTML='ముందు టోకెన్ పెట్టండి అండీ!'; return;} try{let j=await getFile('posts.json'); postSha=j.sha; posts=JSON.parse(b64Dec(j.content)); setStatus('✅ కనెక్ట్ అయ్యింది! '+posts.length+' పోస్టులు'); render();}catch(e){setStatus('❌ టోకెన్ తప్పు అండీ');}}
function render(){document.getElementById('list').innerHTML=posts.map((p,i)=>`<div class="card"><b>${p.title||''}</b><br><small>${p.date||''}</small>${p.image?`<img src="${p.image}" style="width:100%;border-radius:10px">`:''}<br><button class="big" style="background:#f44336;padding:8px;font-size:14px" onclick="delPost(${i})">Delete</button></div>`).join('')||'ఇంకా లేవు';}
async function addPost(){let title=document.getElementById('title').value.trim(), content=document.getElementById('content').value.trim(), type=document.getElementById('type').value, date=document.getElementById('date').value||new Date().toISOString().slice(0,10), publishAt=document.getElementById('publishAt').value; if(!title||!content){alert('టైటిల్ + వాక్యం రాయండి అండీ'); return;} publishAt=publishAt?new Date(publishAt).toISOString():new Date().toISOString(); posts.unshift({title,content,type,date,publishAt,image:imageDataUrl,audio:""}); let j=await putFile('posts.json',postSha,posts); if(j.content){postSha=j.content.sha; setStatus('✅ అయిపోయింది అండీ!'); document.getElementById('title').value=''; document.getElementById('content').value=''; document.getElementById('publishAt').value=''; document.getElementById('imageFile').value=''; imageDataUrl=''; document.getElementById('preview').style.display='none'; render();} else {setStatus('❌ కాలేదు!'); posts.shift();}}
async function delPost(i){if(!confirm('తీసేయమంటారా?')) return; posts.splice(i,1); let j=await putFile('posts.json',postSha,posts); if(j.content){postSha=j.content.sha; render();}}
async function loadSch(){try{let j=await getFile('schedule.json'); schSha=j.sha; schedule=JSON.parse(b64Dec(j.content));}catch(e){schedule=[]; schSha="";} renderSch();}
function renderSch(){document.getElementById('schList').innerHTML=schedule.map((s,i)=>`<div class="card"><b>${s.day||''} - ${s.time||''}</b><br>${s.title||''}<div style="display:flex;gap:8px"><button style="flex:1;padding:10px;border:none;border-radius:10px;color:white;background:#2196F3;font-weight:bold" onclick="editSch(${i})">✏️ ఎడిట్</button><button style="flex:1;padding:10px;border:none;border-radius:10px;color:white;background:#f44336;font-weight:bold" onclick="delSch(${i})">🗑️ Delete</button></div></div>`).join('')||'షెడ్యూల్ లేదు';}
async function addSchedule(){let day=document.getElementById('schDay').value, time=document.getElementById('schTime').value.trim(), title=document.getElementById('schTitle').value.trim(); if(!time||!title){alert('టైమ్ + కార్యక్రమం రాయండి'); return;} if(editingSch>=0){schedule[editingSch]={day,time,title}; editingSch=-1;} else schedule.push({day,time,title}); let j=await putFile('schedule.json',schSha,schedule); if(j.content){schSha=j.content.sha; setStatus('✅ షెడ్యూల్ సేవ్ అయ్యింది!'); document.getElementById('schTime').value=''; document.getElementById('schTitle').value=''; renderSch();}}
function editSch(i){editingSch=i; let s=schedule[i]; document.getElementById('schDay').value=s.day; document.getElementById('schTime').value=s.time; document.getElementById('schTitle').value=s.title; showTab(2);}
async function delSch(i){if(!confirm('తీసేయమంటారా?')) return; schedule.splice(i,1); let j=await putFile('schedule.json',schSha,schedule); if(j.content){schSha=j.content.sha; renderSch();}}
function normalizePages(b){
  let arr=null;
  let keys=['pages','chapters','items','entries','list','data','sections','parts','adhyayamulu','pejilu'];
  for(let k of keys){ if(Array.isArray(b[k]) && b[k].length){ arr=b[k]; b._foundKey=k; break; } }
  if(!arr && b.content && typeof b.content==='string' && b.content.length>5){ arr=[{title:b.chapterTitle||'పేజీ 1', content:b.content}]; b._foundKey='content-string'; }
  if(!arr && b.text && typeof b.text==='string'){ arr=[{title:'పేజీ 1', content:b.text}]; b._foundKey='text'; }
  if(!arr){ b._foundKey='NONE - ఏమీ లేదు'; arr=[]; }
  b.pages = arr.map(p=>{
    if(typeof p==='string') return {title:p, content:''};
    return {title:p.title||p.t||p.name||p.heading||p.person||p.memberName||'', content:p.content||p.c||p.text||p.body||p.description||p.desc||p.message||'', pdf:p.pdf||''};
  });
  return b;
}
async function loadBooks(){try{let j=await getFile('books.json'); bookSha=j.sha; books=JSON.parse(b64Dec(j.content));}catch(e){books=[]; bookSha="";} books=books.map(normalizePages); if(!books.length) books=[{title:'📖 బుక్ 1 - ఆదికాండం వివరణ',desc:'యెహోవా ఆజ్ఞ',pages:[{title:'అధ్యాయం 3 : 8',content:'*మా సందేశం మహిమ*'}],pdf:'',_foundKey:'demo'}]; editingBook=0; renderBookSelect(); loadBookToEditor();}
function renderBookSelect(){let s=document.getElementById('bookSelect'); s.innerHTML=books.map((b,i)=>`<option value="${i}">${b.title||('బుక్ '+(i+1))}</option>`).join(''); s.value=editingBook;}
function loadBookToEditor(){editingBook=parseInt(document.getElementById('bookSelect').value||0); let b=books[editingBook]; if(!b) return; b=normalizePages(b); document.getElementById('bookTitle').value=b.title||''; document.getElementById('bookDesc').value=b.desc||b.description||''; document.getElementById('bookFileName').innerText=b.pdf?'✅ పాత PDF ఉంది':'PDF లేదు'; document.getElementById('debugBox').innerHTML='<b>🔍 ఈ బుక్ లో ఏముంది?</b><br>కీ: '+b._foundKey+'<br>పేజీలు: '+b.pages.length+'<br>అన్ని కీలు: '+Object.keys(b).join(', '); renderPagesInEdit(); renderPagesNav();}
function updateBookField(k,v){if(books[editingBook]) books[editingBook][k]=v; renderBookSelect(); document.getElementById('bookSelect').value=editingBook;}
function renderPagesNav(){let b=books[editingBook]; if(!b) return; let box=document.getElementById('pagesNav'); if(!b.pages || !b.pages.length){ box.innerHTML='<b>📄 ఈ బుక్ లో పేజీలు: 0</b>'; return;} box.innerHTML=`<b>📄 ఈ బుక్ లో పేజీలు: ${b.pages.length}</b>`+b.pages.map((p,i)=>`<div onclick="document.getElementById('page-${i}').scrollIntoView({behavior:'smooth',block:'center'})">➡️ ${i+1}. ${p.title||'పేజీ '+(i+1)} - ${(p.content||'').slice(0,50)}...</div>`).join('');}
function renderPagesInEdit(){let b=books[editingBook]; if(!b) return; if(!b.pages) b.pages=[]; let box=document.getElementById('pagesInEdit'); if(!b.pages.length){box.innerHTML='<p style="color:gray">ఇంకా పేజీలు లేవు - కింద బటన్ నొక్కి యాడ్ చేయండి!</p>'; return;} box.innerHTML=b.pages.map((p,idx)=>`<div class="pageEdit" id="page-${idx}"><h4 style="margin:0 0 8px">పేజీ ${idx+1}</h4><input value="${(p.title||'').replace(/"/g,'&quot;')}" placeholder="ఉదా: పలుకుర్తి అన్నమ్మ గారు / అధ్యాయం 3 : 8" oninput="books[${editingBook}].pages[${idx}].title=this.value;renderPagesNav()"><textarea style="min-height:130px;margin-top:8px" placeholder="ఈ పేజీలో వాక్యం రాయండి..." oninput="books[${editingBook}].pages[${idx}].content=this.value;renderPagesNav()">${p.content||''}</textarea><button class="small-del" onclick="delPage(${idx})">🗑️ ఈ పేజీ తీసేయి</button></div>`).join('');}
function addPage(){if(!books[editingBook]) return; if(!books[editingBook].pages) books[editingBook].pages=[]; books[editingBook].pages.push({title:'',content:''}); renderPagesInEdit(); renderPagesNav(); setTimeout(()=>{let el=document.getElementById('page-'+(books[editingBook].pages.length-1)); if(el) el.scrollIntoView({behavior:'smooth'});},100);}
function delPage(idx){if(!confirm('ఈ పేజీ తీసేయమంటారా?')) return; books[editingBook].pages.splice(idx,1); renderPagesInEdit(); renderPagesNav();}
function newBook(){books.push({title:'📖 కొత్త బుక్',desc:'',pages:[{title:'',content:''}],pdf:'',_foundKey:'new'}); editingBook=books.length-1; renderBookSelect(); loadBookToEditor();}
function delCurrentBook(){if(!confirm('ఈ బుక్ తీసేయమంటారా?')) return; books.splice(editingBook,1); if(editingBook>=books.length) editingBook=Math.max(0,books.length-1); saveBook(); renderBookSelect(); loadBookToEditor();}
async function saveBook(){let t=document.getElementById('bookTitle').value.trim(), d=document.getElementById('bookDesc').value.trim(); if(!t){alert('బుక్ పేరు రాయండి'); return;} if(books[editingBook]){books[editingBook].title=t; books[editingBook].desc=d; if(bookPdfData) books[editingBook].pdf=bookPdfData; delete books[editingBook]._foundKey; delete books[editingBook].chapters;} let j=await putFile('books.json',bookSha,books); if(j.content){bookSha=j.content.sha; setStatus('✅ బుక్ సేవ్ అయ్యింది!'); bookPdfData=''; renderBookSelect(); renderPagesNav();} else setStatus('❌ బుక్ సేవ్ కాలేదు');}

// 🎵 SONGS - అడ్మిన్ లోనే పాటలు!
async function loadSongs(){
  try{let j=await getFile('songs.json'); songSha=j.sha; songs=JSON.parse(b64Dec(j.content));}
  catch(e){ songs=[]; songSha=""; }
  if(!songs.length){
    songs=[{num:1,book:"ఆంధ్ర క్రైస్తవ కీర్తనలు",title:"త్రియేక దేవునికి - స్తుతి",desc:"రాగం: జంఝూట్ | తాళం: ఏక",content:`1. త్రియేక దేవునికి - స్తుతి\n\nరాగం: జంఝూట్          తాళం: ఏక\n\nశుభాకరా! శుద్ధాకరా! వి - శుద్ధ వందనమ్ =\nనభా నభూమి సర్వ్యో - నృత్య వందనమ్\n\n1. యెహోవా! స్రష్ట! జనక! నీకు - నెంతయు బ్రణుతి =\nమహోన్నతుండ! దివ్యుడా! ఘన - మహిమ సంస్తుతి\n|| శుభా ||\n\n2. విమోచకా! పిత్రాత్మజుండ! - విజయ మంగళమ్ =\nసమస్త సృష్టి సాధనంబు! - సవ్య మంగళమ్\n|| శుభా ||\n\n3. వరాత్మ! పితాపుత్ర నిర్గమ - పరుడ! స్తోత్రము =\nవరప్రదుండ! భక్త హృదయ - వాస! స్తోత్రము\n|| శుభా ||\n\n-----------------------------------------\n1. శుభమునకు ఉనికిపట్టు\n2. ఆకాశమందు\n3. స్తుతి\n4. తండ్రి యొక్క కుమారుడా!\n5. తండ్రి నుండియు కుమారుని నుండియు బయలుదేరిన దేవా!`}];
  }
  editingSong=0; renderSongSelect(); loadSongToEditor(); renderSongList();
}
function renderSongSelect(){let s=document.getElementById('songSelect'); s.innerHTML=songs.map((sg,i)=>`<option value="${i}">${sg.num||i+1}. ${sg.title||('పాట '+(i+1))}</option>`).join(''); s.value=editingSong;}
function loadSongToEditor(){editingSong=parseInt(document.getElementById('songSelect').value||0); let sg=songs[editingSong]; if(!sg) return; document.getElementById('songBook').value=sg.book||'ఆంధ్ర క్రైస్తవ కీర్తనలు'; document.getElementById('songNum').value=sg.num||editingSong+1; document.getElementById('songTitle').value=sg.title||''; document.getElementById('songDesc').value=sg.desc||''; document.getElementById('songContent').value=sg.content||''; }
function renderSongList(){document.getElementById('songList').innerHTML='<h3>ఉన్న పాటలు - '+songs.length+'</h3>'+songs.map((sg,i)=>`<div class="card"><b>${sg.num||i+1}. ${sg.title}</b><br><small>${sg.book||''} - ${sg.desc||''}</small><br><small>${(sg.content||'').slice(0,80)}...</small></div>`).join('');}
function newSong(){let n=songs.length+1; songs.push({num:n,book:"ఆంధ్ర క్రైస్తవ కీర్తనలు",title:"",desc:"",content:""}); editingSong=songs.length-1; renderSongSelect(); loadSongToEditor(); renderSongList();}
async function saveSong(){
  let book=document.getElementById('songBook').value.trim()||'ఆంధ్ర క్రైస్తవ కీర్తనలు';
  let num=parseInt(document.getElementById('songNum').value)||editingSong+1;
  let title=document.getElementById('songTitle').value.trim();
  let desc=document.getElementById('songDesc').value.trim();
  let content=document.getElementById('songContent').value.trim();
  if(!title||!content){alert('పాట టైటిల్ + పాట రాయండి అండీ'); return;}
  songs[editingSong]={num,book,title,desc,content};
  songs.sort((a,b)=>(a.num||0)-(b.num||0));
  let j=await putFile('songs.json',songSha,songs);
  if(j.content){songSha=j.content.sha; setStatus('✅ పాట సేవ్ అయ్యింది!'); renderSongSelect(); renderSongList(); loadSongToEditor();}
  else setStatus('❌ పాట సేవ్ కాలేదు');
}
async function delCurrentSong(){if(!confirm('ఈ పాట తీసేయమంటారా?')) return; songs.splice(editingSong,1); if(editingSong>=songs.length) editingSong=Math.max(0,songs.length-1); let j=await putFile('songs.json',songSha,songs); if(j.content){songSha=j.content.sha; setStatus('✅ పాట తీసేసాను!'); renderSongSelect(); loadSongToEditor(); renderSongList();}}

load(); loadBooks(); loadSch(); loadSongs();
