<!DOCTYPE html>
<html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Mahima Sannidhi</title><style>body{font-family:system-ui;padding:12px;max-width:600px;margin:auto;background:#fff8ec;padding-bottom:20px}input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{background:#b8860b;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-size:16px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{width:auto;padding:8px 10px;background:#eee;color:#333}.tabs button.on{background:#b8860b;color:#fff}.card{border:1px solid #eee;padding:10px;border-radius:10px;margin:10px 0;background:#fff}img{max-width:100%;border-radius:8px}.chatMsg{padding:10px;border-radius:12px;margin:8px 0;background:#fff3cd}.chatMsg.admin{background:#cfe8ff}</style></head><body>
<h2>🙏 Mahima Sannidhi - Admin</h2>
<p id="status">Loading...</p>
<label>GitHub Token</label><input id="token" type="password">
<div class="tabs">
<button onclick="setTab('posts',this)" class="on">📝 పోస్ట్</button>
<button onclick="setTab('messages',this)">💬 మెసేజ్</button>
<button onclick="setTab('songs',this)">🎵 పాటలు</button>
<button onclick="setTab('books',this)">📖 బుక్స్</button>
<button onclick="setTab('voice',this)">🎙️ వాయిస్</button>
<button onclick="setTab('gallery',this)">🖼️ గ్యాలరీ</button>
<button onclick="setTab('chat',this)" style="background:#673AB7;color:#fff">💬 అడ్మిన్ చాట్</button>
</div>

<div id="normalBox">
<p><b id="tabName">📝 పోస్ట్</b></p>
<label>Title / శీర్షిక</label><input id="title">
<label>Message / వివరం</label><textarea id="msg" rows="3"></textarea>
<label>Link - YouTube / PDF / Audio లింక్</label><input id="link" placeholder="https://...">
<label>Photo</label><input id="photo" type="file" accept="image/*">
<img id="preview" style="display:none">
<button onclick="savePost()">✅ సేవ్ చేయండి</button>
<h3>ఇప్పటివి - <span id="count"></span></h3><div id="list"></div>
</div>

<div id="chatBox" style="display:none">
<h3>💬 భక్తుల మెసేజ్ లు</h3>
<p style="font-size:13px;color:gray">వేరే ఫోన్ నుండి వచ్చిన మెసేజ్ లు ఇక్కడ కనబడతాయి. 30 సెకన్లకు ఒకసారి Refresh అవుతుంది.</p>
<button onclick="loadChat()" style="background:#673AB7">🔄 Refresh - మెసేజ్ లు చూడండి</button>
<div id="chatList" style="margin-top:10px">లోడ్ అవుతోంది...</div>
<label>రిప్లై - ఎవరికి పంపాలో వారి Code కింద రాయండి</label><input id="replyCode" placeholder="ఉదా: 1234 - మెసేజ్ లో ఉంటుంది">
<textarea id="replyText" rows="2" placeholder="రిప్లై ఇక్కడ రాయండి..."></textarea>
<button onclick="sendReply()" style="background:#0B3D2E">📩 రిప్లై పంపండి</button>
</div>

<script>
const OWNER="ms2biblemission-bit", REPO="BMmahimasannidhi";
let cur="posts", all={posts:[],messages:[],songs:[],books:[],voice:[],gallery:[]};
let files={posts:"posts.json",messages:"messages.json",songs:"songs.json",books:"books.json",voice:"voice.json",gallery:"gallery.json"};
function fixT(s){ if(!s) return ''; try{ if(/[\u00C0-\u00FF]/.test(s) || s.indexOf('Ã')>=0){ let bytes=new Uint8Array([...s].map(c=>c.charCodeAt(0)&255)); let d=new TextDecoder('utf-8').decode(bytes); if(d.indexOf('[STRIPPED 3 bytes]')===-1) return d; } }catch(e){} return s; }
function fileName(){return files[cur];}
async function gh(method){
  const token=document.getElementById('token').value.trim(); localStorage.setItem('gh_token',token);
  let url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${fileName()}`;
  let r=await fetch(url,{headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"}});
  let j=await r.json();
  if(method==="GET") return j;
  return fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"},body:JSON.stringify({message:"update "+cur,content:btoa(unescape(encodeURIComponent(JSON.stringify(all[cur])))),sha:j.sha})});
}
async function loadOne(type){ try{let j=await gh("GET"); if(j.content){all[type]=JSON.parse(atob(j.content.replace(/\n/g,""))); all[type]=all[type].map(p=>({...p,title:fixT(p.title),msg:fixT(p.msg)}));}}catch(e){all[type]=[];} }
async function loadAll(){
  let t=localStorage.getItem('gh_token')||""; document.getElementById('token').value=t;
  if(!t){document.getElementById('status').innerText="⚠️ Token పెట్టండి";return;}
  for(let k of Object.keys(files)){ await loadOne(k); }
  document.getElementById('status').innerText="✅ సేఫ్! అన్నీ రెడీ"; show();
}
function setTab(t,btn){
  cur=t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  if(t==='chat'){ document.getElementById('normalBox').style.display='none'; document.getElementById('chatBox').style.display='block'; loadChat(); return; }
  document.getElementById('normalBox').style.display='block'; document.getElementById('chatBox').style.display='none';
  document.getElementById('tabName').innerText=btn.innerText; document.getElementById('title').value=""; document.getElementById('msg').value=""; document.getElementById('link').value=""; show();
}
function show(){ let arr=all[cur]||[]; document.getElementById('count').innerText=arr.length+" ఉన్నాయి"; document.getElementById('list').innerHTML=arr.map((p,i)=>`<div class="card"><b>${fixT(p.title||"")}</b><p>${fixT(p.msg||"")}</p>${p.link?`<a href="${p.link}" target="_blank">🔗 లింక్</a>`:""}${p.img?`<br><img src="${p.img}">`:""}<br><button onclick="del(${i})" style="background:red;margin-top:8px">Delete</button></div>`).join("")||"ఇంకా లేవు"; }
async function del(i){ if(!confirm("Delete చేయాలా?"))return; all[cur].splice(i,1); await gh("PUT"); show(); }
document.getElementById('photo').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f)return; let rd=new FileReader(); rd.onload=ev=>{let img=new Image(); img.onload=()=>{let c=document.createElement('canvas'); let w=img.width,h=img.height,max=800; if(w>max){h=h*max/w;w=max;} c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h); let s=c.toDataURL('image/jpeg',0.7); document.getElementById('preview').src=s; document.getElementById('preview').style.display='block'; document.getElementById('preview').dataset.img=s;}; img.src=ev.target.result;}; rd.readAsDataURL(f); });
async function savePost(){ let t=document.getElementById('title').value, m=document.getElementById('msg').value, l=document.getElementById('link').value, im=document.getElementById('preview').dataset.img||""; if(!t){alert("Title పెట్టండి");return;} all[cur].unshift({title:t,msg:m,link:l,img:im,date:new Date().toISOString()}); let r=await gh("PUT"); if(r.ok){alert("✅ అయిపోయింది!"); document.getElementById('preview').dataset.img=""; loadAll();} else alert("❌ Save కాలేదు"); }
// CHAT
const TOPIC='ms2-mahima-sannidhi-chat-2026';
async function loadChat(){
  document.getElementById('chatList').innerHTML='లోడ్ అవుతోంది...';
  try{
    let r=await fetch('https://ntfy.sh/'+TOPIC+'/json?since=all&poll=1');
    let txt=await r.text(); let msgs=[];
    txt.split('\n').filter(Boolean).forEach(l=>{ try{ let j=JSON.parse(l); if(!j.message) return; if(j.message.startsWith('USER_MSG_')){ let parts=j.message.split('|'); msgs.push({code:parts[0].replace('USER_MSG_',''), name:parts[1]||'', village:parts[2]||'', phone:parts[3]||'', msg:parts[4]||'', time:parts[5]||new Date(j.time*1000).toLocaleString()}); } }catch(e){} });
    if(!msgs.length){ document.getElementById('chatList').innerHTML='📭 ఇంకా మెసేజ్ లు లేవు - వేరే ఫోన్ నుండి ఒక మెసేజ్ పంపి చూడండి'; return; }
    document.getElementById('chatList').innerHTML=msgs.reverse().map(m=>`<div class="chatMsg"><b>👤 ${m.name} | Code: ${m.code}</b><br>🏡 ${m.village} | 📞 ${m.phone}<br>💬 ${m.msg}<br><small>📅 ${m.time}</small><br><button onclick="useCode('${m.code}')" style="background:#673AB7;margin-top:6px;padding:8px">↩️ ఈ వ్యక్తికి రిప్లై</button></div>`).join('');
  }catch(e){ document.getElementById('chatList').innerHTML='❌ Net లేదు - మళ్ళీ Refresh నొక్కండి'; }
}
function useCode(c){ document.getElementById('replyCode').value=c; document.getElementById('replyText').focus(); window.scrollTo(0,document.body.scrollHeight); }
async function sendReply(){
  let code=document.getElementById('replyCode').value.trim(); let txt=document.getElementById('replyText').value.trim();
  if(!code||!txt){alert("Code + రిప్లై రెండూ రాయండి");return;}
  await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'ADMIN_REPLY_'+code+':'+txt});
  alert('✅ రిప్లై వెళ్ళింది!'); document.getElementById('replyText').value=''; loadChat();
}
loadAll();
setInterval(()=>{ if(cur==='chat') loadChat(); },30000);
</script></body></html>
