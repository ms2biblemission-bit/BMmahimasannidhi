<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Auto Public</title><style>body{margin:0;font-family:sans-serif;background:#0a1931;color:white;padding:15px;text-align:center}input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;box-sizing:border-box}button{padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.card{background:white;color:#0d2a54;padding:15px;border-radius:15px;margin:12px 0;text-align:left}</style></head><body><div id="login"><h2>✝️ Admin Auto Public</h2><input id="pw" type="password" placeholder="Password: jesus2026"><button onclick="login()" style="background:#ffdd57;width:100%">Login</button></div><div id="panel" style="display:none"><h2>📚 AUTO PUBLIC Admin</h2><p style="color:#ffdd57">✅ పెట్టగానే అందరికీ కనబడుతుంది! కాపీ పేస్ట్ వద్దు!</p><div class="card"><select id="type"><option value="msg">💬 వాక్యం</option><option value="book">📚 పుస్తకం</option><option value="song">🎵 పాట</option></select><input id="t" placeholder="శీర్షిక - ఉదా: మరనాత"><textarea id="c" rows="4" placeholder="వివరాలు - ఉదా: యెహోవా నా కాపరి..."></textarea><button onclick="add()" style="background:#0d2a54;color:white;width:100%">🚀 యాడ్ చేసి AUTO PUBLIC చేయండి</button></div><div class="card"><h3>📋 ప్రస్తుత పోస్ట్ లు (<span id="count">0</span>)</h3><div id="list"></div></div></div><script>const API_URL="https://api.npoint.io/3ee443f4b9d6fcc74a09";const PASS="jesus2026";let data=[];function login(){if(document.getElementById('pw').value!==PASS){alert('తప్పు పాస్వర్డ్!');return}localStorage.setItem('isAdminAuto','1');show()}function show(){if(localStorage.getItem('isAdminAuto')){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';load()}}async function load(){try{let r=await fetch(API_URL);data=await r.json();render()}catch(e){data=[];render()}}function render(){let h='';data.forEach((d,i)=>{h+=`<div style="border-bottom:1px solid #eee;padding:10px 0"><b>${d.t}</b><button onclick="del(${i})" style="background:red;color:white;padding:4px 10px;float:right;border-radius:5px">X</button><br><small>${d.c.substring(0,80)}...</small><div style="clear:both"></div></div>`});document.getElementById('list').innerHTML=h||'లేవు';document.getElementById('count').innerText=data.length}async function add(){let t=document.getElementById('t').value.trim(),c=document.getElementById('c').value.trim(),ty=document.getElementById('type').value;if(!t||!c){alert('శీర్షిక, వివరాలు రాయండి');return}data.unshift({ty,t,c,dt:new Date().toLocaleDateString('te-IN')});await save();document.getElementById('t').value='';document.getElementById('c').value='';alert('🎉 సక్సెస్! 5 సెకన్లలో అందరికీ కనబడుతుంది!')}async function del(i){if(!confirm('తొలగించాలా?'))return;data.splice(i,1);await save()}async function save(){try{document.getElementById('list').innerHTML='⏳ Saving...';let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(r.ok){render();}else{alert('Save Error: '+r.status)}}catch(e){alert('Error: '+e.message)}}show();</script></body></html>
