<!DOCTYPE html>
<html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Mahima Sannidhi</title><style>body{font-family:system-ui;padding:16px;max-width:600px;margin:auto;background:#fff8ec}input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{background:#b8860b;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-size:16px}img{max-width:100%;border-radius:8px}.card{border:1px solid #eee;padding:10px;border-radius:10px;margin:10px 0;background:#fff}</style></head><body>
<h2>🙏 Mahima Sannidhi - Admin</h2>
<p id="status">Loading...</p>
<label>GitHub Token</label><input id="token" type="password" placeholder="Token పెట్టండి">
<label>Title / శీర్షిక</label><input id="title">
<label>Message / వాక్యం</label><textarea id="msg" rows="3"></textarea>
<label>Photo</label><input id="photo" type="file" accept="image/*">
<img id="preview" style="display:none">
<button onclick="savePost()">✅ పోస్ట్ పెట్టండి</button>
<h3>పాత పోస్టులు</h3><div id="list"></div>
<script>
const OWNER="ms2biblemission-bit", REPO="BMmahimasannidhi", PATH="posts.json";
let posts=[];
async function gh(method, body){
  const token=document.getElementById('token').value.trim();
  localStorage.setItem('gh_token', token);
  let url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
  let r=await fetch(url,{headers:{Authorization:"Bearer "+token, Accept:"application/vnd.github+json"}});
  let j=await r.json();
  if(method==="GET") return j;
  return fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+token, Accept:"application/vnd.github+json"},body:JSON.stringify({message:"update posts", content:btoa(unescape(encodeURIComponent(JSON.stringify(posts)))), sha:j.sha})});
}
async function load(){
  let t=localStorage.getItem('gh_token')||""; document.getElementById('token').value=t;
  if(!t){document.getElementById('status').innerText="⚠️ Token పెట్టండి"; return;}
  try{
    let j=await gh("GET");
    let txt=atob(j.content.replace(/\n/g,""));
    posts=JSON.parse(txt);
    document.getElementById('status').innerText="✅ సేఫ్! ఇప్పుడు "+posts.length+" పోస్టులు";
    show();
  }catch(e){ document.getElementById('status').innerText="❌ Load Failed - posts.json లో [] ఉందో చూడండి"; posts=[]; }
}
function show(){
  document.getElementById('list').innerHTML=posts.map((p,i)=>`<div class="card"><b>${p.title||""}</b><p>${p.msg||""}</p>${p.img?`<img src="${p.img}">`:""}<button onclick="del(${i})" style="background:red;margin-top:8px">Delete</button></div>`).join("")||"ఇంకా పోస్టులు లేవు";
}
async function del(i){ if(!confirm("Delete చేయాలా?")) return; posts.splice(i,1); await gh("PUT"); load(); }
document.getElementById('photo').addEventListener('change', e=>{
  let f=e.target.files[0]; if(!f) return;
  let rd=new FileReader(); rd.onload=ev=>{
    let img=new Image(); img.onload=()=>{
      let c=document.createElement('canvas'); let w=img.width, h=img.height;
      let max=800; if(w>max){ h=h*max/w; w=max; }
      c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      let small=c.toDataURL('image/jpeg',0.7);
      document.getElementById('preview').src=small; document.getElementById('preview').style.display='block';
      document.getElementById('preview').dataset.img=small;
      alert("ఫోటో చిన్నది అయింది! ఇప్పుడు Save చేయవచ్చు.");
    }; img.src=ev.target.result;
  }; rd.readAsDataURL(f);
});
async function savePost(){
  let t=document.getElementById('title').value, m=document.getElementById('msg').value;
  let im=document.getElementById('preview').dataset.img||"";
  if(!t){alert("Title పెట్టండి"); return;}
  posts.unshift({title:t, msg:m, img:im, date:new Date().toISOString()});
  let r=await gh("PUT");
  if(r.ok){alert("✅ అయిపోయింది!"); location.reload();} else alert("❌ Save కాలేదు - Token చూడండి");
}
load();
</script></body></html>
