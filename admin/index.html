<div class="box">
<h3>Admin Login</h3>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">

</div>
<p style="margin-top:20px">BIBLE MISSION<br>Dalli Ismayel John - P.R Priyadarshini</p>
</div>

<script>
