let verses=[

{te:"“ప్రభువు నిన్ను కాపాడును.”\n— కీర్తనలు 121:7",en:"“The Lord will keep you from all harm.”\n— Psalm 121:7"},
{te:"“ఆయన గాయములవలన మనకు స్వస్థత కలిగెను.”\n— యెషయా 53:5",en:"“By His wounds we are healed.”\n— Isaiah 53:5"},
{te:"“నీ విశ్వాసము నిన్ను స్వస్థపరచెను.”\n— మార్కు 5:34",en:"“Your faith has healed you.”\n— Mark 5:34"},
{te:"“ప్రభువు నా కొరకు యుద్ధము చేయును.”\n— నిర్గమకాండము 14:14",en:"“The Lord will fight for you.”\n— Exodus 14:14"},

{te:"“నేను మీకు తోడైయుండెదను.”\n— మత్తయి 28:20",en:"“I am with you always.”\n— Matthew 28:20"},
{te:"“నూతన హృదయము నీకు ఇచ్చెదను.”\n— యెహెజ్కేలు 36:26",en:"“I will give you a new heart.”\n— Ezekiel 36:26"},
{te:"“కన్నీళ్లు తుడిచివేయును.”\n— ప్రకటన 21:4",en:"“He will wipe every tear from their eyes.”\n— Revelation 21:4"},
{te:"“ప్రభువు నా బండ, నా కోట.”\n— కీర్తనలు 18:2",en:"“The Lord is my rock, my fortress.”\n— Psalm 18:2"},
{te:"“నీకు మేలు చేయుటకే నేను తలంచితిని.”\n— యిర్మీయా 29:11",en:"“For I know the plans I have for you.”\n— Jeremiah 29:11"},
{te:"“వెలుగు చీకటిలో ప్రకాశించుచున్నది.”\n— యోహాను 1:5",en:"“The light shines in the darkness.”\n— John 1:5"},
{te:"“ఆయన మన పాపములను క్షమించును.”\n— 1 యోహాను 1:9",en:"“He will forgive us our sins.”\n— 1 John 1:9"},
{te:"“ప్రభువు రాక సమీపముగా ఉన్నది.”\n— యాకోబు 5:8",en:"“The Lord’s coming is near.”\n— James 5:8"},
{te:"“నా ఆత్మను నీ చేతికి అప్పగించుచున్నాను.”\n— కీర్తనలు 31:5",en:"“Into Your hands I commit my spirit.”\n— Psalm 31:5"},
{te:"“దేవుని ప్రేమ మన హృదయములలో కుమ్మరింపబడెను.”\n— రోమా 5:5",en:"“God’s love has been poured out into our hearts.”\n— Romans 5:5"},
{te:"“యెహోవా నా ప్రార్థన వినెను.”\n— కీర్తనలు 6:9",en:"“The Lord has heard my cry.”\n— Psalm 6:9"},
{te:"“ఆయన యందు విశ్వాసముంచువాడు సిగ్గుపడడు.”\n— రోమా 10:11",en:"“Anyone who believes in Him will never be put to shame.”\n— Romans 10:11"},
{te:"“ప్రభువు మంచివాడు, ఆయన కృప నిత్యము.”\n— కీర్తనలు 100:5",en:"“The Lord is good, His love endures forever.”\n— Psalm 100:5"},
{te:"“నీ మార్గములన్నిటిలో ఆయనను ఎరుగుము.”\n— సామెతలు 3:6",en:"“In all your ways submit to Him.”\n— Proverbs 3:6"},
{te:"“నేను నిన్ను ఆశీర్వదించెదను.”\n— ఆదికాండము 12:2",en:"“I will bless you.”\n— Genesis 12:2"},
{te:"“నీ దేవుడైన యెహోవా నీ మధ్య ఉన్నాడు.”\n— జెఫన్యా 3:17",en:"“The Lord your God is with you.”\n— Zephaniah 3:17"},
];
let start=new Date(2026,10,25);
function getIdx(){let today=new Date();today.setHours(0,0,0,0);let diff=Math.floor((today-start)/(1000*60*60*24));if(diff<0)diff=0;if(diff>41)diff=41;return {diff:diff,date:today};}
let current=getIdx();
function setL(l){lang=l;document.querySelectorAll('.langRow button').forEach(b=>b.classList.remove('on'));document.getElementById('b-'+l).classList.add('on');showVerse();}
function showVerse(){let o=getIdx();let v=verses[o.diff];document.getElementById('vDate').innerText="📅 "+o.date.toLocaleDateString('te-IN',{day:'numeric',month:'long',year:'numeric'})+"  •  రోజు "+(o.diff+1)+" / 42";let te=document.getElementById('vTe');let en=document.getElementById('vEn');if(lang==='te'){te.style.display='block';en.style.display='none';te.innerText=v.te;}else if(lang==='en'){te.style.display='none';en.style.display='block';en.innerText=v.en;en.style.border='none';}else{te.style.display='block';en.style.display='block';te.innerText=v.te;en.innerText=v.en;}}
function openDoor(){document.getElementById('door').classList.add('open');setTimeout(()=>{document.getElementById('verseArea').style.display='block';showVerse();document.getElementById('verseArea').scrollIntoView({behavior:'smooth'});},600);}
function shareVerse(){let o=getIdx();let v=verses[o.diff];let t="🙏 దినవరి వాక్యం 🙏\n\n"+v.te+"\n\n"+v.en+"\n\nBM మహిమ సన్నిధి";window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");}
showVerse();
</script></body></html>
