<!DOCTYPE html>
<html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>📖 దినవరి వాక్యం</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#E8F0FE;padding-bottom:90px}
.header{background:#0A1A5C;color:#fff;padding:18px;text-align:center;border-radius:0 0 28px 28px}
.header a{color:#fff;text-decoration:none;font-weight:bold}
.wrap{padding:14px;max-width:650px;margin:auto}
.langRow{display:flex;gap:8px;margin:12px 0}
.langRow button{flex:1;padding:12px;border-radius:20px;border:2px solid #0A1A5C;background:#fff;font-weight:bold;cursor:pointer}
.langRow button.on{background:#0A1A5C;color:#fff}
.doorWrap{position:relative;height:180px;background:#0A1A5C;border-radius:20px;overflow:hidden;border:5px solid #FFD54F;cursor:pointer;text-align:center}
.dl,.dr{position:absolute;top:0;width:50%;height:100%;background:#1565C0;transition:transform .7s;z-index:2;display:flex;align-items:center;justify-content:center;font-size:40px}
.dl{left:0}.dr{right:0}.doorWrap.open .dl{transform:translateX(-100%)}.doorWrap.open .dr{transform:translateX(100%)}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;color:#fff}
.card{background:#fff;border-radius:18px;padding:18px;margin-top:14px;text-align:center;border:2px solid #FFD54F}
.card h2{color:#0A1A5C;margin:0}.card p{font-size:20px;line-height:1.8;white-space:pre-line}
.verse{font-size:22px;font-weight:bold;color:#7A0C1D;line-height:1.7}
.verseEn{font-size:18px;color:#0A1A5C;line-height:1.7;margin-top:10px;border-top:1px dashed #ccc;padding-top:10px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:#0A1A5C;display:flex;justify-content:space-around;padding:8px}
.bottom-nav a{color:#fff;text-decoration:none;text-align:center;font-size:12px}
</style></head><body>
<div class="header"><a href="index.html">← హోమ్</a><h2>📖 దినవరి వాక్యం</h2><div>Daily Verse - Telugu + English</div></div>
<div class="wrap">
<div class="langRow"><button id="b-te" class="on" onclick="setL('te')">తెలుగు</button><button id="b-en" onclick="setL('en')">English</button><button id="b-both" onclick="setL('both')">తెలుగు + English</button></div>
<div class="doorWrap" id="door" onclick="openDoor()"><div class="dl">🚪</div><div class="dr">🚪</div><div class="dc"><div style="font-size:50px">📖</div><div style="font-size:22px;font-weight:bold">ఈరోజు వాక్యం</div><div style="color:#FFE082">తలుపు తెరవండి 👆</div></div></div>
<div id="verseArea" style="display:none">
<div class="card"><h2 id="vTitle">🙏 నేటి వాక్యం</h2><p id="vDate" style="color:#666;font-size:14px"></p>
<div id="vTe" class="verse"></div>
<div id="vEn" class="verseEn"></div>
<p style="font-size:14px;color:#666;margin-top:14px">🙏 ఈ వాక్యాన్ని రోజంతా ధ్యానించండి - ప్రార్థించండి!</p>
<button onclick="shareVerse()" style="background:#25D366;color:#fff;border:none;padding:12px 20px;border-radius:20px;font-weight:bold">📤 షేర్ చేయండి</button>
</div>
</div></div>
<nav class="bottom-nav"><a href="index.html">🏠<br>హోమ్</a><a href="bible.html">📖<br>బైబిల్</a><a href="daily.html">📖<br>వాక్యం</a><a href="quiz.html">🎯<br>క్విజ్</a></nav>
<script>
let lang='both';
let verses=[
{te:"“ప్రభువు నా కాపరి, నాకు ఏమియు కొదువ లేదు.”\n— కీర్తనలు 23:1",en:"“The Lord is my shepherd, I lack nothing.”\n— Psalm 23:1"},
{te:"“భయపడకుము, నేను నీకు తోడై ఉన్నాను.”\n— యెషయా 41:10",en:"“Do not fear, for I am with you.”\n— Isaiah 41:10"},
{te:"“నీ పూర్ణహృదయముతో యెహోవాను నమ్ముకొనుము.”\n— సామెతలు 3:5",en:"“Trust in the Lord with all your heart.”\n— Proverbs 3:5"},
{te:"“నేను నిన్ను ఎన్నడును విడువను, ఎన్నడును ఎడబాయను.”\n— హెబ్రీయులు 13:5",en:"“Never will I leave you, never will I forsake you.”\n— Hebrews 13:5"},
{te:"“బలహీనతయందు నా కృప నీకు చాలును.”\n— 2 కొరింథీయులు 12:9",en:"“My grace is sufficient for you, for my power is made perfect in weakness.”\n— 2 Corinthians 12:9"},
{te:"“ప్రభువునందు ఆనందించుము, ఆయన నీ హృదయ వాంఛలను తీర్చును.”\n— కీర్తనలు 37:4",en:"“Take delight in the Lord, and He will give you the desires of your heart.”\n— Psalm 37:4"},
{te:"“అడుగుడి, మీకు ఇవ్వబడును.”\n— మత్తయి 7:7",en:"“Ask and it will be given to you.”\n— Matthew 7:7"},
];
let today=new Date();let idx=today.getDate()%verses.length;let v=verses[idx];
function setL(l){lang=l;document.querySelectorAll('.langRow button').forEach(b=>b.classList.remove('on'));document.getElementById('b-'+l).classList.add('on');showVerse();}
function showVerse(){document.getElementById('vDate').innerText="📅 "+today.toLocaleDateString('te-IN',{day:'numeric',month:'long',year:'numeric'});let te=document.getElementById('vTe');let en=document.getElementById('vEn');if(lang==='te'){te.style.display='block';en.style.display='none';te.innerText=v.te;}else if(lang==='en'){te.style.display='none';en.style.display='block';en.innerText=v.en;en.style.border='none';}else{te.style.display='block';en.style.display='block';te.innerText=v.te;en.innerText=v.en;}}
function openDoor(){document.getElementById('door').classList.add('open');setTimeout(()=>{document.getElementById('verseArea').style.display='block';showVerse();document.getElementById('verseArea').scrollIntoView({behavior:'smooth'});},600);}
function shareVerse(){let t="🙏 దినవరి వాక్యం 🙏\n\n"+v.te+"\n\n"+v.en+"\n\nBM మహిమ సన్నిధి";window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");}
showVerse();
</script></body></html>
