<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 క్విజ్ - BM మహిమ సన్నిధి</title>
<style>
*{box-sizing:border-box} body{font-family:system-ui;margin:0;background:#E8F5E9;padding-bottom:90px}
.header{background:#0B3D2E;color:white;padding:18px 12px;text-align:center;border-radius:0 0 28px 28px}
.header a{color:white;text-decoration:none;font-weight:bold}
.wrap{padding:14px;max-width:650px;margin:auto}
.doorWrap{position:relative;height:420px;background:#0B3D2E;border-radius:22px;overflow:hidden;box-shadow:0 6px 20px #0003;border:6px solid #5D4037;cursor:pointer}
.doorLeft,.doorRight{position:absolute;top:0;width:50%;height:100%;background:linear-gradient(#8D6E63,#5D4037);transition:transform 0.8s ease;z-index:5;display:flex;align-items:center;justify-content:center;color:white;font-size:50px}
.doorLeft{left:0;border-right:3px solid #3E2723} .doorRight{right:0;border-left:3px solid #3E2723}
.doorWrap.open .doorLeft{transform:translateX(-100%)} .doorWrap.open .doorRight{transform:translateX(100%)}
.doorCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;text-align:center;padding:20px}
.doorHandle{width:16px;height:16px;background:gold;border-radius:50%;position:absolute;top:50%;z-index:6} .handleL{right:10px} .handleR{left:10px}
.doorWrap.open .doorHandle{opacity:0}
.qCard{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
.opt{display:block;width:100%;text-align:left;background:#F1F8E9;border:2px solid #C8E6C9;padding:12px;border-radius:12px;margin:8px 0;font-size:17px;cursor:pointer}
.opt.correct{background:#C8E6C9;border-color:#2E7D32} .opt.wrong{background:#FFCDD2;border-color:#C62828}
.closeBtn{background:#C62828;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#0B3D2E;display:flex;justify-content:space-around;padding:8px 2px}
.bottom-nav a{flex:1;color:white;text-decoration:none;text-align:center;font-size:12px;font-weight:bold;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom-nav .active{background:rgba(255,255,255,.18);border-radius:12px}
</style>
</head>
<body>
<div class="header"><a href="index.html">← హోమ్</a><h2 style="margin:8px 0 0">🎯 బైబిల్ క్విజ్ - హార్డ్</h2><div style="font-size:13px;opacity:.9">రోజూ కొత్త ప్రశ్నలు - తలుపు తట్టండి</div></div>
<div class="wrap">
<div class="doorWrap" id="door" onclick="openDoor()">
  <div class="doorLeft">🚪<div class="doorHandle handleL"></div></div>
  <div class="doorRight">🚪<div class="doorHandle handleR"></div></div>
  <div class="doorCenter"><div style="font-size:55px">🎯</div><div style="font-size:26px;font-weight:bold;color:white">ఈరోజు క్విజ్</div><div style="color:#FFE082;margin-top:6px" id="todayLabel">తలుపు నొక్కి ఓపెన్ చేయండి 👆</div><div style="background:gold;color:#3E2723;padding:10px 20px;border-radius:20px;font-weight:bold;margin-top:16px">🚪 తలుపు తెరవండి</div></div>
</div>
<div style="text-align:center;color:gray;font-size:13px;margin-top:10px" id="doorHint">తలుపు మూసి ఉంది - నొక్కితే తెరుచుకుంటుంది</div>
<div id="quizArea" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:19px;color:#0B3D2E">📖 <span id="quizDate"></span> - <span id="score">స్కోర్: 0 / 5</span></b><button class="closeBtn" onclick="closeDoor()">✖️ మూసేయండి</button></div>
  <div id="qList"></div>
  <button onclick="closeDoor()" style="width:100%;background:#0B3D2E;color:white;border:none;padding:14px;border-radius:12px;font-weight:bold;font-size:17px;margin-top:10px">🚪 తలుపు మూసేసి బయటకు వెళ్ళండి</button>
</div>
</div>
<nav class="bottom-nav"><a href="index.html"><span style="font-size:22px">🏠</span>హోమ్</a><a href="books.html"><span style="font-size:22px">📚</span>పుస్తకాలు</a><a href="songs.html"><span style="font-size:22px">🎵</span>పాటలు</a><a href="quiz.html" class="active"><span style="font-size:22px">🎯</span>క్విజ్</a></nav>
<script>
let score=0;
// ✅ 30 హార్డ్ ప్రశ్నలు - రోజూ 5 మాత్రమే వస్తాయి
let pool=[
{q:"మోషే తండ్రి పేరు ఏమిటి?",o:["అమ్రాము","అహరోను","యోసేపు","లేవి"],a:0,exp:"నిర్గమకాండము 6:20 - అమ్రాము"},
{q:"దావీదు తాత పేరు ఏమిటి?",o:["యెష్షయి","బోయజు","ఓబేదు","యాకోబు"],a:2,exp:"రూతు 4:17 - ఓబేదు"},
{q:"యేసు ప్రభువు తొలి అద్భుతం ఎక్కడ జరిగింది?",o:["కానా","బెత్లెహేము","నజరేతు","కపెర్నహూము"],a:0,exp:"యోహాను 2:1 - కానా వివాహములో నీటిని ద్రాక్షారసముగా చేసారు"},
{q:"పౌలు మొదటి పేరు ఏమిటి?",o:["సౌలు","బర్నబా","సీల","తిమోతి"],a:0,exp:"అపో.కా 13:9 - సౌలు అను పౌలు"},
{q:"ఆదికాండములో దేవుడు మొదట సృష్టించినది ఏమిటి?",o:["వెలుగు","ఆకాశము","భూమి","సూర్యుడు"],a:0,exp:"ఆది 1:3 - వెలుగు కలుగును గాక"},
{q:"ఎన్ని రోజులు నోవాహు ఓడలో వర్షం కురిసింది?",o:["40 రోజులు","7 రోజులు","150 రోజులు","12 రోజులు"],a:0,exp:"ఆది 7:12 - 40 దినములు"},
{q:"సొలొమోను తల్లి పేరు?",o:["బత్షెబ","రూతు","ఎస్తేరు","హన్నా"],a:0,exp:"2 సమూ 12:24 - బత్షెబ"},
{q:"బైబిల్ లో అతి చిన్న పుస్తకం?",o:["ఓబద్యా","యూదా","ఫిలేమోను","హగ్గయి"],a:0,exp:"ఓబద్యా - 1 అధ్యాయం, 21 వచనాలు"},
{q:"యేసు ప్రభువు ఎన్ని ఉపమానాలు చెప్పారు? (సుమారు)",o:["40 కి పైగా","10","7","100"],a:0,exp:"సుమారు 40+ ఉపమానాలు"},
{q:"యోబు ఎన్ని సంవత్సరాలు బాధపడ్డాడు? (సాంప్రదాయం)",o:["ఖచ్చితంగా చెప్పలేము","7","40","12"],a:0,exp:"బైబిల్ లో సంవత్సరాలు చెప్పలేదు - ఇదే ట్రిక్!"},
{q:"దానియేలు ఎన్ని సార్లు ప్రార్థన చేసేవాడు?",o:["రోజుకు 3 సార్లు","రోజుకు 1 సారి","వారానికి 1 సారి","రోజుకు 7 సార్లు"],a:0,exp:"దానియేలు 6:10 - దినమునకు ముమ్మారు"},
{q:"మోషే ఎన్ని సంవత్సరాలు బ్రతికాడు?",o:["120","80","40","175"],a:0,exp:"ద్వితీ 34:7 - 120 సంవత్సరాలు"},
{q:"కీర్తనలు ఎన్ని ఉన్నాయి?",o:["150","100","120","119"],a:0,exp:"కీర్తనలు మొత్తం 150"},
{q:"యేసు ప్రభువు శిష్యులలో పన్ను వసూలు చేసేవాడు ఎవరు?",o:["మత్తయి","పేతురు","యోహాను","థోమా"],a:0,exp:"మత్తయి 9:9 - మత్తయి సుంకరి"},
{q:"అబ్రాహాము మొదటి పేరు?",o:["అబ్రాము","ఇస్సాకు","యాకోబు","ఇష్మాయేలు"],a:0,exp:"ఆది 17:5 - అబ్రాము నుండి అబ్రాహాము"},
{q:"ఎస్తేరు రాణి భర్త పేరు?",o:["అహష్వేరోషు","దర్యావేషు","నెబుకద్నెజరు","కోరెషు"],a:0,exp:"ఎస్తేరు 2:17 - అహష్వేరోషు"},
{q:"యోనా ఏ చేపలో ఉన్నాడు? బైబిల్ ఏమంటుంది?",o:["పెద్ద చేప","తిమింగలం","సొరచేప","డాల్ఫిన్"],a:0,exp:"యోనా 1:17 - పెద్ద చేప, తిమింగలం అని లేదు!"},
{q:"పేతురు ఎన్ని సార్లు యేసును ఎరుగనన్నాడు?",o:["3 సార్లు","1 సారి","7 సార్లు","2 సార్లు"],a:0,exp:"మత్తయి 26:75 - ముమ్మారు"},
{q:"ఆదాము అంటే అర్థం?",o:["మట్టి / ఎర్రమట్టి","వెలుగు","జీవము","రాజు"],a:0,exp:"ఆదాము - అదామా అంటే మట్టి"},
{q:"బైబిల్ లో అతి పొడవైన అధ్యాయం?",o:["కీర్తన 119","కీర్తన 23","యెషయా 53","ఆది 1"],a:0,exp:"కీర్తన 119 - 176 వచనాలు"},
{q:"యాకోబుకు ఎంతమంది భార్యలు?",o:["4","2","1","12"],a:0,exp:"లేయా, రాహేలు + బిల్హా, జిల్పా = 4"},
{q:"సమూయేలు తల్లి పేరు?",o:["హన్నా","సారా","రాహేలు","మరియ"],a:0,exp:"1 సమూ 1:20 - హన్నా"},
{q:"యేసు ప్రభువు ఎన్ని గంటలు సిలువ మీద ఉన్నారు?",o:["సుమారు 6 గంటలు","3 గంటలు","12 గంటలు","1 రోజు"],a:0,exp:"ఉదయం 9 నుండి మధ్యాహ్నం 3 వరకు - 6 గంటలు"},
{q:"అపోస్తలుల కార్యములు ఎవరు రాసారు?",o:["లూకా","పౌలు","పేతురు","మార్కు"],a:0,exp:"లూకా సువార్త + అపో.కా రెండూ లూకా రాసారు"},
{q:"దావీదు ఎన్ని సంవత్సరాలు రాజుగా ఉన్నాడు?",o:["40","20","70","33"],a:0,exp:"2 సమూ 5:4 - 40 సంవత్సరాలు"},
{q:"రూతు భర్త పేరు?",o:["బోయజు","ఎలీమెలెకు","మహ్లోను","నయోమి"],a:0,exp:"రూతు 4:13 - బోయజు"},
{q:"యోసేపును ఎంతకు అమ్మారు?",o:["20 తులముల వెండి","30 తులముల వెండి","10 తులముల బంగారం","100 రూపాయలు"],a:0,exp:"ఆది 37:28 - 20 తులముల వెండి"},
{q:"మోషే చేతిలో కఱ్ఱ దేనిగా మారింది?",o:["పాము","చేప","పక్షి","రాయి"],a:0,exp:"నిర్గమ 4:3 - పాముగా"},
{q:"ఏ ప్రవక్తను సింహాల గుహలో వేసారు?",o:["దానియేలు","యెషయా","యిర్మీయా","యెహెజ్కేలు"],a:0,exp:"దానియేలు 6 - సింహాల గుహ"},
{q:"యేసు ప్రభువు తల్లి మరియ బంధువు ఎవరు?",o:["ఎలీసబెతు","మార్త","మరియ మగ్దలేనే","సలోమి"],a:0,exp:"లూకా 1:36 - ఎలీసబెతు"},
];
function getTodayQuestions(){
  let d=new Date(); let seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  let arr=[...pool]; let out=[];
  for(let i=0;i<5;i++){ let idx=(seed*7+i*13)%arr.length; out.push(arr.splice(idx,1)[0]); }
  return out;
}
let todayQs=getTodayQuestions();
let todayStr=new Date().toLocaleDateString('te-IN',{day:'numeric',month:'long',year:'numeric'});
document.getElementById('todayLabel').textContent="ఈరోజు - "+todayStr+" - 5 కొత్త హార్డ్ ప్రశ్నలు";
document.getElementById('quizDate').textContent=todayStr;
function openDoor(){
  document.getElementById('door').classList.add('open');
  document.getElementById('doorHint').textContent="తలుపు తెరుచుకుంది! ఈరోజు 5 హార్డ్ ప్రశ్నలు 👇";
  setTimeout(()=>{ document.getElementById('quizArea').style.display='block'; document.getElementById('quizArea').scrollIntoView({behavior:'smooth'}); },600);
  renderQ();
}
function closeDoor(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('door').classList.remove('open');
  document.getElementById('doorHint').textContent="తలుపు మూసుకుపోయింది - రేపు మళ్ళీ కొత్త ప్రశ్నలు వస్తాయి";
  window.scrollTo({top:0,behavior:'smooth'}); score=0; document.getElementById('score').textContent="స్కోర్: 0 / 5";
}
function renderQ(){
  let box=document.getElementById('qList'); box.innerHTML='';
  todayQs.forEach((item,qi)=>{
    let card=document.createElement('div'); card.className='qCard';
    let h=document.createElement('div'); h.style.cssText='font-size:19px;font-weight:bold;color:#0B3D2E'; h.textContent=(qi+1)+". "+item.q;
    card.appendChild(h);
    // ఆప్షన్లు కూడా రోజూ మార్చేసాం - గుర్తుపెట్టుకోలేరు
    let opts=item.o.map((txt,idx)=>({txt,idx})); opts.sort(()=>Math.random()-0.5);
    opts.forEach(o=>{
      let b=document.createElement('button'); b.className='opt'; b.textContent=o.txt;
      b.onclick=()=>{
        if(card.dataset.done) return; card.dataset.done="1";
        if(o.idx===item.a){ b.classList.add('correct'); b.textContent="✅ "+o.txt+" - కరెక్ట్!"; score++; }
        else{ b.classList.add('wrong'); b.textContent="❌ "+o.txt+" - తప్పు!"; let exp=document.createElement('div'); exp.style.cssText='background:#FFF3E0;padding:10px;border-radius:10px;margin-top:8px;font-size:14px;color:#5D4037'; exp.textContent="📖 వివరణ: "+item.exp; card.appendChild(exp); }
        document.getElementById('score').textContent="స్కోర్: "+score+" / 5";
      };
      card.appendChild(b);
    });
    box.appendChild(card);
  });
}
</script>
</body>
</html>
