348:{q:"తన స్నేహితుడి భార్యను తీసుకున్నందుకు, ప్రవక్తచే గద్దించబడిన రాజు ఎవరు?",a:"దావీదు"},
349:{q:"దేవుని కోసం పెద్ద మందిరం కట్టిన రాజు ఎవరు?",a:"సొలొమోను"},

// ✅ అర్ధరాత్రి 12 గంటలకే కొత్త ప్రశ్న - రోజు మారగానే ఆటోమేటిక్ గా మారిపోతుంది
function getDayOfYear(){
  let now = new Date();
  let start = new Date(now.getFullYear(),0,0);
  return Math.floor((now - start) / (1000*60*60*24));
}
let day = getDayOfYear();
let data = quizData[day] || {q:"ఈ రోజు ప్రశ్న ఇంకా రాలేదు!", a:""};
document.getElementById('dayLabel').innerText = "Day " + day;
document.getElementById('qText').innerText = data.q;
document.getElementById('ansBox').innerText = "✅ జవాబు: " + data.a;

function checkAns(){
  let h = new Date().getHours();
  if(h >= 18){
    document.getElementById('ansBox').style.display='block';
    document.getElementById('waitBox').style.display='none';
  } else {
    alert("⏳ ఇంకా సాయంత్రం 6 కాలేదు అండి! కొంచెం ఆలోచించండి!");
  }
}
