<!DOCTYPE html>
<html lang="te">
<head>

<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;background:#E8F5E9;padding-bottom:90px}
.header{background:#0B3D2E;color:#fff;padding:14px 10px;text-align:center;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:8px}
.header img{width:58px;height:58px;border-radius:50%;border:3px solid gold;object-fit:cover;background:#fff}
.header h2{margin:2px 0;font-size:22px}
.header a{color:#fff;text-decoration:none;font-weight:bold;font-size:14px}
.wrap{padding:14px;max-width:650px;margin:auto}
.month{background:#fff;border-radius:16px;padding:14px;margin:14px 0;box-shadow:0 2px 8px #0001;overflow:hidden}
.month img{width:100%;height:220px;object-fit:cover;border-radius:12px;border:2px solid gold}
.month h3{margin:10px 0 8px;color:#0B3D2E;font-size:22px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:15px;text-align:center}
th{color:#0B3D2E;padding:7px 2px} td{padding:8px 2px}
.sun{color:#C62828;font-weight:bold}
.imp{background:#FFF8E1;border:2px solid #FFD54F;border-radius:12px;padding:12px;margin-top:10px}
.imp b{color:#0B3D2E;font-size:16px}
.imp div{font-size:15px;margin-top:5px;line-height:1.8}
.maha{background:gold;color:#3E2723;font-weight:bold;padding:4px 10px;border-radius:20px;display:inline-block}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:#0B3D2E;display:flex;justify-content:space-around;padding:8px 2px}
.bottom-nav a{flex:1;color:#fff;text-decoration:none;text-align:center;font-size:12px;font-weight:bold;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}
</style>
</head>
<body>
<div class="header">
<img src="images/jesus.jpg" onerror="this.src='https://i.ibb.co/6b0Z0Qz/jesus.jpg'">
<div style="flex:1;text-align:center">
<a href="index.html">← హోమ్</a>
<div>📖 బైబిల్ మిషన్</div>
<h2>మా సందేశం<br>మహిమ సన్నిధి క్యాలండర్</h2>
<div>📅 2027</div>
</div>
<img src="images/devadasu.jpg" onerror="this.style.visibility='hidden'">
</div>

<div class="wrap">
<div style="background:#FFF8E1;border:2px solid #FFD54F;border-radius:16px;padding:12px;text-align:center">
<b style="font-size:18px;color:#0B3D2E">✝️ 2027 - ప్రభువు సంవత్సరం</b>
<div style="font-size:13px;color:#666">నెలకో ప్రభువు ఫోటో - కింద ముఖ్యమైన దినాలు</div>
</div>
<div id="cal"></div>
</div>

<nav class="bottom-nav">
<a href="index.html"><span style="font-size:22px">🏠</span>హోమ్</a>

<a href="quiz.html"><span style="font-size:22px">🎯</span>క్విజ్</a>
</nav>

<script>
let months=[
{name:"జనవరి",img:"images/jan.jpg",imp:"• జన 1 : నూతన సంవత్సరం<br>• జన 26 : గణతంత్ర దినోత్సవం<br>• <span class='maha'>జన 24, 25, 26 : మహా సభలు</span>"},
{name:"ఫిబ్రవరి",img:"images/feb.jpg",imp:"• ఫిబ్ర 17 : లెంట్ డేస్ ప్రారంభం"},
{name:"మార్చి",img:"images/mar.jpg",imp:"• మార్చి 28 : పామ్ సండే"},
{name:"ఏప్రిల్",img:"images/apr.jpg",imp:"• ఏప్రి 1 : పరిశుద్ధ గురువారం<br>• ఏప్రి 2 : గుడ్ ఫ్రైడే<br>• ఏప్రి 4 : ఈస్టర్ - పునరుత్థాన దినం<br>• ఏప్రి 14 : అంబేద్కర్ జయంతి"},
{name:"మే",img:"images/may.jpg",imp:"• మే 1 : మే డే<br>• మే 13 : ఆరోహణ దినం<br>• మే 23 : పెంతెకొస్తు"},
{name:"జూన్",img:"images/jun.jpg",imp:"• జూన్ 21 : ఫాదర్స్ డే"},
{name:"జూలై",img:"images/jul.jpg",imp:"• జూలై 26 : కార్గిల్ విజయ్ దివస్"},
{name:"ఆగస్టు",img:"images/aug.jpg",imp:"• ఆగ 15 : స్వాతంత్ర్య దినోత్సవం<br>• ఆగ 15 : మరియ తల్లి ఆరోహణ<br>• ఆగ 29 : తెలుగు భాషా దినోత్సవం"},
{name:"సెప్టెంబర్",img:"images/sep.jpg",imp:"• సెప్ 5 : ఉపాధ్యాయ దినోత్సవం"},
{name:"అక్టోబర్",img:"images/oct.jpg",imp:"• అక్టో 2 : గాంధీ జయంతి"},
{name:"నవంబర్",img:"images/nov.jpg",imp:"• నవం 1 : సకల పరిశుద్ధుల దినం<br>• నవం 14 : బాలల దినోత్సవం<br>• నవం 28 : ఆగమన కాలం ప్రారంభం"},
{name:"డిసెంబర్",img:"images/dec.jpg",imp:"• డిసెం 25 : క్రిస్మస్ - యేసు జననం<br>• డిసెం 31 : సంవత్సరాంత కృతజ్ఞతా ప్రార్థన"}
];
let box=document.getElementById('cal');
months.forEach((mm,m)=>{
  let days=new Date(2027,m+1,0).getDate();
  let start=new Date(2027,m,1).getDay();
  let h='<div class="month"><img src="'+mm.img+'" onerror="this.src=\'images/jesus.jpg\'"><h3>'+mm.name+' 2027</h3><table><tr><th>ఆది</th><th>సోమ</th><th>మంగళ</th><th>బుధ</th><th>గురు</th><th>శుక్ర</th><th>శని</th></tr><tr>';
  for(let i=0;i<start;i++) h+='<td></td>';
  for(let day=1;day<=days;day++){
    let dow=new Date(2027,m,day).getDay();
    h+='<td class="'+(dow==0?'sun':'')+'">'+day+'</td>';
    if(dow==6 && day!=days) h+='</tr><tr>';
  }
  h+='</tr></table><div class="imp"><b>📌 ముఖ్యమైన దినాలు :</b><div>'+mm.imp+'</div></div></div>';
  box.innerHTML+=h;
});
</script>
</body>
</html>
