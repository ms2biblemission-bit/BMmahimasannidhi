<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 మా సందేశం మహిమ సన్నిధి క్యాలండర్</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;background:#E8F5E9;padding-bottom:80px}
.header{background:#0B3D2E;color:#fff;padding:14px 10px;text-align:center;border-radius:0 0 22px 22px}
.header a{color:#FFE082;text-decoration:none;font-weight:bold;font-size:14px}
.header h2{margin:4px 0;font-size:23px;line-height:1.3}
.wrap{padding:10px;max-width:650px;margin:auto}
.top{background:#FFF8E1;border:2px solid #FFD54F;border-radius:14px;padding:10px;text-align:center;font-weight:bold;color:#0B3D2E}
/* ⭐ పక్కకి swipe */
#cal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:10px 2px 14px;scroll-behavior:smooth}
#cal::-webkit-scrollbar{display:none}
.slide{min-width:100%;max-width:100%;flex-shrink:0;scroll-snap-align:center}
/* ⭐ 1వ పేజీ - ఈ రోజు పెద్దగా */
.today-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 8px #0002;text-align:center}
.today-card .big-green{background:#0B3D2E;color:#fff;border-radius:16px;padding:30px 10px}
.today-card .big-green .num{font-size:90px;font-weight:900;line-height:1}
.today-card .big-green .mon{font-size:24px;font-weight:bold;color:#FFE082;margin-top:6px}
.today-card .big-green .day{font-size:16px;opacity:.9;margin-top:4px}
.today-card .verse{font-size:14px;margin-top:12px;background:#FFF8E1;border:1px solid #FFD54F;padding:10px;border-radius:12px;line-height:1.7;color:#333}
/* ⭐ 2వ పేజీ నుండి - నెల మొత్తం */
.month{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 8px #0002}
.month h3{margin:2px 0 10px;color:#fff;font-size:22px;text-align:center;background:#FF9800;padding:10px;border-radius:12px}
.month.current h3{background:#FF9800}
table{width:100%;border-collapse:collapse;font-size:16px;text-align:center}
th{color:#0B3D2E;padding:7px 2px;font-size:15px} td{padding:7px 2px}
.sun{color:#C62828;font-weight:bold}
.today{background:#FF9800;color:#fff !important;border-radius:50%;font-weight:bold}
.imp{background:#FFF8E1;border:1px solid #FFD54F;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;line-height:1.8}
.maha{background:gold;color:#3E2723;font-weight:bold;padding:2px 8px;border-radius:20px;display:inline-block}
.nav-row{display:flex;gap:10px;margin:0 10px}
.nav-row button{flex:1;background:#0B3D2E;color:#fff;border:none;padding:13px;border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer}
.nav-row button:active{background:#FF9800}
.hint{text-align:center;font-size:12px;color:#666;margin:6px 0 0}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:#0B3D2E;display:flex;justify-content:space-around;padding:8px 2px}
.bottom-nav a{flex:1;color:#fff;text-decoration:none;text-align:center;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<a href="index.html">← హోమ్</a>
<div style="font-size:13px;margin-top:4px">📖 బైబిల్ మిషన్</div>
<h2>మా సందేశం<br>మహిమ సన్నిధి క్యాలండర్</h2>
<div>📅 2026 - 2029</div>
</div>
<div class="wrap">
<div class="top">✝️ 2026 - 2029 | 3 సంవత్సరాలు - ఒకే చోట</div>
<div class="hint">👈 👉 సైడ్ కి జరపండి - నెక్స్ట్ నెల వస్తుంది</div>
<div id="cal"></div>
<div class="nav-row">
<button onclick="moveCal(-1)">◀ ముందు నెల</button>
<button onclick="moveCal(1)">తర్వాత నెల ▶</button>
</div>
<div id="calPos" style="text-align:center;font-weight:bold;color:#0B3D2E;margin-top:8px;font-size:14px">ఈ రోజు</div>
</div>
<nav class="bottom-nav">
<a href="index.html">🏠<br>హోమ్</a>
<a href="books.html">📚<br>పుస్తకాలు</a>
<a href="songs.html">🎵<br>పాటలు</a>
<a href="quiz.html">🎯<br>క్విజ్</a>
</nav>
<script>
function moveCal(dir){
  let c=document.getElementById('cal');
  c.scrollBy({left: dir * (c.clientWidth+12), behavior:'smooth'});
}
function getEaster(y){
  let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  let month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(y,month-1,day);
}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x;}
function fmt(d){let m=["జన","ఫిబ్ర","మార్చి","ఏప్రి","మే","జూన్","జూలై","ఆగ","సెప్","అక్టో","నవం","డిసెం"];return m[d.getMonth()]+" "+d.getDate();}
function getHolidays(y,m){
  let easter=getEaster(y);
  let lent=addDays(easter,-46), palm=addDays(easter,-7), maundy=addDays(easter,-3), goodFri=addDays(easter,-2), asc=addDays(easter,39), pent=addDays(easter,49);
  let christmas=new Date(y,11,25); let adv=new Date(christmas); while(adv.getDay()!==0) adv.setDate(adv.getDate()-1); adv.setDate(adv.getDate()-21);
  let all=[];
  if(m===0){
    all.push("• జన 1 : నూతన సంవత్సరం","• జన 26 : గణతంత్ర దినోత్సవం");
    if(y===2027) all.push("<span class='maha'>జన 24, 25, 26 : మహా సభలు</span>");
    if(y===2028) all.push("<span class='maha'>మహా సభలు : త్వరలో ప్రకటిస్తాము</span>");
    if(y===2029) all.push("<span class='maha'>మహా సభలు : త్వరలో ప్రకటిస్తాము</span>");
  }
  if(m===1 && lent.getMonth()===1) all.push("• "+fmt(lent)+" : లెంట్ డేస్ ప్రారంభం");
  if(m===2 && lent.getMonth()===2) all.push("• "+fmt(lent)+" : లెంట్ డేస్ ప్రారంభం");
  if(m===2 && palm.getMonth()===2) all.push("• "+fmt(palm)+" : పామ్ సండే");
  if(m===3 && palm.getMonth()===3) all.push("• "+fmt(palm)+" : పామ్ సండే");
  if(m===3){ if(maundy.getMonth()===3) all.push("• "+fmt(maundy)+" : పరిశుద్ధ గురువారం"); if(goodFri.getMonth()===3) all.push("• "+fmt(goodFri)+" : గుడ్ ఫ్రైడే"); if(easter.getMonth()===3) all.push("• "+fmt(easter)+" : ఈస్టర్ - పునరుత్థాన దినం"); all.push("• ఏప్రి 14 : అంబేద్కర్ జయంతి"); }
  if(m===4){ if(maundy.getMonth()===4) all.push("• "+fmt(maundy)+" : పరిశుద్ధ గురువారం"); if(goodFri.getMonth()===4) all.push("• "+fmt(goodFri)+" : గుడ్ ఫ్రైడే"); if(easter.getMonth()===4) all.push("• "+fmt(easter)+" : ఈస్టర్ - పునరుత్థాన దినం"); all.push("• మే 1 : మే డే"); if(asc.getMonth()===4) all.push("• "+fmt(asc)+" : ఆరోహణ దినం"); if(pent.getMonth()===4) all.push("• "+fmt(pent)+" : పెంతెకొస్తు"); }
  if(m===5){ if(asc.getMonth()===5) all.push("• "+fmt(asc)+" : ఆరోహణ దినం"); if(pent.getMonth()===5) all.push("• "+fmt(pent)+" : పెంతెకొస్తు"); all.push("• జూన్ 21 : ఫాదర్స్ డే"); }
  if(m===6) all.push("• జూలై 26 : కార్గిల్ విజయ్ దివస్");
  if(m===7) all.push("• ఆగ 15 : స్వాతంత్ర్య దినోత్సవం","• ఆగ 15 : మరియ తల్లి ఆరోహణ","• ఆగ 29 : తెలుగు భాషా దినోత్సవం");
  if(m===8) all.push("• సెప్ 5 : ఉపాధ్యాయ దినోత్సవం");
  if(m===9) all.push("• అక్టో 2 : గాంధీ జయంతి");
  if(m===10) all.push("• నవం 1 : సకల పరిశుద్ధుల దినం","• నవం 14 : బాలల దినోత్సవం","• "+fmt(adv)+" : ఆగమన కాలం ప్రారంభం");
  if(m===11) all.push("• డిసెం 25 : క్రిస్మస్ - యేసు జననం","• డిసెం 31 : సంవత్సరాంత కృతజ్ఞతా ప్రార్థన");
  return all.join("<br>");
}
let today=new Date();
let telMonths=["జనవరి","ఫిబ్రవరి","మార్చి","ఏప్రిల్","మే","జూన్","జూలై","ఆగస్టు","సెప్టెంబర్","అక్టోబర్","నవంబర్","డిసెంబర్"];
let telDays=["ఆదివారం","సోమవారం","మంగళవారం","బుధవారం","గురువారం","శుక్రవారం","శనివారం"];
let box=document.getElementById('cal');
let labels=["ఈ రోజు"];
// ⭐ 1వ పేజీ - ఈ రోజు మాత్రమే పెద్దగా - రేపు 18, ఎల్లుండి 19 ఆటోమేటిక్
let todayHTML='<div class="slide"><div class="today-card">';
todayHTML+='<div style="font-size:15px;color:#666">📅 ఈ రోజు</div>';
todayHTML+='<div class="big-green"><div class="num">'+today.getDate()+'</div><div class="mon">'+telMonths[today.getMonth()]+' '+today.getFullYear()+'</div><div class="day">'+telDays[today.getDay()]+'</div></div>';
todayHTML+='<div class="verse">✝️ మరనాత - ప్రభువైన యేసు త్వరగా వచ్చుచున్నాడు 🙏<br>👈 👉 సైడ్ కి జరపండి - నవంబర్ నెల మొత్తం వస్తుంది</div>';
todayHTML+='</div></div>';
box.innerHTML=todayHTML;
// ⭐ 2వ పేజీ నుండి - నెల మొత్తం
let list=[];
[10,11].forEach(m=>list.push([2026,m]));
[2027,2028,2029].forEach(y=>{ for(let m=0;m<12;m++) list.push([y,m]); });
list.forEach(([y,m])=>{ box.innerHTML+=renderMonth(y,m); labels.push(telMonths[m]+" "+y); });
function renderMonth(y,m){
  let days=new Date(y,m+1,0).getDate();
  let start=new Date(y,m,1).getDay();
  let h='<div class="slide"><div class="month"><h3>'+telMonths[m]+' '+y+'</h3><table><tr><th>ఆది</th><th>సోమ</th><th>మంగళ</th><th>బుధ</th><th>గురు</th><th>శుక్ర</th><th>శని</th></tr><tr>';
  for(let k=0;k<start;k++) h+='<td></td>';
  for(let day=1;day<=days;day++){
    let dow=new Date(y,m,day).getDay();
    let isToday=(day===today.getDate() && m===today.getMonth() && y===today.getFullYear());
    h+='<td class="'+(dow==0?'sun ':'')+(isToday?'today':'')+'">'+day+'</td>';
    if(dow==6 && day!=days) h+='</tr><tr>';
  }
  h+='</tr></table><div class="imp"><b>📌 ముఖ్యమైన దినాలు :</b><br>'+getHolidays(y,m)+'</div></div></div>';
  return h;
}
let calEl=document.getElementById('cal');
calEl.addEventListener('scroll',()=>{
  let w=calEl.clientWidth+12;
  let idx=Math.round(calEl.scrollLeft/w);
  if(labels[idx]) document.getElementById('calPos').textContent=labels[idx];
});
</script>
</body>
</html>
