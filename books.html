<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>మెసేజ్ బుక్స్ - మహిమ సన్నిధి</title>
<style>body{font-family:system-ui;background:#f5f5f5;margin:0} .head{background:#8B0000;color:white;padding:20px;text-align:center} .head a{color:white} .wrap{padding:12px;max-width:700px;margin:auto} .book{background:white;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1);cursor:pointer} .book h3{margin:0;color:#8B0000} .book p{color:#555;font-size:14px} .chap{background:#fff8e1;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;border-left:4px solid #FF9800} .page{background:white;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1);line-height:1.8;white-space:pre-line;text-align:center} .page img{width:100%;border-radius:12px;margin:10px 0} .btn{background:#8B0000;color:white;border:none;padding:12px 18px;border-radius:30px;font-weight:bold;width:100%;margin:6px 0;cursor:pointer} .btn2{background:#4CAF50;color:white;border:none;padding:10px 16px;border-radius:20px;font-weight:bold;cursor:pointer;margin:4px} input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}</style></head>
<body>
<div class="head"><a href="index.html">⬅ హోమ్</a><h2>📚 మెసేజ్ బుక్స్</h2><div>ఒక్కో బుక్ - ఒక్కో గ్రంథం లాగా - ఒక్కో పేజీలో - ఒక్కో వివరణ</div></div>
<div class="wrap">
<input id="search" placeholder="🔍 బుక్ / అధ్యాయం వెతకండి..." oninput="renderBooks()">
<div id="box">లోడ్ అవుతోంది...</div>
<div id="detail"></div>
</div>
<script>
let BOOKS=[];
let DEFAULT_BOOKS=[
{id:1,title:"📖 బుక్ 1 - ఆదికాండం వివరణ",desc:"సృష్టి నుండి - దేవుని ప్రణాళిక - రోజువారీ మెసేజ్",chapters:[{t:"అధ్యాయం 1 - సృష్టి",c:"ఆది 1:1 - ఆదియందు దేవుడు భూమ్యాకాశములను సృజించెను.\n\nవివరణ: దేవుడే అన్నిటికి మొదలు. మన జీవితం కూడా ఆయన చేతిలోనే మొదలైంది. భయపడవద్దు, ఆయనే నడిపిస్తాడు.\n\nమరనాత ✝️"},{t:"అధ్యాయం 2 - మనిషి",c:"ఆది 2:7 - దేవుడు మనిషిని మట్టితో చేసి - జీవవాయువు ఊదెను.\n\nవివరణ: మనం మామూలు మట్టి కాదు, దేవుని ఊపిరి ఉన్నవాళ్ళం."},{t:"అధ్యాయం 3 - పాపం - రక్షణ",c:"ఆది 3:15 - స్త్రీ సంతానం - సర్పం తల చితకగొడుతుంది.\n\nవివరణ: పాపం వచ్చినా - దేవుడు అప్పుడే రక్షకుని వాగ్దానం ఇచ్చేసాడు. అదే యేసు ప్రభువు."}]},
{id:2,title:"📖 బుక్ 2 - నిర్గమకాండం వివరణ",desc:"ఐగుప్తు నుండి విడుదల - మన జీవిత విడుదల",chapters:[{t:"అధ్యాయం 1 - విడుదల",c:"నిర్గమ 14:14 - యెహోవా మీ పక్షాన యుద్ధం చేస్తాడు, మీరు ఊరకుండండి.\n\nవివరణ: ఎర్ర సముద్రం ముందు - దేవుడే దారి తెరిచాడు."},{t:"అధ్యాయం 2 - మన్నా",c:"నిర్గమ 16:4 - ప్రతి రోజు - పరలోకపు ఆహారం.\n\nవివరణ: దేవుడు రోజు రోజుకి ఇస్తాడు."}]},
{id:3,title:"📖 బుక్ 3 - కీర్తనలు వివరణ",desc:"దావీదు ప్రార్థన - మన ప్రార్థన",chapters:[{t:"అధ్యాయం 1 - కీర్తన 23",c:"కీర్తన 23:1 - యెహోవా నా కాపరి, నాకు లేమి కలుగదు.\n\nవివరణ: కాపరి ఉన్న గొర్రెకి - భయం ఉండదు."},{t:"అధ్యాయం 2 - కీర్తన 121",c:"కీర్తన 121:1 - నా సహాయం యెహోవా వలన వస్తుంది."}]},
{id:4,title:"📖 బుక్ 4 - సువార్త వివరణ",desc:"యేసు జీవితం - బోధలు - అద్భుతాలు",chapters:[{t:"అధ్యాయం 1 - యోహాను 3:16",c:"యోహాను 3:16 - దేవుడు లోకాన్ని ఎంతో ప్రేమించాడు."},{t:"అధ్యాయం 2 - మత్తయి 5",c:"మత్తయి 5:3 - ఆత్మలో దీనులైనవారు ధన్యులు."}]},
{id:5,title:"📖 బుక్ 5 - ప్రకటన వివరణ",desc:"అంత్యకాలం - మరనాత - యేసు రాకడ",chapters:[{t:"అధ్యాయం 1 - ప్రకటన 22:20",c:"ప్రకటన 22:20 - ఆమెన్, ప్రభువైన యేసు త్వరగా వచ్చుచున్నాడు.\n\nవివరణ: ఇదే మన నిరీక్షణ - మరనాత!"},{t:"అధ్యాయం 2 - ప్రకటన 21",c:"ప్రకటన 21:4 - ఇక మరణం ఉండదు, ఏడుపు ఉండదు."}]},
{id:6,title:"📖 బుక్ 6 - రోజువారీ మెసేజ్ లు",desc:"ప్రతి రోజు - ఒక చిన్న వాక్యం - ఒక వివరణ - పాత మెసేజ్ లు కింద కిందకి",chapters:[]}
];
let currentBook=null;
async function loadAll(){
  BOOKS=DEFAULT_BOOKS;
  try{let s=localStorage.getItem('ms_books');if(s){let j=JSON.parse(s);if(j&&j.length) BOOKS=j;}}catch(e){}
  try{let r=await fetch('books.json?v='+Date.now());if(r.ok){let j=await r.json();if(Array.isArray(j)&&j.length) BOOKS=j;}}catch(e){}
  // బుక్ 6 - రోజువారీ మెసేజ్ లు + షెడ్యూల్ టైం వచ్చినవి
  try{
    let posts=[];let r1=await fetch('posts.json?v='+Date.now());if(r1.ok){let j=await r1.json();posts=Array.isArray(j)?j:(j.posts||[]);}
    let now=new Date();
    try{let r2=await fetch('scheduled.json?v='+Date.now());if(r2.ok){let sj=await r2.json();if(Array.isArray(sj)) sj.forEach(p=>{if(p.schedTime && new Date(p.schedTime)<=now) posts.push(p);});}}catch(e){}
    try{let ls=JSON.parse(localStorage.getItem('ms_sched')||'[]');ls.forEach(p=>{if(p.schedTime && new Date(p.schedTime)<=now) posts.push(p);});}catch(e){}
    let b6=BOOKS.find(b=>b.id==6)||BOOKS[BOOKS.length-1];
    if(b6){b6.chapters=posts.map(p=>({t:(p.title||'మెసేజ్')+' - '+(p.date||''),c:(p.content||p.message||''),img:p.image||'',audio:p.audio||''}));}
  }catch(e){}
  renderBooks();
}
function renderBooks(){
  let q=(document.getElementById('search').value||'').toLowerCase();
  let box=document.getElementById('box');document.getElementById('detail').innerHTML='';
  let list=BOOKS.filter(b=>((b.title||'')+(b.desc||'')).toLowerCase().includes(q));
  if(!list.length){box.innerHTML='<p style="text-align:center">📭 బుక్ దొరకలేదు!</p>';return;}
  box.innerHTML=list.map(b=>`<div class="book" onclick="openBook(${b.id})"><h3>${b.title}</h3><p>${b.desc||''}</p><div style="font-size:13px;color:gray">📄 ${(b.chapters||[]).length} పేజీలు - నొక్కి చదవండి ➡️</div></div>`).join('');
}
function openBook(id){
  currentBook=BOOKS.find(b=>b.id==id);if(!currentBook) return;
  document.getElementById('box').innerHTML='';
  let d=document.getElementById('detail');
  d.innerHTML=`<button class="btn" onclick="renderBooks()">⬅ అన్ని బుక్స్ కి వెళ్ళు</button><h3 style="text-align:center;color:#8B0000">${currentBook.title}</h3><p style="text-align:center;color:#555">${currentBook.desc||''}</p>`+(currentBook.chapters||[]).map((ch,i)=>`<div class="chap" onclick="openPage(${i})"><b>${ch.t}</b><div style="font-size:13px;color:#666">పేజీ ${i+1} - చదవండి ➡️</div></div>`).join('')+((currentBook.chapters||[]).length==0?'<p style="text-align:center">📭 ఇంకా పేజీలు లేవు! అడ్మిన్ లో మెసేజ్ పెడితే - ఇక్కడ పేజీ అవుతుంది!</p>':'');
  window.scrollTo(0,0);
}
function openPage(i){
  let ch=currentBook.chapters[i];
  let d=document.getElementById('detail');
  d.innerHTML=`<button class="btn" onclick="openBook(${currentBook.id})">⬅ ${currentBook.title} - అన్ని పేజీలు</button><div class="page"><h3 style="color:#8B0000">${ch.t}</h3>${ch.img?`<img src="${ch.img}">`:''}<div>${(ch.c||'').replace(/\n/g,'<br>')}</div>${ch.audio?`<audio controls src="${ch.audio}" style="width:100%;margin-top:10px"></audio>`:''}<div style="margin-top:15px;display:flex;gap:8px;justify-content:center"><button class="btn2" onclick="openPage(${Math.max(0,i-1)})">⬅ ముందు పేజీ</button><button class="btn2" onclick="openPage(${Math.min(currentBook.chapters.length-1,i+1)})">తర్వాత పేజీ ➡️</button></div><div style="font-size:13px;color:gray;margin-top:8px">పేజీ ${i+1} / ${currentBook.chapters.length}</div></div>`;
  window.scrollTo(0,0);
}
loadAll();
</script></body></html>
