<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BM మహిమ సన్నిధి - బుక్స్</title>
<style>*{box-sizing:border-box}body{font-family:system-ui;background:#E8F5E9;margin:0;padding-bottom:90px} .head{background:#0B3D2E;color:white;padding:28px 18px 20px;text-align:center;border-radius:0 0 28px 28px} .head a{color:white;text-decoration:none;font-weight:bold} .head h2{margin:8px 0 4px;font-size:26px} .head p{margin:0;font-size:13px;opacity:.9} .wrap{padding:12px;max-width:700px;margin:auto} input{width:100%;padding:13px;border-radius:25px;border:1px solid #C8E6C9;font-size:16px;box-sizing:border-box;background:white}
h3{color:#0B3D2E;margin:16px 0 8px}
.scroll{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x mandatory}.scroll::-webkit-scrollbar{display:none}.hcard{min-width:155px;width:155px;background:white;border-radius:20px;padding:12px;box-shadow:0 2px 10px #0001;cursor:pointer;scroll-snap-align:start}.hcard .cover{height:110px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:44px;color:white}.hcard b{display:block;margin-top:8px;font-size:15px;color:#0B3D2E;line-height:1.3}.hcard small{color:#888}
.book{background:white;border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0001;cursor:pointer;display:flex;gap:12px;align-items:center} .book .cover{width:58px;height:76px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:white;flex-shrink:0} .book h3{margin:0;color:#0B3D2E} .book p{color:#555;font-size:14px;margin:4px 0}
.continue{background:#D9EAD3;border:2px solid #2E7D32;padding:16px;border-radius:20px;margin:14px 0;cursor:pointer} .continue b{font-size:19px;color:#0B3D2E} .bar{height:8px;background:#C8E6C9;border-radius:10px;margin-top:10px;overflow:hidden} .bar i{display:block;height:100%;background:#2E7D32}
.chap{background:#FFF8E1;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;border-left:4px solid #FF9800} .page{background:#FFFDE7;border:1px solid #FFE0B2;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 2px 8px #0001;line-height:1.9;white-space:pre-line;text-align:center} .page img{width:100%;border-radius:12px;margin:10px 0} .btn{background:#0B3D2E;color:white;border:none;padding:14px 18px;border-radius:25px;font-weight:bold;width:100%;margin:6px 0;cursor:pointer} .btn2{background:#2E7D32;color:white;border:none;padding:10px 16px;border-radius:20px;font-weight:bold;cursor:pointer;margin:4px} .btnOrange{background:#FF9800}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0 14px;box-shadow:0 -2px 10px #0001}.bottom div{text-align:center;font-size:12px;color:#888;cursor:pointer}.bottom div.active{color:#0B3D2E;font-weight:bold}
</style></head>
<body>
<div class="head"><a href="index.html">⬅ హోమ్</a><h2>📖 BM మహిమ సన్నిధి</h2><div>సన్నిధి వర్తమానములు - సన్నిధి సహవాసం</div></div>
<div class="wrap">
<input id="search" placeholder="🔍 బుక్ / అధ్యాయం వెతకండి..." oninput="renderBooks()">
<div id="box">లోడ్ అవుతోంది...</div>
<div id="detail"></div>
</div>
<div class="bottom"><div onclick="location.href='index.html'">🏠<br>హోమ్</div><div class="active">📚<br>పుస్తకాలు</div><div onclick="location.href='index.html'">📝<br>గమనికలు</div><div onclick="location.href='admin.html'">⚙️<br>సెట్టింగ్</div></div>
<script>
let BOOKS=[];
let DEFAULT_BOOKS=[
{id:1,title:"📖 బుక్ 1 - ఆదికాండం వివరణ",desc:"సృష్టి నుండి - దేవుని ప్రణాళిక - రోజువారీ మెసేజ్",chapters:[{t:"అధ్యాయం 1 - సృష్టి",c:"ఆది 1:1 - ఆదియందు దేవుడు భూమ్యాకాశములను సృజించెను.\n\nవివరణ: దేవుడే అన్నిటికి మొదలు. మన జీవితం కూడా ఆయన చేతిలోనే మొదలైంది. భయపడవద్దు, ఆయనే నడిపిస్తాడు.\n\nమరనాత ✝️"},{t:"అధ్యాయం 2 - మనిషి",c:"ఆది 2:7 - దేవుడు మనిషిని మట్టితో చేసి - జీవవాయువు ఊదెను.\n\nవివరణ: మనం మామూలు మట్టి కాదు, దేవుని ఊపిరి ఉన్నవాళ్ళం."},{t:"అధ్యాయం 3 - పాపం - రక్షణ",c:"ఆది 3:15 - స్త్రీ సంతానం - సర్పం తల చితకగొడుతుంది.\n\nవివరణ: పాపం వచ్చినా - దేవుడు అప్పుడే రక్షకుని వాగ్దానం ఇచ్చేసాడు. అదే యేసు ప్రభువు."}]},
{id:2,title:"📖 బుక్ 2 - నిర్గమకాండం వివరణ",desc:"ఐగుప్తు నుండి విడుదల - మన జీవిత విడుదల",chapters:[{t:"అధ్యాయం 1 - విడుదల",c:"నిర్గమ 14:14 - యెహోవా మీ పక్షాన యుద్ధం చేస్తాడు, మీరు ఊరకుండండి.\n\nవివరణ: ఎర్ర సముద్రం ముందు - దేవుడే దారి తెరిచాడు."},{t:"అధ్యాయం 2 - మన్నా",c:"నిర్గమ 16:4 - ప్రతి రోజు - పరలోకపు ఆహారం.\n\nవివరణ: దేవుడు రోజు రోజుకి ఇస్తాడు."}]},
{id:3,title:"📖 బుక్ 3 - కీర్తనలు వివరణ",desc:"దావీదు ప్రార్థన - మన ప్రార్థన",chapters:[{t:"అధ్యాయం 1 - కీర్తన 23",c:"కీర్తన 23:1 - యెహోవా నా కాపరి, నాకు లేమి కలుగదు.\n\nవివరణ: కాపరి ఉన్న గొర్రెకి - భయం ఉండదు."},{t:"అధ్యాయం 2 - కీర్తన 121",c:"కీర్తన 121:1 - నా సహాయం యెహోవా వలన వస్తుంది."}]},
{id:4,title:"📖 బుక్ 4 - సువార్త వివరణ",desc:"యేసు జీవితం - బోధలు - అద్భుతాలు",chapters:[{t:"అధ్యాయం 1 - యోహాను 3:16",c:"యోహాను 3:16 - దేవుడు లోకాన్ని ఎంతో ప్రేమించాడు."},{t:"అధ్యాయం 2 - మత్తయి 5",c:"మత్తయి 5:3 - ఆత్మలో దీనులైనవారు ధన్యులు."}]},
{id:5,title:"📖 బుక్ 5 - ప్రకటన వివరణ",desc:"అంత్యకాలం - మరనాత - యేసు రాకడ",chapters:[{t:"అధ్యాయం 1 - ప్రకటన 22:20",c:"ప్రకటన 22:20 - ఆమెన్, ప్రభువైన యేసు త్వరగా వచ్చుచున్నాడు.\n\nవివరణ: ఇదే మన నిరీక్షణ - మరనాత!"},{t:"అధ్యాయం 2 - ప్రకటన 21",c:"ప్రకటన 21:4 - ఇక మరణం ఉండదు, ఏడుపు ఉండదు."}]},
{id:6,title:"📖 బుక్ 6 - రోజువారీ మెసేజ్ లు",desc:"ప్రతి రోజు - ఒక చిన్న వాక్యం - ఒక వివరణ - పాత మెసేజ్ లు కింద కిందకి",chapters:[]}
];
let currentBook=null; let currentIdx=0;
let lastRead={idx:0,page:0};
try{let lr=localStorage.getItem('ms_last_read_books');if(lr){let j=JSON.parse(lr); if(j.idx!=null) lastRead=j; else if(j.id!=null) lastRead={idx:0,page:j.page||0};}}catch(e){}
async function loadAll(){
  BOOKS=JSON.parse(JSON.stringify(DEFAULT_BOOKS));
  try{let s=localStorage.getItem('ms_books');if(s){let j=JSON.parse(s);if(j&&j.length) BOOKS=j;}}catch(e){}
  try{let r=await fetch('books.json?v='+Date.now());if(r.ok){let j=await r.json();if(Array.isArray(j)&&j.length) BOOKS=j;}}catch(e){}
  // FIX 1: id లేని కొత్త బుక్ కి id ఇవ్వడం
  BOOKS=BOOKS.map((b,i)=>{ if(b.id==null) b.id=1000+i; return b; });
  try{
    let posts=[];let r1=await fetch('posts.json?v='+Date.now());if(r1.ok){let j=await r1.json();posts=Array.isArray(j)?j:(j.posts||[]);}
    let now=new Date();
    try{let r2=await fetch('scheduled.json?v='+Date.now());if(r2.ok){let sj=await r2.json();if(Array.isArray(sj)) sj.forEach(p=>{if(p.schedTime && new Date(p.schedTime)<=now) posts.push(p);});}}catch(e){}
    try{let ls=JSON.parse(localStorage.getItem('ms_sched')||'[]');ls.forEach(p=>{if(p.schedTime && new Date(p.schedTime)<=now) posts.push(p);});}catch(e){}
    // FIX 2: రోజువారీ బుక్ ని టైటిల్ తో వెతకడం - చివరి బుక్ ని పాడు చేయకుండా
    let b6=BOOKS.find(b=>(b.title||'').includes('రోజువారీ'))||BOOKS.find(b=>b.id==6);
    if(b6 && posts.length){b6.chapters=posts.map(p=>({t:(p.title||'మెసేజ్')+' - '+(p.date||''),c:(p.content||p.message||''),img:p.image||'',audio:p.audio||''}));}
  }catch(e){}
  BOOKS=BOOKS.map(b=>{ if(!b.chapters||!b.chapters.length){ if(Array.isArray(b.pages)&&b.pages.length) b.chapters=b.pages.map(p=>({t:p.title||p.t||'',c:p.content||p.c||'',img:p.img||p.image||'',audio:p.audio||''})); } if(!b.chapters) b.chapters=[]; return b; });
  renderBooks();
}
function getChapters(b){return b.chapters||b.pages||[];}
function renderBooks(){
  let q=(document.getElementById('search').value||'').toLowerCase();
  let box=document.getElementById('box');document.getElementById('detail').innerHTML='';
  let list=BOOKS.filter(b=>((b.title||'')+(b.desc||'')+getChapters(b).map(c=>c.t||'').join(' ')).toLowerCase().includes(q));
  if(!list.length){box.innerHTML='<p style="text-align:center">📭 బుక్ దొరకలేదు!</p>';return;}
  let colors=['#FF9800','#2E7D32','#1976D2','#8E24AA','#E91E63','#009688'];
  let h='<div style="display:flex;justify-content:space-between;align-items:center"><h3>📚 పుస్తకాలు</h3><span style="color:#2E7D32;font-weight:bold">అన్నీ చూడండి ›</span></div><div class="scroll">';
  list.forEach((b)=>{let ci=BOOKS.indexOf(b);h+=`<div class="hcard" onclick="openBookByIndex(${ci})"><div class="cover" style="background:${colors[ci%6]}">📖</div><b>${b.title}</b><small>📄 ${getChapters(b).length} పేజీలు</small><br><small style="color:#2E7D32;font-weight:bold">▶ చదవడం కొనసాగించు</small></div>`;});
  h+='</div><h3>📖 అన్ని పుస్తకాలు - లిస్ట్</h3>';
  h+=list.map(b=>{let ci=BOOKS.indexOf(b);return `<div class="book" onclick="openBookByIndex(${ci})"><div class="cover" style="background:${colors[ci%6]}">📖</div><div><h3>${b.title}</h3><p>${b.desc||''}</p><div style="font-size:13px;color:gray">📄 ${getChapters(b).length} పేజీలు - నొక్కి చదవండి ➡️</div></div></div>`;}).join('');
  let cb=BOOKS[lastRead.idx]||BOOKS[0];
  if(cb){let ch=getChapters(cb);let pct=ch.length?Math.round(((lastRead.page+1)/ch.length)*100):0;let t=ch[lastRead.page]?ch[lastRead.page].t:'అధ్యాయం 1';let cbi=BOOKS.indexOf(cb);h+=`<h3>📖 చదువుతున్నది</h3><div class="continue" onclick="openBookByIndex(${cbi})"><b>📖 ${cb.title}</b><br><small>చదువుతున్నది • ${t} • ${lastRead.page+1} / ${ch.length}</small><div class="bar"><i style="width:${pct}%"></i></div><small>${pct}% పూర్తయింది</small></div>`;}
  box.innerHTML=h;
}
function openBookByIndex(idx){
  currentIdx=idx; currentBook=BOOKS[idx]; if(!currentBook) return;
  document.getElementById('box').innerHTML='';
  let d=document.getElementById('detail');
  d.innerHTML=`<button class="btn" onclick="renderBooks()">⬅ అన్ని బుక్స్ కి వెళ్ళు</button><h3 style="text-align:center;color:#0B3D2E">${currentBook.title}</h3><p style="text-align:center;color:#555">${currentBook.desc||''}</p>`+(getChapters(currentBook)).map((ch,i)=>`<div class="chap" onclick="openPage(${i})"><b>${ch.t}</b><div style="font-size:13px;color:#666">పేజీ ${i+1} - చదవండి ➡️</div></div>`).join('')+((getChapters(currentBook)).length==0?'<p style="text-align:center">📭 ఇంకా పేజీలు లేవు! అడ్మిన్ లో మెసేజ్ పెడితే - ఇక్కడ పేజీ అవుతుంది!</p>':'');
  window.scrollTo(0,0);
}
function openBook(id){ let idx=BOOKS.findIndex(b=>b.id==id); if(idx>=0) openBookByIndex(idx); else if(typeof id==='number') openBookByIndex(id); }
function openPage(i){
  let ch=getChapters(currentBook)[i]; if(!ch) return;
  lastRead={idx:currentIdx,page:i};localStorage.setItem('ms_last_read_books',JSON.stringify(lastRead));
  let d=document.getElementById('detail');
  d.innerHTML=`<button class="btn" onclick="openBookByIndex(${currentIdx})">⬅ ${currentBook.title} - అన్ని పేజీలు</button><div class="page"><h3 style="color:#0B3D2E">${ch.t}</h3>${ch.img?`<img src="${ch.img}">`:''}<div>${(ch.c||'').replace(/\n/g,'<br>')}</div>${ch.audio?`<audio controls src="${ch.audio}" style="width:100%;margin-top:10px"></audio>`:''}<div style="margin-top:15px;display:flex;gap:8px;justify-content:center"><button class="btn2" onclick="openPage(${Math.max(0,i-1)})">⬅ ముందు పేజీ</button><button class="btn2 btnOrange" onclick="openPage(${Math.min(getChapters(currentBook).length-1,i+1)})">తర్వాత పేజీ ➡️</button></div><div style="font-size:13px;color:gray;margin-top:8px">పేజీ ${i+1} / ${getChapters(currentBook).length}</div></div>`;
  window.scrollTo(0,0);
}
loadAll();
</script></body></html>
