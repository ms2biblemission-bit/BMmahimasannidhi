function shareAnyPage(){

  let text = "🙏 BM మహిమ సన్నిధి - బుక్స్ 📚\nపుస్తకాలు చదవండి - రోజూ వాక్యం, పాటలు, క్విజ్ 👇\n" + pageLink + "\n\n📲 యాప్ డౌన్లోడ్ చేసుకోండి 👇\n" + appLink + "\n\nమరనాత ✝️";
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault(); deferredPrompt = e;
  let h=document.getElementById('installHint'); if(h) h.textContent="✅ యాప్ రెడీ! డౌన్లోడ్ బటన్ నొక్కండి";
});
function installAppUniversal(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((r)=>{ if(r.outcome==='accepted'){ alert("🙏 దేవునికి స్తోత్రం! యాప్ ఇన్‌స్టాల్ అయింది"); } deferredPrompt=null; });
  } else {
    alert("📲 యాప్ డౌన్లోడ్ చేయడానికి:\n\nAndroid: పైన ⋮ > Add to Home Screen > Install\n\niPhone: Share > Add to Home Screen");
  }
}
document.querySelectorAll('a[href]').forEach(a=>{
  let h = a.getAttribute('href');
  if(!h) return;
  if(h.endsWith('.html') && !h.startsWith('http')){
    a.addEventListener('click', function(e){
      e.preventDefault();
      location.replace(h);
    });
  }
});
window.addEventListener('popstate', function(){ location.replace('index.html'); });

// --- Books Save / Underline ---
function getSavedBooks(){ try{ return JSON.parse(localStorage.getItem('ms_saved_books')||'[]'); }catch(e){ return []; } }
function toggleSaveBook(title, btn){
  let saved = getSavedBooks();
  let i = saved.indexOf(title);
  if(i>=0){ saved.splice(i,1); btn.textContent='🔖 Save / సేవ్'; btn.classList.remove('saved'); }
  else { saved.push(title); btn.textContent='✅ Saved / సేవ్ అయ్యింది'; btn.classList.add('saved'); }
  localStorage.setItem('ms_saved_books', JSON.stringify(saved));
}
function toggleUnderlinePage(btn){
  let el = document.getElementById('pageBox');
  if(el){ el.classList.toggle('underlined'); btn.textContent = el.classList.contains('underlined') ? '✅ Underline అయ్యింది' : '✏️ Underline / అండర్ లైన్'; }
}
let BOOKS=[];
let DEFAULT_BOOKS=[
{id:1,title:"📖 బుక్ 1 - ఆదికాండం వివరణ",desc:"సృష్టి నుండి - దేవుని ప్రణాళిక - రోజువారీ మెసేజ్",chapters:[{t:"అధ్యాయం 1 - సృష్టి",c:"ఆది 1:1 - ఆదియందు దేవుడు భూమ్యాకాశములను సృజించెను.\n\nవివరణ: దేవుడే అన్నిటికి మొదలు. మన జీవితం కూడా ఆయన చేతిలోనే మొదలైంది. భయపడవద్దు, ఆయనే నడిపిస్తాడు.\n\nమరనాత ✝️"},{t:"అధ్యాయం 2 - మనిషి",c:"ఆది 2:7 - దేవుడు మనిషిని మట్టితో చేసి - జీవవాయువు ఊదెను.\n\nవివరణ: మనం మామూలు మట్టి కాదు, దేవుని ఊపిరి ఉన్నవాళ్ళం."},{t:"అధ్యాయం 3 - పాపం - రక్షణ",c:"ఆది 3:15 - స్త్రీ సంతానం - సర్పం తల చితకగొడుతుంది.\n\nవివరణ: పాపం వచ్చినా - దేవుడు అప్పుడే రక్షకుని వాగ్దానం ఇచ్చేసాడు. అదే యేసు ప్రభువు."}]},
{id:2,title:"📖 బుక్ 2 - నిర్గమకాండం వివరణ",desc:"ఐగుప్తు నుండి విడుదల - మన జీవిత విడుదల",chapters:[{t:"అధ్యాయం 1 - విడుదల",c:"నిర్గమ 14:14 - యెహోవా మీ పక్షాన యుద్ధం చేస్తాడు, మీరు ఊరకుండండి.\n\nవివరణ: ఎర్ర సముద్రం ముందు - దేవుడే దారి తెరిచాడు."},{t:"అధ్యాయం 2 - మన్నా",c:"నిర్గమ 16:4 - ప్రతి రోజు - పరలోకపు ఆహారం.\n\nవివరణ: దేవుడు రోజు రోజుకి ఇస్తాడు."}]},
{id:3,title:"📖 బుక్ 3 - కీర్తనలు వివరణ",desc:"దావీదు ప్రార్థన - మన ప్రార్థన",chapters:[{t:"అధ్యాయం 1 - కీర్తన 23",c:"కీర్తన 23:1 - యెహోవా నా కాపరి, నాకు లేమి కలుగదు.\n\nవివరణ: కాపరి ఉన్న గొర్రెకి - భయం ఉండదు."},{t:"అధ్యాయం 2 - కీర్తన 121",c:"కీర్తన 121:1 - నా సహాయం యెహోవా వలన వస్తుంది."}]},
{id:4,title:"📖 బుక్ 4 - సువార్త వివరణ",desc:"యేసు జీవితం - బోధలు - అద్భుతాలు",chapters:[{t:"అధ్యాయం 1 - యోహాను 3:16",c:"యోహాను 3:16 - దేవుడు లోకాన్ని ఎంతో ప్రేమించాడు."},{t:"అధ్యాయం 2 - మత్తయి 5",c:"మత్తయి 5:3 - ఆత్మలో దీనులైనవారు ధన్యులు."}]},
{id:5,title:"📖 బుక్ 5 - ప్రకటన వివరణ",desc:"అంత్యకాలం - మరనాత - యేసు రాకడ",chapters:[{t:"అధ్యాయం 1 - ప్రకటన 22:20",c:"ప్రకటన 22:20 - ఆమెన్, ప్రభువైన యేసు త్వరగా వచ్చుచున్నాడు.\n\nవివరణ: ఇదే మన నిరీక్షణ - మరనాత!"},{t:"అధ్యాయం 2 - ప్రకటన 21",c:"ప్రకటన 21:4 - ఇక మరణం ఉండదు, ఏడుపు ఉండదు."}]},
{id:6,title:"📖 బుక్ 6 - రోజువారీ మెసేజ్ లు",desc:"ప్రతి రోజు - ఒక చిన్న వాక్యం - ఒక వివరణ - పాత మెసేజ్ లు కింద కిందకి",chapters:[]}
];
let currentBook=null; let currentIdx=0;
let lastRead={idx:0,page:0};
try{let lr=localStorage.getItem('ms_last_read_books');if(lr){let j=JSON.parse(lr); if(j.idx!=null) lastRead=j; else if(j.id!=null) lastRead={idx:0,page:j.page||0};}}catch(e){}
function getBookNum(s){
  s=(s||'').toString();
  let m=s.match(/(\d+)/);
  if(m) return parseInt(m[1]);
  return 9999;
}
function teluguCompare(a,b){
  let na=getBookNum(a), nb=getBookNum(b);
  if(na!==nb) return na-nb;
  if(a<b) return -1;
  if(a>b) return 1;
  return 0;
}
async function loadAll(){
  BOOKS=JSON.parse(JSON.stringify(DEFAULT_BOOKS));
  try{let s=localStorage.getItem('ms_books');if(s){let j=JSON.parse(s);if(j&&j.length) BOOKS=j;}}catch(e){}
  try{let r=await fetch('books.json?v='+Date.now());if(r.ok){let j=await r.json();if(Array.isArray(j)&&j.length) BOOKS=j;}}catch(e){}
  BOOKS=BOOKS.map((b,i)=>{ if(b.id==null) b.id=1000+i; return b; });
  try{
    let posts=[];let r1=await fetch('posts.json?v='+Date.now());if(r1.ok){let j=await r1.json();posts=Array.isArray(j)?j:(j.posts||[]);}
    let now=new Date();
    try{let r2=await fetch('scheduled.json?v='+Date.now());if(r2.ok){let sj=await r2.json();if(Array.isArray(sj)) sj.forEach(p=>{if(p.schedTime && new Date(p.schedTime)<=now) posts.push(p);});}}catch(e){}
    try{let ls=JSON.parse(localStorage.getItem('ms_sched')||'[]');ls.forEach(p=>{if(p.schedTime && new Date(p.schedTime)<=now) posts.push(p);});}catch(e){}
    let b6=BOOKS.find(b=>(b.title||'').includes('రోజువారీ'))||BOOKS.find(b=>b.id==6);
    if(b6 && posts.length){b6.chapters=posts.map(p=>({t:(p.title||'మెసేజ్')+' - '+(p.date||''),c:(p.content||p.message||''),img:p.image||'',audio:p.audio||''}));}
  }catch(e){}
  BOOKS=BOOKS.map(b=>{ if(!b.chapters||!b.chapters.length){ if(Array.isArray(b.pages)&&b.pages.length) b.chapters=b.pages.map(p=>({t:p.title||p.t||'',c:p.content||p.c||'',img:p.img||p.image||'',audio:p.audio||''})); } if(!b.chapters) b.chapters=[]; return b; });
  renderBooks();
}
function getChapters(b){return b.chapters||b.pages||[];}
function renderBooks(){
  let q=(document.getElementById('search').value||'').toLowerCase();
  let box=document.getElementById('box');document.getElementById('detail').innerHTML='';
  let list=BOOKS.filter(b=>((b.title||'')+(b.desc||'')+getChapters(b).map(c=>c.t||'').join(' ')).toLowerCase().includes(q));
  list.sort((a,b)=>teluguCompare(a.title||'', b.title||''));
  if(!list.length){box.innerHTML='<p style="text-align:center">📭 బుక్ దొరకలేదు!</p>';return;}
  let colors=['#FF9800','#2E7D32','#1976D2','#8E24AA','#E91E63','#009688'];
  let h='<div style="display:flex;justify-content:space-between;align-items:center"><h3>📚 పుస్తకాలు</h3><span style="color:#2E7D32;font-weight:bold">🔤 1 2 3 → A-Z → అ-ఱ</span></div><div class="scroll">';
  list.forEach((b)=>{let ci=BOOKS.indexOf(b);h+=`<div class="hcard" onclick="openBookByIndex(${ci})"><div class="cover" style="background:${colors[ci%6]}">📖</div><b>${b.title}</b><small>📄 ${getChapters(b).length} పేజీలు</small><br><small style="color:#2E7D32;font-weight:bold">▶ చదవడం కొనసాగించు</small></div>`;});
  h+='</div><h3>📖 అన్ని పుస్తకాలు - లిస్ట్</h3>';
  let saved = getSavedBooks();
  h+=list.map(b=>{let ci=BOOKS.indexOf(b);let isSaved=saved.includes(b.title);return `<div class="book" onclick="openBookByIndex(${ci})"><div class="cover" style="background:${colors[ci%6]}">📖</div><div style="flex:1"><h3>${b.title} ${isSaved?'✅':''}</h3><p>${b.desc||''}</p><div style="font-size:13px;color:gray">📄 ${getChapters(b).length} పేజీలు - నొక్కి చదవండి ➡️</div><div class="book-actions" onclick="event.stopPropagation()"><button class="btn-save ${isSaved?'saved':''}" onclick="toggleSaveBook('${(b.title||'').replace(/'/g,"\\'")}',this)">${isSaved?'✅ Saved':'🔖 Save / సేవ్'}</button></div></div></div>`;}).join('');
  let cb=BOOKS[lastRead.idx]||BOOKS[0];
  if(cb){let ch=getChapters(cb);let pct=ch.length?Math.round(((lastRead.page+1)/ch.length)*100):0;let t=ch[lastRead.page]?ch[lastRead.page].t:'అధ్యాయం 1';let cbi=BOOKS.indexOf(cb);h+=`<h3>📖 చదువుతున్నది</h3><div class="continue" onclick="openBookByIndex(${cbi})"><b>📖 ${cb.title}</b><br><small>చదువుతున్నది • ${t} • ${lastRead.page+1} / ${ch.length}</small><div class="bar"><i style="width:${pct}%"></i></div><small>${pct}% పూర్తయింది</small></div>`;}
  box.innerHTML=h;
}
function openBookByIndex(idx){
  currentIdx=idx; currentBook=BOOKS[idx]; if(!currentBook) return;
  document.getElementById('box').innerHTML='';
  let saved = getSavedBooks(); let isSaved = saved.includes(currentBook.title);
  let d=document.getElementById('detail');
  d.innerHTML=`<button class="btn" onclick="renderBooks()">⬅ అన్ని బుక్స్ కి వెళ్ళు</button><h3 style="text-align:center;color:#0F2F6B;font-weight:700;font-size:22px">✝️ ${currentBook.title}</h3><p style="text-align:center;color:#3B2314;font-weight:500">${currentBook.desc||''}</p><div class="book-actions"><button class="btn-save ${isSaved?'saved':''}" onclick="toggleSaveBook('${(currentBook.title||'').replace(/'/g,"\\'")}',this)">${isSaved?'✅ Saved / సేవ్ అయ్యింది':'🔖 Save / సేవ్'}</button></div>`+(getChapters(currentBook)).map((ch,i)=>`<div class="chap" onclick="openPage(${i})"><b>${ch.t}</b><div style="font-size:13px;color:#666">పేజీ ${i+1} - చదవండి ➡️</div></div>`).join('')+((getChapters(currentBook)).length==0?'<p style="text-align:center">📭 ఇంకా పేజీలు లేవు! అడ్మిన్ లో మెసేజ్ పెడితే - ఇక్కడ పేజీ అవుతుంది!</p>':'');
  window.scrollTo(0,0);
}
function openBook(id){ let idx=BOOKS.findIndex(b=>b.id==id); if(idx>=0) openBookByIndex(idx); else if(typeof id==='number') openBookByIndex(id); }
function openPage(i){
  let ch=getChapters(currentBook)[i]; if(!ch) return;
  lastRead={idx:currentIdx,page:i};localStorage.setItem('ms_last_read_books',JSON.stringify(lastRead));
  let total = getChapters(currentBook).length;
  let saved = getSavedBooks(); let isSaved = saved.includes(currentBook.title);
  document.getElementById('bookModalContent').innerHTML=`<div style="text-align:center"><div style="font-size:28px">✝️</div><div style="font-size:14px;color:gray">📖 ${currentBook.title}</div><div class="page" id="pageBox" style="margin:12px 0"><h3>${ch.t}</h3>${ch.img?`<img src="${ch.img}">`:''}<div>${(ch.c||'').replace(/\n/g,'<br>')}</div>${ch.audio?`<audio controls src="${ch.audio}" style="width:100%;margin-top:10px"></audio>`:''}<div style="font-size:12px;color:#888;margin-top:10px">👈 👉 పక్కకి లాగితే పేజీ మారుతుంది</div><div style="margin-top:15px;display:flex;gap:8px;justify-content:center"><button class="btn2" onclick="openPage(${Math.max(0,i-1)})">⬅ ముందు పేజీ</button><button class="btn2 btnOrange" onclick="openPage(${Math.min(total-1,i+1)})">తర్వాత పేజీ ➡️</button></div><div style="font-size:13px;color:gray;margin-top:8px">పేజీ ${i+1} / ${total}</div></div><div class="book-actions"><button class="btn-save ${isSaved?'saved':''}" onclick="toggleSaveBook('${(currentBook.title||'').replace(/'/g,"\\'")}',this)">${isSaved?'✅ Saved':'🔖 Save / సేవ్'}</button><button class="btn-underline" onclick="toggleUnderlinePage(this)">✏️ Underline / అండర్ లైన్</button></div></div>`;
  document.getElementById('bookModal').style.display='flex';
  let sc=document.getElementById('bookScroll'); if(sc) sc.scrollTop=0;
}
function closeBookPage(){ document.getElementById('bookModal').style.display='none'; }
document.getElementById('bookModal').addEventListener('click',e=>{ if(e.target.id==='bookModal') closeBookPage(); });
let bookTouchX=0, bookTouchY=0;
let bookScrollEl=document.getElementById('bookScroll');
if(bookScrollEl){
  bookScrollEl.addEventListener('touchstart', function(e){ bookTouchX=e.touches[0].clientX; bookTouchY=e.touches[0].clientY; }, {passive:true});
  bookScrollEl.addEventListener('touchend', function(e){
    let endX=e.changedTouches[0].clientX; let endY=e.changedTouches[0].clientY;
    let diffX=endX-bookTouchX; let diffY=endY-bookTouchY;
    if(Math.abs(diffX)<60) return;
    if(Math.abs(diffY)>Math.abs(diffX)) return;
    let cur=lastRead.page;
    if(diffX<0) openPage(Math.min(getChapters(currentBook).length-1, cur+1));
    else openPage(Math.max(0, cur-1));
  }, {passive:true});
}
loadAll();
</script></body></html>
