<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>📖 Bible - Telugu + English | BM మహిమ సన్నిధి</title><meta name="theme-color" content="#0B3D2E">
<style>*{box-sizing:border-box}body{font-family:sans-serif;background:#E8F5E9;margin:0;padding-bottom:90px} .top{position:sticky;top:0;background:#0B3D2E;color:#fff;padding:12px;text-align:center;z-index:10} .top b{font-size:18px} .top small{display:block;font-size:12px;opacity:.9}
.books{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px} .book{background:#fff;border-radius:14px;padding:12px;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);border:1px solid #DCEEDB} .book b{font-size:14px;color:#0B3D2E;display:block} .book small{color:#888;font-size:11px}
.chaps{display:flex;flex-wrap:wrap;gap:8px;padding:10px} .chaps button{width:52px;height:52px;border-radius:12px;border:1px solid #C8A96A;background:#FFF8E1;font-weight:bold;font-size:17px;cursor:pointer;touch-action:manipulation}
.nav{display:flex;gap:8px;padding:10px} .nav button{flex:1;padding:12px;border:none;border-radius:12px;font-weight:bold;cursor:pointer} .prev{background:#eee} .next{background:#0B3D2E;color:#fff}
.curbar{background:#FFF8E1;border:2px solid #FFD54F;border-radius:14px;padding:10px;margin:10px;text-align:center;font-weight:bold;color:#0B3D2E} .curbar button{background:#0B3D2E;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;margin-left:8px;cursor:pointer}
.verse{background:#FFFEF8;margin:10px;border-radius:14px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.08)} .verse .ref{color:#0F2F6B;font-weight:bold;font-size:15px} .verse .en{font-size:19px;line-height:1.7;color:#3B2314;font-weight:500;margin-top:8px} .verse .shr{text-align:right;margin-top:8px} .verse .shr button{background:#25D366;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.search{width:calc(100% - 20px);margin:0 10px;padding:12px;border-radius:10px;border:1px solid #C8E6C9;font-size:16px}
.bottom{position:fixed;left:12px;right:12px;bottom:10px;background:#fff;border-radius:24px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:flex;justify-content:space-around;padding:10px 4px} .bottom a{text-decoration:none;color:#555;font-size:11px;text-align:center;flex:1} .bottom .ic{font-size:22px;display:block}
.backbtn{background:#fff;border:2px solid #0B3D2E;color:#0B3D2E;padding:10px;border-radius:12px;font-weight:bold;width:calc(100% - 20px);margin:10px;cursor:pointer}
.retrybtn{background:#0B3D2E;color:#fff;border:none;padding:12px 20px;border-radius:20px;font-weight:bold;cursor:pointer;margin-top:8px}
.langbtn{border:none;padding:9px 18px;border-radius:20px;font-weight:bold;cursor:pointer;margin:4px}
</style></head><body>
<div class="top"><b>📖 Bible - తెలుగు + English</b><small>BM Mahima Sannidhi 🙏</small><small id="verInfo" style="font-size:11px;opacity:.8">తెలుగు + English</small><div><button class="langbtn" id="btnTe" onclick="setLang('te')" style="background:#FFD54F;color:#000">తెలుగు</button><button class="langbtn" id="btnEn" onclick="setLang('en')" style="background:#fff;color:#000">English</button></div></div>
<input class="search" id="bSearch" placeholder="🔍 Search Book... Genesis / ఆదికాండం" oninput="renderBooks()">
<div id="bookList"></div>
<div id="chapList" style="display:none"></div>
<div id="curBar" style="display:none"></div>
<div id="verseList"></div>
<div id="loadMsg" style="text-align:center;padding:12px;color:#666"></div>
<div class="bottom"><a href="index.html"><span class="ic">🏠</span>Home</a><a href="bible.html"><span class="ic">📖</span>Bible</a><a href="prayer.html"><span class="ic">🙏</span>Prayer</a><a href="videos.html"><span class="ic">▶️</span>Media</a></div>
<script>
const BOOKS=[
["ఆదికాండం","Genesis",50,"GEN","genesis","gn"],["నిర్గమకాండం","Exodus",40,"EXO","exodus","ex"],["లేవీయకాండం","Leviticus",27,"LEV","leviticus","lv"],["సంఖ్యాకాండం","Numbers",36,"NUM","numbers","nm"],["ద్వితీయోపదేశకాండం","Deuteronomy",34,"DEU","deuteronomy","dt"],
["యెహోషువ","Joshua",24,"JOS","joshua","js"],["న్యాయాధిపతులు","Judges",21,"JDG","judges","jg"],["రూతు","Ruth",4,"RUT","ruth","rt"],["1 సమూయేలు","1 Samuel",31,"1SA","1-samuel","1sm"],["2 సమూయేలు","2 Samuel",24,"2SA","2-samuel","2sm"],
["1 రాజులు","1 Kings",22,"1KI","1-kings","1kgs"],["2 రాజులు","2 Kings",25,"2KI","2-kings","2kgs"],["1 దినవృత్తాంతాలు","1 Chronicles",29,"1CH","1-chronicles","1ch"],["2 దినవృత్తాంతాలు","2 Chronicles",36,"2CH","2-chronicles","2ch"],["ఎజ్రా","Ezra",10,"EZR","ezra","ezr"],
["నెహెమ్యా","Nehemiah",13,"NEH","nehemiah","ne"],["ఎస్తేరు","Esther",10,"EST","esther","et"],["యోబు","Job",42,"JOB","job","jb"],["కీర్తనలు","Psalms",150,"PSA","psalms","ps"],["సామెతలు","Proverbs",31,"PRO","proverbs","pr"],
["ప్రసంగి","Ecclesiastes",12,"ECC","ecclesiastes","ec"],["పరమగీతం","Song of Solomon",8,"SNG","song-of-solomon","ss"],["యెషయా","Isaiah",66,"ISA","isaiah","is"],["యిర్మీయా","Jeremiah",52,"JER","jeremiah","jr"],["విలాపవాక్యాలు","Lamentations",5,"LAM","lamentations","lm"],
["యెహెజ్కేలు","Ezekiel",48,"EZK","ezekiel","ez"],["దానియేలు","Daniel",12,"DAN","daniel","dn"],["హోషేయ","Hosea",14,"HOS","hosea","ho"],["యోవేలు","Joel",3,"JOL","joel","jl"],["ఆమోసు","Amos",9,"AMO","amos","am"],
["ఓబద్యా","Obadiah",1,"OBA","obadiah","ob"],["యోనా","Jonah",4,"JON","jonah","jn"],["మీకా","Micah",7,"MIC","micah","mi"],["నహూము","Nahum",3,"NAM","nahum","na"],["హబక్కూకు","Habakkuk",3,"HAB","habakkuk","hk"],
["జెఫన్యా","Zephaniah",3,"ZEP","zephaniah","zp"],["హగ్గయి","Haggai",2,"HAG","haggai","hg"],["జెకర్యా","Zechariah",14,"ZEC","zechariah","zc"],["మలాకీ","Malachi",4,"MAL","malachi","ml"],
["మత్తయి","Matthew",28,"MAT","matthew","mt"],["మార్కు","Mark",16,"MRK","mark","mk"],["లూకా","Luke",24,"LUK","luke","lk"],["యోహాను","John",21,"JHN","john","jn2"],["అపొస్తలుల కార్యాలు","Acts",28,"ACT","acts","ac"],
["రోమా","Romans",16,"ROM","romans","rm"],["1 కొరింథీ","1 Corinthians",16,"1CO","1-corinthians","1co"],["2 కొరింథీ","2 Corinthians",13,"2CO","2-corinthians","2co"],["గలతీ","Galatians",6,"GAL","galatians","gl"],["ఎఫెసీ","Ephesians",6,"EPH","ephesians","eph"],
["ఫిలిప్పీ","Philippians",4,"PHP","philippians","ph"],["కొలొస్సీ","Colossians",4,"COL","colossians","col"],["1 థెస్సలొనీక","1 Thessalonians",5,"1TH","1-thessalonians","1th"],["2 థెస్సలొనీక","2 Thessalonians",3,"2TH","2-thessalonians","2th"],["1 తిమోతి","1 Timothy",6,"1TI","1-timothy","1tm"],
["2 తిమోతి","2 Timothy",4,"2TI","2-timothy","2tm"],["తీతు","Titus",3,"TIT","titus","tt"],["ఫిలేమోను","Philemon",1,"PHM","philemon","phm"],["హెబ్రీ","Hebrews",13,"HEB","hebrews","hb"],["యాకోబు","James",5,"JAS","james","jm"],
["1 పేతురు","1 Peter",5,"1PE","1-peter","1pt"],["2 పేతురు","2 Peter",3,"2PE","2-peter","2pt"],["1 యోహాను","1 John",5,"1JN","1-john","1jn"],["2 యోహాను","2 John",1,"2JN","2-john","2jn"],["3 యోహాను","3 John",1,"3JN","3-john","3jn"],["యూదా","Jude",1,"JUD","jude","jd"],["ప్రకటన","Revelation",22,"REV","revelation","rv"]
];
const OFFLINE_EN = {
"GEN_1": ["In the beginning God created the heaven and the earth.","And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters.","And God said, Let there be light: and there was light.","And God saw the light, that it was good: and God divided the light from the darkness.","And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day."],
"PSA_23": ["The LORD is my shepherd; I shall not want.","He maketh me to lie down in green pastures: he leadeth me beside the still waters.","He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.","Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me."]
};
let LANG='te';
function setLang(l){ LANG=l; document.getElementById('btnTe').style.background=l=='te'?'#FFD54F':'#fff'; document.getElementById('btnEn').style.background=l=='en'?'#FFD54F':'#fff'; if(document.getElementById('curBar').style.display=='block'){ loadChapter(); } }
let curBook = 0, curChap = 1, lastEn=[], reqId=0;
let EN_DATA=null, EN_FILE='en_kjv', DATA_LOADING=null;
function cleanText(s){ if(!s) return ''; s=String(s).replace(/<S>\d+<\/S>/g,'').replace(/<[^>]+>/g,'').replace(/\b\d{3,5}\b/g,'').replace(/\[\d+\]/g,'').replace(/\s{2,}/g,' ').replace(/\s+([.,;:!?])/g,'$1').trim(); return s; }
function renderBooks(){
  let q=document.getElementById('bSearch').value.toLowerCase().trim();
  let list=BOOKS.map((b,i)=>({b,i})).filter(x=>!q||x.b[0].toLowerCase().includes(q)||x.b[1].toLowerCase().includes(q));
  document.getElementById('bookList').innerHTML='<div class="books">'+list.map(x=>`<div class="book" onclick="openBook(${x.i})"><b>${x.b[0]}<br><span style="font-size:12px;color:#666">${x.b[1]}</span></b><small>${x.b[2]} Chapters</small></div>`).join('')+'</div>';
}
function openBook(i){
  curBook=i; curChap=1;
  let b=BOOKS[i]; let h=''; for(let c=1;c<=b[2];c++){ h+=`<button onclick="goChap(${c})">${c}</button>`; }
  document.getElementById('chapList').innerHTML=`<button class="backbtn" onclick="backToBooks()">⬅️ All Books</button><div style="padding:0 10px;font-weight:bold;color:#0B3D2E">📖 ${b[0]} / ${b[1]} - Select Chapter</div><div class="chaps">${h}</div>`;
  document.getElementById('chapList').style.display='block';
  document.getElementById('bookList').style.display='none';
  document.getElementById('curBar').style.display='none';
  document.getElementById('verseList').innerHTML='';
  document.getElementById('loadMsg').textContent='👆 Select Chapter above';
}
function backToBooks(){ document.getElementById('chapList').style.display='none'; document.getElementById('curBar').style.display='none'; document.getElementById('verseList').innerHTML=''; document.getElementById('bookList').style.display='block'; document.getElementById('loadMsg').textContent=''; }
function showChaps(){ document.getElementById('chapList').style.display='block'; document.getElementById('chapList').scrollIntoView({behavior:'smooth'}); }
function goChap(c){
  window.scrollTo({top:0, behavior:'smooth'});
  curChap=c;
  let b=BOOKS[curBook];
  document.getElementById('chapList').style.display='none';
  document.getElementById('bookList').style.display='none';
  document.getElementById('curBar').style.display='block';
  document.getElementById('curBar').innerHTML=`📖 ${b[0]} ${curChap} <button onclick="showChaps()">📖 Change Chapter</button> <button onclick="backToBooks()">📚 Books</button>`;
  document.getElementById('verseList').innerHTML='';
  loadChapter();
}
async function fetchJSON(url, ms=30000){
  let c=new AbortController(); let t=setTimeout(()=>c.abort(), ms);
  try{ let r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) return null; return await r.json(); }
  catch(e){ clearTimeout(t); return null; }
}
async function loadBibles(){
  if(DATA_LOADING) return DATA_LOADING;
  DATA_LOADING = (async()=>{
    try{
      let idx = await fetchJSON('https://cdn.jsdelivr.net/gh/thiagobodruk/bible@master/json/index.json', 30000);
      let arr = Array.isArray(idx) ? idx : (idx ? Object.values(idx) : []);
      let enEntry = arr.find(x=> JSON.stringify(x).toLowerCase().includes('en_kjv') || JSON.stringify(x).toLowerCase().includes('king james'));
      if(enEntry) EN_FILE = (enEntry.id||enEntry.file||'en_kjv') + (String(enEntry.id||'').endsWith('.json')?'':'.json');
      document.getElementById('verInfo').textContent = 'English: '+EN_FILE;
    }catch(e){ if(!EN_FILE) EN_FILE='en_kjv.json'; }
    let en = await fetchJSON('https://cdn.jsdelivr.net/gh/thiagobodruk/bible@master/json/'+EN_FILE, 60000);
    if(en) EN_DATA = en;
    document.getElementById('verInfo').textContent = 'English: '+EN_FILE + (EN_DATA?' ✅':' ❌');
    return true;
  })();
  return DATA_LOADING;
}
function getChapter(data, bookIdx, chap){
  if(!data || !Array.isArray(data)) return null;
  let b = BOOKS[bookIdx];
  let want = [b[5], b[3].toLowerCase(), b[1].toLowerCase()];
  if(bookIdx===42) want = ['jn','john','jhn'];
  if(bookIdx===31) want = ['jnh','jon','jonah'];
  let found = null;
  for(let w of want){
    found = data.find(x=> String(x.abbrev||'').toLowerCase()===w || String(x.name||'').toLowerCase()===w);
    if(found) break;
  }
  if(!found){ found = data[bookIdx]; }
  if(!found || !Array.isArray(found.chapters)) return null;
  let ch = found.chapters[chap-1];
  if(!ch) return null;
  return ch.map((v,i)=>{
    if(typeof v==='string') return {n:i+1, t: cleanText(v)};
    return {n: parseInt(v.verse||v.number|| (i+1)), t: cleanText(v.text||v.content||'')};
  }).filter(x=>x.t);
}
async function loadChapter(){
  let myId = ++reqId;
  let b=BOOKS[curBook];
  // TELUGU - WordProject - inside our app
  if(LANG=='te'){
    let num = String(curBook+1).padStart(2,'0');
    document.getElementById('verseList').innerHTML = `<div class="nav"><button class="prev" onclick="prevChap()">⬅️ Prev</button><button style="background:#FFF8E1;border:2px solid #FFD54F">${b[0]} ${curChap}</button><button class="next" onclick="nextChap()">Next ➡️</button></div><iframe src="https://wordproject.org/bibles/tel/${num}/${curChap}.htm" style="width:100%;height:80vh;border:none;background:#fff;border-radius:14px"></iframe><div class="nav"><button class="prev" onclick="prevChap()">⬅️ Prev</button><button class="next" onclick="nextChap()">Next ➡️</button></div>`;
    document.getElementById('loadMsg').textContent='✅ తెలుగు - '+b[0]+' '+curChap+' - BM Mahima Sannidhi';
    return;
  }
  let key=b[3]+'_'+curChap;
  document.getElementById('loadMsg').innerHTML='⏳ '+b[1]+' '+curChap+' Loading... 🙏';
  let cacheKey=`ms_bible_en_${curBook}_${curChap}`;
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(cacheKey)||'null'); }catch(e){}
  if(cached && cached.en && cached.en.length && myId===reqId){
    lastEn=cached.en; renderVerses(lastEn);
    document.getElementById('loadMsg').textContent='✅ Offline - Saved'; return;
  }
  let hasOffline = !!OFFLINE_EN[key];
  if(hasOffline && myId===reqId){
    lastEn=OFFLINE_EN[key].map((t,i)=>({n:i+1,t:t}));
    renderVerses(lastEn);
    document.getElementById('loadMsg').textContent='⏳ First verses - Full chapter coming...';
  }
  document.getElementById('loadMsg').innerHTML='⏳ Bible file loading... First time wait 10 seconds 🙏';
  await loadBibles();
  if(myId!==reqId) return;
  let en = getChapter(EN_DATA, curBook, curChap);
  if(myId!==reqId) return;
  if(en && en.length){
    lastEn=en;
    try{ localStorage.setItem(cacheKey, JSON.stringify({en:lastEn})); }catch(e){}
    renderVerses(lastEn);
    document.getElementById('loadMsg').textContent='✅ '+b[1]+' '+curChap+' - '+en.length+' Verses - English KJV - Saved';
    return;
  }
  if(hasOffline){
    document.getElementById('loadMsg').innerHTML='✅ Showing first verses<br><button class="retrybtn" onclick="loadChapter()">🔄 Try Again</button>';
    return;
  }
  document.getElementById('loadMsg').innerHTML='⚠️ Server not responding - Turn on Net<br><button class="retrybtn" onclick="loadChapter()">🔄 Try Again</button>';
}
function renderVerses(en){
  let b=BOOKS[curBook];
  let box=document.getElementById('verseList');
  let h=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ Prev</button><button style="background:#FFF8E1;border:2px solid #FFD54F">${b[1]} ${curChap}</button><button class="next" onclick="nextChap()">Next ➡️</button></div>`;
  for(let i=0;i<en.length;i++){
    let e=en[i]||{n:i+1,t:''};
    let vn = e.n || (i+1);
    h+=`<div class="verse"><div class="ref">${b[1]} ${curChap}:${vn}</div><div class="en">${e.t}</div><div class="shr"><button onclick="shareVerse(${vn})">📤 Share</button></div></div>`;
  }
  h+=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ Prev</button><button class="next" onclick="nextChap()">Next ➡️</button></div>`;
  box.innerHTML=h;
}
function prevChap(){ if(curChap>1){ goChap(curChap-1); } else if(curBook>0){ curBook--; goChap(BOOKS[curBook][2]); } }
function nextChap(){ if(curChap<BOOKS[curBook][2]){ goChap(curChap+1); } else if(curBook<BOOKS.length-1){ curBook++; goChap(1); } }
function shareVerse(n){ let b=BOOKS[curBook]; let verses=document.querySelectorAll('.verse'); let txt=''; verses.forEach(v=>{ if(v.querySelector('.ref') && v.querySelector('.ref').textContent.includes(':'+n)) txt=v.innerText; }); window.open('https://wa.me/?text='+encodeURIComponent('🙏 '+b[1]+' '+curChap+':'+n+'\n\n'+txt+'\n\n📖 BM Mahima Sannidhi\nhttps://ms2biblemission-bit.github.io/BMmahimasannidhi/bible.html'),'_blank'); }
renderBooks();
</script></body></html>
