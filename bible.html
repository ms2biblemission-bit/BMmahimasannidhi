function setMode(m){ mode=m; localStorage.setItem('ms_bible_mode',m); document.getElementById('btnBoth').className=m==='both'?'on':''; document.getElementById('btnTe').className=m==='te'?'on':''; document.getElementById('btnEn').className=m==='en'?'on':''; if(lastTe.length||lastEn.length) renderVerses(lastTe,lastEn); }

function isTelugu(s){ return /[\u0C00-\u0C7F]/.test(s||''); }
function cleanText(s){ if(!s) return ''; s=String(s).replace(/<S>\d+<\/S>/g,'').replace(/<[^>]+>/g,'').replace(/\b\d{3,5}\b/g,'').replace(/\[\d+\]/g,'').replace(/\s{2,}/g,' ').replace(/\s+([.,;:!?])/g,'$1').trim(); return s; }
function renderBooks(){
  let q=document.getElementById('bSearch').value.toLowerCase().trim();
  let list=BOOKS.map((b,i)=>({b,i})).filter(x=>!q||x.b[0].toLowerCase().includes(q)||x.b[1].toLowerCase().includes(q));
  document.getElementById('bookList').innerHTML='<div class="books">'+list.map(x=>`<div class="book" onclick="openBook(${x.i})"><b>${x.b[0]}</b><small>${x.b[1]} • ${x.b[2]} అధ్యాయాలు</small></div>`).join('')+'</div>';
}
function openBook(i){
  curBook=i; curChap=1;

}

async function fetchJSON(url, ms=30000){
  let c=new AbortController(); let t=setTimeout(()=>c.abort(), ms);
  try{ let r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) return null; return await r.json(); }
  catch(e){ clearTimeout(t); return null; }
}
async function loadBibles(){
  if(DATA_LOADING) return DATA_LOADING;
  DATA_LOADING = (async()=>{
    try{
      let idx = await fetchJSON('https://cdn.jsdelivr.net/gh/thiagobodruk/bible@master/json/index.json', 30000);
      let arr = Array.isArray(idx) ? idx : (idx ? Object.values(idx) : []);
      let teEntry = arr.find(x=>{
        let s = JSON.stringify(x).toLowerCase();
        return s.includes('telugu') || s.includes('"te_') || s.includes('te_irv') || s.includes('te-tel') || s.includes('"te"');
      });
      if(teEntry){
        TE_FILE = teEntry.id || teEntry.file || teEntry.name || teEntry.code || '';
        if(TE_FILE && !TE_FILE.endsWith('.json')) TE_FILE += '.json';
      }
      if(!TE_FILE) TE_FILE = 'te_irvtel.json';
      let enEntry = arr.find(x=> JSON.stringify(x).toLowerCase().includes('en_kjv') || JSON.stringify(x).toLowerCase().includes('king james'));
      if(enEntry) EN_FILE = (enEntry.id||enEntry.file||'en_kjv') + (String(enEntry.id||'').endsWith('.json')?'':'.json');
      document.getElementById('verInfo').textContent = 'తెలుగు: '+TE_FILE+' | English: '+EN_FILE;
    }catch(e){ if(!TE_FILE) TE_FILE='te_irvtel.json'; }
    let [te, en] = await Promise.all([
      fetchJSON('https://cdn.jsdelivr.net/gh/thiagobodruk/bible@master/json/'+TE_FILE, 60000),
      fetchJSON('https://cdn.jsdelivr.net/gh/thiagobodruk/bible@master/json/'+EN_FILE, 60000)
    ]);
    if(te) TE_DATA = te;
    if(en) EN_DATA = en;
    document.getElementById('verInfo').textContent = 'తెలుగు: '+TE_FILE+' | English: '+EN_FILE + (TE_DATA?' ✅':' ❌');
    return true;
  })();
  return DATA_LOADING;
}
function getChapter(data, bookIdx, chap){
  if(!data || !Array.isArray(data)) return null;
  let b = BOOKS[bookIdx];
  let want = [b[5], b[3].toLowerCase(), b[1].toLowerCase()];
  if(bookIdx===42) want = ['jn','john','jhn'];
  if(bookIdx===31) want = ['jnh','jon','jonah'];
  let found = null;
  for(let w of want){
    found = data.find(x=> String(x.abbrev||'').toLowerCase()===w || String(x.name||'').toLowerCase()===w);
    if(found) break;
  }
  if(!found){ found = data[bookIdx]; }
  if(!found || !Array.isArray(found.chapters)) return null;
  let ch = found.chapters[chap-1];
  if(!ch) return null;
  return ch.map((v,i)=>{
    if(typeof v==='string') return {n:i+1, t: cleanText(v)};
    return {n: parseInt(v.verse||v.number|| (i+1)), t: cleanText(v.text||v.content||'')};
  }).filter(x=>x.t);
}
async function loadChapter(){
  let myId = ++reqId;

  let cached=null; try{ cached=JSON.parse(localStorage.getItem(cacheKey)||'null'); }catch(e){}

    lastTe=cached.te; lastEn=cached.en||cached.te; renderVerses(lastTe,lastEn);

  }

  if(hasOffline && myId===reqId){
    lastTe=OFFLINE_TE[key].map((t,i)=>({n:i+1,t:t})); lastEn=(OFFLINE_EN[key]||[]).map((t,i)=>({n:i+1,t:t}));
    renderVerses(lastTe,lastEn);
    document.getElementById('loadMsg').textContent='⏳ మొదటి వచనాలు - పూర్తి అధ్యాయం వస్తోంది...';
  }
  document.getElementById('loadMsg').innerHTML='⏳ తెలుగు బైబిల్ ఫైల్ లోడ్ అవుతోంది... మొదటిసారి 10 సెకన్లు ఆగండి 🙏';
  await loadBibles();
  if(myId!==reqId) return;
  let te = getChapter(TE_DATA, curBook, curChap);
  let en = getChapter(EN_DATA, curBook, curChap);
  if(te && te.length && !isTelugu(te.map(x=>x.t).join(' ').slice(0,1000))) te=null;
  if(myId!==reqId) return;
  if(te && te.length){
    lastTe=te; lastEn=(en && en.length)?en:te;
    try{ localStorage.setItem(cacheKey, JSON.stringify({te:lastTe,en:lastEn})); }catch(e){}
    renderVerses(lastTe,lastEn);
    document.getElementById('loadMsg').textContent='✅ '+b[0]+' '+curChap+' - '+te.length+' వచనాలు - తెలుగు + English - సేవ్ అయ్యింది';
    return;
  }
  if(en && en.length){
    lastTe=[]; lastEn=en;
    renderVerses([],en);
    document.getElementById('loadMsg').innerHTML='⚠️ తెలుగు ఫైల్ ('+TE_FILE+') లో ఈ అధ్యాయం దొరకలేదు - ఇంగ్లీష్ మాత్రమే<br><button class="retrybtn" onclick="loadChapter()">🔄 మళ్ళీ ప్రయత్నించండి</button>';
    return;
  }
  if(hasOffline){
    document.getElementById('loadMsg').innerHTML='✅ మొదటి వచనాలు చూస్తున్నారు<br><button class="retrybtn" onclick="loadChapter()">🔄 మళ్ళీ ప్రయత్నించండి</button>';
    return;
  }
  document.getElementById('loadMsg').innerHTML='⚠️ సర్వర్ నుండి రాలేదు - నెట్ ఆన్ చేసి<br><button class="retrybtn" onclick="loadChapter()">🔄 మళ్ళీ ప్రయత్నించండి</button>';
}
function renderVerses(te,en){
  let b=BOOKS[curBook];
  let box=document.getElementById('verseList');
  let max=Math.max(te.length, en.length);
  let h=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ ముందు</button><button style="background:#FFF8E1;border:2px solid #FFD54F">${b[0]} ${curChap} - ${b[1]} ${curChap}</button><button class="next" onclick="nextChap()">తర్వాత ➡️</button></div>`;
  for(let i=0;i<max;i++){
    let t=te[i]||{n:i+1,t:''}; let e=en[i]||{n:i+1,t:''};
    let vn = t.n || e.n || (i+1);
    let teHtml = mode!=='en' && t.t ? `<div class="te">${t.t}</div>` : (mode==='te' && !t.t ? `<div class="te" style="color:#888">⚠️ తెలుగు దొరకలేదు</div>` : '');
    let enHtml = mode!=='te' && e.t ? `<div class="en">${e.t}</div>` : '';
    if(mode==='te' && !t.t) enHtml='';
    h+=`<div class="verse"><div class="ref">${b[0]} ${curChap}:${vn}</div>${teHtml}${enHtml}<div class="shr"><button onclick="shareVerse(${vn})">📤 షేర్</button></div></div>`;
  }
  h+=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ ముందు</button><button class="next" onclick="nextChap()">తర్వాత ➡️</button></div>`;
  box.innerHTML=h;
}
function prevChap(){ if(curChap>1){ goChap(curChap-1); } else if(curBook>0){ curBook--; goChap(BOOKS[curBook][2]); } }
function nextChap(){ if(curChap<BOOKS[curBook][2]){ goChap(curChap+1); } else if(curBook<BOOKS.length-1){ curBook++; goChap(1); } }
function shareVerse(n){ let b=BOOKS[curBook]; let verses=document.querySelectorAll('.verse'); let txt=''; verses.forEach(v=>{ if(v.querySelector('.ref') && v.querySelector('.ref').textContent.includes(':'+n)) txt=v.innerText; }); window.open('https://wa.me/?text='+encodeURIComponent('🙏 '+b[0]+' '+curChap+':'+n+'\n\n'+txt+'\n\n📖 BM మహిమ సన్నిధి\nhttps://ms2biblemission-bit.github.io/BMmahimasannidhi/bible.html'),'_blank'); }
renderBooks();
</script></body></html>
