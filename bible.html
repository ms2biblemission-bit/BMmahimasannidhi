function isTelugu(s){ return /[\u0C00-\u0C7F]/.test(s||''); }
function cleanText(s){ if(!s) return ''; s=String(s).replace(/<S>\d+<\/S>/g,'').replace(/<[^>]+>/g,'').replace(/\b\d{3,5}\b/g,'').replace(/\[\d+\]/g,'').replace(/\s{2,}/g,' ').replace(/\s+([.,;:!?])/g,'$1').trim(); return s; }
function renderBooks(){

async function fetchJSON(url, ms=12000){
  let c=new AbortController(); let t=setTimeout(()=>c.abort(), ms);
  try{ let r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) return null; return await r.json(); }
  catch(e){ clearTimeout(t); return null; }
}
// ✅ ముందు - ఏ తెలుగు వెర్షన్ ఉందో - ఆటోమేటిక్ గా కనుక్కో!
async function loadVersions(){
  if(VER_LOADED) return;
  try{
    let list = await fetchJSON('https://cdn.jsdelivr.net/gh/wldeh/bible-api/bibles/bibles.json', 12000);
    if(list){
      let arr = Array.isArray(list) ? list : (list.bibles||list.data||[]);
      // తెలుగు - language te / telugu / id లో te ఉన్నది
      let te = arr.find(v=>{ let s=JSON.stringify(v).toLowerCase(); return (v.language==='te'||v.language==='telugu'||v.lang==='te'|| (v.id&&String(v.id).toLowerCase().startsWith('te-')) || s.includes('"language":"te"')); });
      // ఇంగ్లీష్ KJV
      let en = arr.find(v=> String(v.id||'').toLowerCase()==='en-kjv') || arr.find(v=> String(v.id||'').toLowerCase().includes('kjv'));
      if(te && te.id) TE_VER = te.id;
      if(en && en.id) EN_VER = en.id;
      document.getElementById('verInfo').textContent = 'తెలుగు: '+TE_VER+' | English: '+EN_VER;
      VER_LOADED=true;
      try{ localStorage.setItem('ms_bible_vers', JSON.stringify({te:TE_VER,en:EN_VER})); }catch(e){}
      return;
    }
  }catch(e){}
  try{ let saved=JSON.parse(localStorage.getItem('ms_bible_vers')||'null'); if(saved){ TE_VER=saved.te; EN_VER=saved.en; } }catch(e){}
  document.getElementById('verInfo').textContent = 'తెలుగు: '+TE_VER+' | English: '+EN_VER+' (డిఫాల్ట్)';
}
loadVersions();
function parseWldeh(j){
  if(!j) return null;
  let arr = null;
  if(Array.isArray(j)) arr=j;
  else if(j.data && Array.isArray(j.data.verses)) arr=j.data.verses;
  else if(Array.isArray(j.verses)) arr=j.verses;
  else if(j.data && Array.isArray(j.data)) arr=j.data;
  else if(j.chapter && Array.isArray(j.chapter.verses)) arr=j.chapter.verses;
  if(!arr) return null;
  let out = arr.map((v,i)=>{
    let n = parseInt(v.verse||v.number||v.verse_number||v.id|| (i+1));
    let t = v.text||v.content||v.verse_text||'';
    if(typeof t!=='string') t = (Array.isArray(t)? t.map(x=>x.text||x).join(' ') : '');
    return {n:n, t: cleanText(t)};
  }).filter(x=>x.t);
  return out.length?out:null;
}
async function fetchWldehChapter(ver, bookSlug, chap){
  // wldeh - per-chapter file - jsDelivr - CORS ఉంటుంది
  let urls = [
    `https://cdn.jsdelivr.net/gh/wldeh/bible-api/bibles/${ver}/books/${bookSlug}/chapters/${chap}.json`,
    `https://cdn.jsdelivr.net/gh/wldeh/bible-api/bibles/${ver}/books/${bookSlug}/chapters/${chap}/verses.json`
  ];
  for(let u of urls){
    let j = await fetchJSON(u, 12000);
    let v = parseWldeh(j);
    if(v && v.length) return v;
  }
  return null;
}
async function fetchBibleApiChapter(bookEn, chap, translation){
  // bible-api.com - ఇంగ్లీష్ కి మాత్రమే నమ్మకం - తెలుగు లేదు
  try{
    let j = await fetchJSON(`https://bible-api.com/${encodeURIComponent(bookEn)}+${chap}?translation=${translation}`, 10000);
    if(j && Array.isArray(j.verses)) return j.verses.map(v=>({n:parseInt(v.verse), t: cleanText(v.text)}));
  }catch(e){}
  return null;
}

  }
  let hasOffline = !!OFFLINE_TE[key];
  if(hasOffline && myId===reqId){
    lastTe=OFFLINE_TE[key].map((t,i)=>({n:i+1,t:t})); lastEn=(OFFLINE_EN[key]||[]).map((t,i)=>({n:i+1,t:t}));
    renderVerses(lastTe,lastEn);
    document.getElementById('loadMsg').textContent='⏳ మొదటి 5 వచనాలు - పూర్తి అధ్యాయం వస్తోంది...';
  }
  await loadVersions();
  if(myId!==reqId) return;
  let [te, en] = await Promise.all([
    fetchWldehChapter(TE_VER, b[4], curChap),
    fetchWldehChapter(EN_VER, b[4], curChap)
  ]);
  if(myId!==reqId) return;
  if(te && te.length && !isTelugu(te.map(x=>x.t).join(' ').slice(0,1000))) te=null;
  if(!en || !en.length){
    en = await fetchBibleApiChapter(b[1], curChap, 'kjv');
  }
  if(myId!==reqId) return;
  if(te && te.length){
    lastTe=te; lastEn=(en && en.length)?en:te;
    try{ localStorage.setItem(cacheKey, JSON.stringify({te:lastTe,en:lastEn})); }catch(e){}
    renderVerses(lastTe,lastEn);
    document.getElementById('loadMsg').textContent='✅ '+b[0]+' '+curChap+' - '+te.length+' వచనాలు - తెలుగు + English - సేవ్ అయ్యింది';
    return;
  }
  if(en && en.length){
    lastTe=[]; lastEn=en;
    try{ localStorage.setItem(cacheKey, JSON.stringify({te:[],en:lastEn})); }catch(e){}
    renderVerses([],en);
    document.getElementById('loadMsg').innerHTML='⚠️ తెలుగు వెర్షన్ ('+TE_VER+') లో ఈ అధ్యాయం దొరకలేదు - ఇంగ్లీష్ మాత్రమే - '+en.length+' వచనాలు<br><button class="retrybtn" onclick="loadChapter()">🔄 మళ్ళీ ప్రయత్నించండి</button>';
    return;
  }
  if(hasOffline){
    document.getElementById('loadMsg').innerHTML='✅ మొదటి 5 వచనాలు చూస్తున్నారు - పూర్తి కోసం<br><button class="retrybtn" onclick="loadChapter()">🔄 మళ్ళీ ప్రయత్నించండి</button>';
    return;
  }
  document.getElementById('loadMsg').innerHTML='⚠️ సర్వర్ నుండి రాలేదు - నెట్ ఆన్ చేసి<br><button class="retrybtn" onclick="loadChapter()">🔄 మళ్ళీ ప్రయత్నించండి</button>';
}
function renderVerses(te,en){
  let b=BOOKS[curBook];
  let box=document.getElementById('verseList');
  let max=Math.max(te.length, en.length);
  let h=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ ముందు</button><button style="background:#FFF8E1;border:2px solid #FFD54F">${b[0]} ${curChap} - ${b[1]} ${curChap}</button><button class="next" onclick="nextChap()">తర్వాత ➡️</button></div>`;
  for(let i=0;i<max;i++){
    let t=te[i]||{n:i+1,t:''}; let e=en[i]||{n:i+1,t:''};
    let vn = t.n || e.n || (i+1);
    let teHtml = mode!=='en' && t.t ? `<div class="te">${t.t}</div>` : (mode==='te' && !t.t ? `<div class="te" style="color:#888">⚠️ తెలుగు దొరకలేదు</div>` : '');
    let enHtml = mode!=='te' && e.t ? `<div class="en">${e.t}</div>` : '';
    if(mode==='te' && !t.t) enHtml='';
    h+=`<div class="verse"><div class="ref">${b[0]} ${curChap}:${vn}</div>${teHtml}${enHtml}<div class="shr"><button onclick="shareVerse(${vn})">📤 షేర్</button></div></div>`;
  }
  h+=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ ముందు</button><button class="next" onclick="nextChap()">తర్వాత ➡️</button></div>`;
  box.innerHTML=h;
}
function prevChap(){ if(curChap>1){ goChap(curChap-1); } else if(curBook>0){ curBook--; goChap(BOOKS[curBook][2]); } }
function nextChap(){ if(curChap<BOOKS[curBook][2]){ goChap(curChap+1); } else if(curBook<BOOKS.length-1){ curBook++; goChap(1); } }
function shareVerse(n){ let b=BOOKS[curBook]; let verses=document.querySelectorAll('.verse'); let txt=''; verses.forEach(v=>{ if(v.querySelector('.ref') && v.querySelector('.ref').textContent.includes(':'+n)) txt=v.innerText; }); window.open('https://wa.me/?text='+encodeURIComponent('🙏 '+b[0]+' '+curChap+':'+n+'\n\n'+txt+'\n\n📖 BM మహిమ సన్నిధి\nhttps://ms2biblemission-bit.github.io/BMmahimasannidhi/bible.html'),'_blank'); }
renderBooks();
</script></body></html>
