function setMode(m){ mode=m; localStorage.setItem('ms_bible_mode',m); document.getElementById('btnBoth').className=m==='both'?'on':''; document.getElementById('btnTe').className=m==='te'?'on':''; document.getElementById('btnEn').className=m==='en'?'on':''; if(lastTe.length||lastEn.length) renderVerses(lastTe,lastEn); }

function isTelugu(s){ return /[\u0C00-\u0C7F]/.test(s||''); }
function cleanText(s){ if(!s) return ''; s=String(s).replace(/<S>\d+<\/S>/g,'').replace(/<[^>]+>/g,'').replace(/\b\d{3,5}\b/g,'').replace(/\[\d+\]/g,'').replace(/\(\d+\)/g,'').replace(/\s{2,}/g,' ').replace(/\s+([.,;:!?])/g,'$1').trim(); return s; }
function renderBooks(){

  let list=BOOKS.map((b,i)=>({b,i})).filter(x=>!q||x.b[0].toLowerCase().includes(q)||x.b[1].toLowerCase().includes(q));
  document.getElementById('bookList').innerHTML='<div class="books">'+list.map(x=>`<div class="book" onclick="openBook(${x.i})"><b>${x.b[0]}</b><small>${x.b[1]} • ${x.b[2]} అధ్యాయాలు</small></div>`).join('')+'</div>';
}
function openBook(i){

function goChap(c){ curChap=c; document.querySelectorAll('.chaps button').forEach((el)=>{ if(el.textContent==String(c)) el.className='on'; else if(!isNaN(parseInt(el.textContent))) el.className=''; }); loadChapter(); }
async function fetchWithTimeout(url, ms=9000){
  let c=new AbortController(); let t=setTimeout(()=>c.abort(), ms);
  try{ let r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) return {err:'HTTP '+r.status}; return {data: await r.json()}; }
  catch(e){ clearTimeout(t); return {err: e.name==='AbortError' ? 'Timeout - 9 సెకన్లలో రాలేదు' : 'CORS / నెట్ వర్క్ బ్లాక్ - '+e.message}; }
}
function parseHelloaoSimple(j){
  if(!j) return null;
  if(Array.isArray(j.verses)) return j.verses.map(v=>({n:v.verse||v.number, t: cleanText(v.text||v.content||'')}));
  if(Array.isArray(j.content)){
    let out=[]; j.content.forEach(c=>{ if(c.type==='verse' && c.text) out.push({n:c.number||out.length+1, t: cleanText(c.text)}); if(Array.isArray(c.content)) c.content.forEach(x=>{ if(x.type==='verse') out.push({n:x.number||out.length+1, t: cleanText(x.text)}); }); });
    if(out.length) return out;
  }
  return null;
}
// thiagobodruk - ఒక్క ఫైల్ లో మొత్తం బైబిల్ - json/te_irvtel.json
let _teFull=null, _enFull=null, _teLoading=null, _enLoading=null;
function extractFromFull(full, bookCode, chap){
  if(!full) return null;
  try{
    // ఫార్మాట్ 1 - {books: [{id, chapters: {1: {1: "text"}}}]}
    let books = full.books || full.Bible || full.bible || null;
    if(books){
      if(Array.isArray(books)){
        let bk = books.find(b=> (b.id===bookCode||b.abbr===bookCode||b.code===bookCode||b.name===bookCode) );
        if(!bk) bk = books[BOOKS.findIndex(x=>x[3]===bookCode)] || books.find(b=>b.name && b.name.toLowerCase().includes(BOOKS.find(x=>x[3]===bookCode)[1].toLowerCase().split(' ')[0]));
        if(bk && bk.chapters){
          let ch = bk.chapters[chap] || bk.chapters[String(chap)];
          if(ch){ let arr=Object.keys(ch).sort((a,b)=>a-b).map(k=>({n:parseInt(k), t: cleanText(ch[k])})); if(arr.length) return arr; }
        }
      } else if(typeof books==='object'){
        let ch = books[bookCode] && (books[bookCode][chap] || books[bookCode].chapters && books[bookCode].chapters[chap]);
        if(ch){ let arr=Object.keys(ch).sort((a,b)=>a-b).map(k=>({n:parseInt(k), t: cleanText(typeof ch[k]==='string'?ch[k]:ch[k].text)})); if(arr.length) return arr; }
      }
    }
    // ఫార్మాట్ 2 - [{book, chapter, verse, text}]
    if(Array.isArray(full)){
      let arr=full.filter(v=> (v.book_id===bookCode||v.book===bookCode) && parseInt(v.chapter)===chap).map(v=>({n:parseInt(v.verse), t: cleanText(v.text)}));
      if(arr.length) return arr.sort((a,b)=>a.n-b.n);
    }
    // ఫార్మాట్ 3 - {GEN: {1: {1: "text"}}}
    if(full[bookCode] && full[bookCode][chap]){
      let ch=full[bookCode][chap]; let arr=Object.keys(ch).sort((a,b)=>a-b).map(k=>({n:parseInt(k), t: cleanText(typeof ch[k]==='string'?ch[k]:ch[k].text)})); if(arr.length) return arr;
    }
  }catch(e){}
  return null;
}
async function loadFull(url, cacheKey){
  if(window[cacheKey]) return window[cacheKey];
  if(!window[cacheKey+'_p']){
    window[cacheKey+'_p'] = (async()=>{ let r=await fetchWithTimeout(url, 15000); if(r.data){ window[cacheKey]=r.data; return r.data; } return null; })();
  }
  return await window[cacheKey+'_p'];
}
async function fetchTelugu(code, chap){
  // 1 - jsDelivr - thiagobodruk - CORS ఉంటుంది
  let full = await loadFull('https://cdn.jsdelivr.net/gh/thiagobodruk/bible@master/json/te_irvtel.json','_teFull');
  if(full){ let v=extractFromFull(full, code, chap); if(v && v.length && isTelugu(v.map(x=>x.t).join(' '))) return v; }
  // 2 - helloao
  let r=await fetchWithTimeout(`https://bible.helloao.org/api/IRV-TE/${code}/${chap}.simple.json`, 9000);
  if(r.data){ let v=parseHelloaoSimple(r.data); if(v && v.length && isTelugu(v.map(x=>x.t).join(' '))) return v; }
  return null;
}
async function fetchEnglish(code, chap){
  let full = await loadFull('https://cdn.jsdelivr.net/gh/thiagobodruk/bible@master/json/en_kjv.json','_enFull');
  if(full){ let v=extractFromFull(full, code, chap); if(v && v.length) return v; }
  let r=await fetchWithTimeout(`https://bible.helloao.org/api/KJV/${code}/${chap}.simple.json`, 9000);
  if(r.data){ let v=parseHelloaoSimple(r.data); if(v && v.length) return v; }
  return null;
}
async function loadChapter(){
  let b=BOOKS[curBook];
  let key=b[3]+'_'+curChap;
  document.getElementById('loadMsg').innerHTML='⏳ లోడ్ అవుతోంది... 🙏';
  // ✅ ముందు - ఫైల్ లో ఉన్న తెలుగు - వెంటనే చూపించు!
  if(OFFLINE_TE[key]){
    lastTe=OFFLINE_TE[key].map((t,i)=>({n:i+1,t:t})); lastEn=(OFFLINE_EN[key]||OFFLINE_TE[key]).map((t,i)=>({n:i+1,t:t}));
    renderVerses(lastTe,lastEn);
    document.getElementById('loadMsg').textContent='✅ తెలుగు వచ్చేసింది! మిగతా వచనాలు లోడ్ అవుతున్నాయి...';
  }
  let cacheKey=`ms_bible4_${curBook}_${curChap}`;
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(cacheKey)||'null'); }catch(e){}
  if(cached && cached.te && cached.te.length){ lastTe=cached.te; lastEn=cached.en||cached.te; renderVerses(lastTe,lastEn); document.getElementById('loadMsg').textContent='✅ ఆఫ్ లైన్ - సేవ్ అయినది'; }
  let [te, en] = await Promise.all([fetchTelugu(b[3], curChap), fetchEnglish(b[3], curChap)]);
  if(te && te.length){
    // OFFLINE కన్నా ఎక్కువ వచనాలు ఉంటే - దాన్నే చూపించు
    if(!OFFLINE_TE[key] || te.length>OFFLINE_TE[key].length){
      lastTe=te; lastEn=(en && en.length)?en:te;
      try{ localStorage.setItem(cacheKey, JSON.stringify({te:lastTe,en:lastEn})); }catch(e){}
      renderVerses(lastTe,lastEn);
      document.getElementById('loadMsg').textContent='✅ '+b[0]+' '+curChap+' - తెలుగు + English - సేవ్ అయ్యింది';
      return;
    }
  }
  if(en && en.length && !OFFLINE_TE[key]){
    lastTe=[]; lastEn=en; renderVerses([],en);
    document.getElementById('loadMsg').innerHTML='⚠️ తెలుగు ఈ అధ్యాయంలో దొరకలేదు - ఇంగ్లీష్ మాత్రమే<br><button class="retrybtn" onclick="loadChapter()">🔄 మళ్ళీ ప్రయత్నించండి</button>';
    return;
  }
  if(OFFLINE_TE[key] || (cached && cached.te)){
    document.getElementById('loadMsg').textContent='✅ తెలుగు చూస్తున్నారు - పూర్తి అధ్యాయం కోసం మళ్ళీ ప్రయత్నించండి';
    return;
  }
  document.getElementById('loadMsg').innerHTML='⚠️ సర్వర్ నుండి రాలేదు - నెట్ ఆన్ చేసి మళ్ళీ నొక్కండి<br><button class="retrybtn" onclick="loadChapter()">🔄 మళ్ళీ ప్రయత్నించండి</button>';
}
function renderVerses(te,en){
  let b=BOOKS[curBook];
  let box=document.getElementById('verseList');
  let max=Math.max(te.length, en.length);
  let h=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ ముందు</button><button style="background:#FFF8E1;border:2px solid #FFD54F">${b[0]} ${curChap} - ${b[1]} ${curChap}</button><button class="next" onclick="nextChap()">తర్వాత ➡️</button></div>`;
  for(let i=0;i<max;i++){
    let t=te[i]||{n:i+1,t:''}; let e=en[i]||{n:i+1,t:''};
    let vn = t.n || e.n || (i+1);
    let teHtml = mode!=='en' && t.t ? `<div class="te">${t.t}</div>` : (mode==='te' && !t.t ? `<div class="te" style="color:#888">⚠️ తెలుగు దొరకలేదు</div>` : '');
    let enHtml = mode!=='te' && e.t ? `<div class="en">${e.t}</div>` : '';
    if(mode==='te' && !t.t) enHtml='';
    h+=`<div class="verse"><div class="ref">${b[0]} ${curChap}:${vn}</div>${teHtml}${enHtml}<div class="shr"><button onclick="shareVerse(${vn})">📤 షేర్</button></div></div>`;
  }
  h+=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ ముందు</button><button class="next" onclick="nextChap()">తర్వాత ➡️</button></div>`;
  box.innerHTML=h;
}
function prevChap(){ if(curChap>1){ goChap(curChap-1); } else if(curBook>0){ openBook(curBook-1); goChap(BOOKS[curBook][2]); } }
function nextChap(){ if(curChap<BOOKS[curBook][2]){ goChap(curChap+1); } else if(curBook<BOOKS.length-1){ openBook(curBook+1); } }
function shareVerse(n){ let b=BOOKS[curBook]; let verses=document.querySelectorAll('.verse'); let txt=''; verses.forEach(v=>{ if(v.querySelector('.ref') && v.querySelector('.ref').textContent.includes(':'+n)) txt=v.innerText; }); window.open('https://wa.me/?text='+encodeURIComponent('🙏 '+b[0]+' '+curChap+':'+n+'\n\n'+txt+'\n\n📖 BM మహిమ సన్నిధి\nhttps://ms2biblemission-bit.github.io/BMmahimasannidhi/bible.html'),'_blank'); }
renderBooks();
</script></body></html>
