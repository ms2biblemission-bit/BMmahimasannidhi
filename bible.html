<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>📖 బైబిల్ - తెలుగు + KJV | BM మహిమ సన్నిధి</title><meta name="theme-color" content="#0B3D2E">
<style>*{box-sizing:border-box}body{font-family:sans-serif;background:#E8F5E9;margin:0;padding-bottom:90px} .top{position:sticky;top:0;background:#0B3D2E;color:#fff;padding:12px;text-align:center;z-index:10} .top b{font-size:18px} .top small{display:block;font-size:12px;opacity:.9}
.tabs{display:flex;gap:8px;padding:10px} .tabs button{flex:1;padding:11px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;background:#fff;border:2px solid #0B3D2E;color:#0B3D2E} .tabs button.on{background:#0B3D2E;color:#fff}
.books{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px} .book{background:#fff;border-radius:14px;padding:12px;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);border:1px solid #DCEEDB} .book b{font-size:14px;color:#0B3D2E;display:block} .book small{color:#888;font-size:11px}
.chaps{display:flex;flex-wrap:wrap;gap:8px;padding:10px} .chaps button{width:48px;height:48px;border-radius:12px;border:1px solid #C8A96A;background:#FFF8E1;font-weight:bold;font-size:16px;cursor:pointer} .chaps button.on{background:#0B3D2E;color:#fff}
.nav{display:flex;gap:8px;padding:0 10px} .nav button{flex:1;padding:12px;border:none;border-radius:12px;font-weight:bold;cursor:pointer} .prev{background:#eee} .next{background:#0B3D2E;color:#fff}
.verse{background:#FFFEF8;margin:10px;border-radius:14px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.08)} .verse .ref{color:#0F2F6B;font-weight:bold;font-size:15px} .verse .te{font-size:19px;line-height:1.7;color:#3B2314;font-weight:500;margin-top:6px} .verse .en{font-size:15px;line-height:1.6;color:#555;font-style:italic;margin-top:6px;border-top:1px dashed #ddd;padding-top:6px} .verse .shr{text-align:right;margin-top:8px} .verse .shr button{background:#25D366;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.search{width:calc(100% - 20px);margin:0 10px;padding:12px;border-radius:10px;border:1px solid #C8E6C9;font-size:16px}
.bottom{position:fixed;left:12px;right:12px;bottom:10px;background:#fff;border-radius:24px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:flex;justify-content:space-around;padding:10px 4px} .bottom a{text-decoration:none;color:#555;font-size:11px;text-align:center;flex:1} .bottom .ic{font-size:22px;display:block}
.backbtn{background:#fff;border:2px solid #0B3D2E;color:#0B3D2E;padding:10px;border-radius:12px;font-weight:bold;width:calc(100% - 20px);margin:10px;cursor:pointer}
</style></head><body>
<div class="top"><b>📖 బైబిల్ - తెలుగు + KJV</b><small>BM మహిమ సన్నిధి | తెలుగు IRV + English KJV 🙏</small></div>
<input class="search" id="bSearch" placeholder="🔍 పుస్తకం వెతకండి... ఆదికాండం / Genesis" oninput="renderBooks()">
<div class="tabs"><button id="btnBoth" class="on" onclick="setMode('both')">తెలుగు + English</button><button id="btnTe" onclick="setMode('te')">తెలుగు మాత్రమే</button><button id="btnEn" onclick="setMode('en')">English మాత్రమే</button></div>
<div id="bookList"></div>
<div id="chapList" style="display:none"></div>
<div id="verseList"></div>
<div id="loadMsg" style="text-align:center;padding:12px;color:#666"></div>
<div class="bottom"><a href="index.html"><span class="ic">🏠</span>హోమ్</a><a href="bible.html"><span class="ic">📖</span>బైబిల్</a><a href="prayer.html"><span class="ic">🙏</span>ప్రార్థన</a><a href="videos.html"><span class="ic">▶️</span>మీడియా</a></div>
<script>
// పుస్తకం - తెలుగు పేరు, English పేరు, అధ్యాయాలు, helloao కోడ్ (GEN, LUK...)
const BOOKS=[
["ఆదికాండం","Genesis",50,"GEN"],["నిర్గమకాండం","Exodus",40,"EXO"],["లేవీయకాండం","Leviticus",27,"LEV"],["సంఖ్యాకాండం","Numbers",36,"NUM"],["ద్వితీయోపదేశకాండం","Deuteronomy",34,"DEU"],
["యెహోషువ","Joshua",24,"JOS"],["న్యాయాధిపతులు","Judges",21,"JDG"],["రూతు","Ruth",4,"RUT"],["1 సమూయేలు","1 Samuel",31,"1SA"],["2 సమూయేలు","2 Samuel",24,"2SA"],
["1 రాజులు","1 Kings",22,"1KI"],["2 రాజులు","2 Kings",25,"2KI"],["1 దినవృత్తాంతాలు","1 Chronicles",29,"1CH"],["2 దినవృత్తాంతాలు","2 Chronicles",36,"2CH"],["ఎజ్రా","Ezra",10,"EZR"],
["నెహెమ్యా","Nehemiah",13,"NEH"],["ఎస్తేరు","Esther",10,"EST"],["యోబు","Job",42,"JOB"],["కీర్తనలు","Psalms",150,"PSA"],["సామెతలు","Proverbs",31,"PRO"],
["ప్రసంగి","Ecclesiastes",12,"ECC"],["పరమగీతం","Song of Solomon",8,"SNG"],["యెషయా","Isaiah",66,"ISA"],["యిర్మీయా","Jeremiah",52,"JER"],["విలాపవాక్యాలు","Lamentations",5,"LAM"],
["యెహెజ్కేలు","Ezekiel",48,"EZK"],["దానియేలు","Daniel",12,"DAN"],["హోషేయ","Hosea",14,"HOS"],["యోవేలు","Joel",3,"JOL"],["ఆమోసు","Amos",9,"AMO"],
["ఓబద్యా","Obadiah",1,"OBA"],["యోనా","Jonah",4,"JON"],["మీకా","Micah",7,"MIC"],["నహూము","Nahum",3,"NAM"],["హబక్కూకు","Habakkuk",3,"HAB"],
["జెఫన్యా","Zephaniah",3,"ZEP"],["హగ్గయి","Haggai",2,"HAG"],["జెకర్యా","Zechariah",14,"ZEC"],["మలాకీ","Malachi",4,"MAL"],
["మత్తయి","Matthew",28,"MAT"],["మార్కు","Mark",16,"MRK"],["లూకా","Luke",24,"LUK"],["యోహాను","John",21,"JHN"],["అపొస్తలుల కార్యాలు","Acts",28,"ACT"],
["రోమా","Romans",16,"ROM"],["1 కొరింథీ","1 Corinthians",16,"1CO"],["2 కొరింథీ","2 Corinthians",13,"2CO"],["గలతీ","Galatians",6,"GAL"],["ఎఫెసీ","Ephesians",6,"EPH"],
["ఫిలిప్పీ","Philippians",4,"PHP"],["కొలొస్సీ","Colossians",4,"COL"],["1 థెస్సలొనీక","1 Thessalonians",5,"1TH"],["2 థెస్సలొనీక","2 Thessalonians",3,"2TH"],["1 తిమోతి","1 Timothy",6,"1TI"],
["2 తిమోతి","2 Timothy",4,"2TI"],["తీతు","Titus",3,"TIT"],["ఫిలేమోను","Philemon",1,"PHM"],["హెబ్రీ","Hebrews",13,"HEB"],["యాకోబు","James",5,"JAS"],
["1 పేతురు","1 Peter",5,"1PE"],["2 పేతురు","2 Peter",3,"2PE"],["1 యోహాను","1 John",5,"1JN"],["2 యోహాను","2 John",1,"2JN"],["3 యోహాను","3 John",1,"3JN"],["యూదా","Jude",1,"JUD"],["ప్రకటన","Revelation",22,"REV"]
];
let mode = localStorage.getItem('ms_bible_mode')||'both';
let curBook = 0, curChap = 1, lastTe=[], lastEn=[];
function setMode(m){ mode=m; localStorage.setItem('ms_bible_mode',m); document.getElementById('btnBoth').className=m==='both'?'on':''; document.getElementById('btnTe').className=m==='te'?'on':''; document.getElementById('btnEn').className=m==='en'?'on':''; if(lastTe.length) renderVerses(lastTe,lastEn); }
setMode(mode);
function isTelugu(s){ return /[\u0C00-\u0C7F]/.test(s||''); }
function cleanText(s){
  if(!s) return '';
  s = String(s);
  s = s.replace(/<S>\d+<\/S>/g,'').replace(/<[^>]+>/g,'');
  s = s.replace(/\b\d{3,5}\b/g,'');
  s = s.replace(/\[\d+\]/g,'').replace(/\(\d+\)/g,'');
  s = s.replace(/\s{2,}/g,' ').replace(/\s+([.,;:!?])/g,'$1').trim();
  return s;
}
function renderBooks(){
  let q=document.getElementById('bSearch').value.toLowerCase().trim();
  let list=BOOKS.map((b,i)=>({b,i})).filter(x=>!q||x.b[0].toLowerCase().includes(q)||x.b[1].toLowerCase().includes(q));
  document.getElementById('bookList').innerHTML='<div class="books">'+list.map(x=>`<div class="book" onclick="openBook(${x.i})"><b>${x.b[0]}</b><small>${x.b[1]} • ${x.b[2]} అధ్యాయాలు</small></div>`).join('')+'</div>';
}
function openBook(i){
  curBook=i; curChap=1;
  let b=BOOKS[i]; let h=''; for(let c=1;c<=b[2];c++){ h+=`<button class="${c===1?'on':''}" onclick="goChap(${c})">${c}</button>`; }
  document.getElementById('chapList').innerHTML=`<button class="backbtn" onclick="backToBooks()">⬅️ అన్ని పుస్తకాలు చూడండి</button><div style="padding:0 10px;font-weight:bold;color:#0B3D2E">📖 ${b[0]} - ${b[1]} - అధ్యాయం ఎంచుకోండి</div><div class="chaps">${h}</div>`;
  document.getElementById('chapList').style.display='block';
  document.getElementById('bookList').style.display='none';
  loadChapter();
}
function backToBooks(){ document.getElementById('chapList').style.display='none'; document.getElementById('verseList').innerHTML=''; document.getElementById('bookList').style.display='block'; document.getElementById('loadMsg').textContent=''; }
function goChap(c){ curChap=c; document.querySelectorAll('.chaps button').forEach((el)=>{ if(el.textContent==String(c)) el.className='on'; else if(!isNaN(parseInt(el.textContent))) el.className=''; }); loadChapter(); }
// ✅ నిజమైన తెలుగు API - helloao - IRV-TE
async function fetchHelloao(trans, code, chap){
  try{
    let r = await fetch(`https://bible.helloao.org/api/${trans}/${code}/${chap}.simple.json`);
    if(!r.ok) return null;
    let j = await r.json();
    // simple.json - verses: [{verse, text}] లేదా content లో verses
    if(j && Array.isArray(j.verses)) return j.verses.map(v=>({n: v.verse||v.number, t: cleanText(v.text||v.content||'')}));
    if(j && Array.isArray(j.content)){
      let out=[]; j.content.forEach(c=>{ if(c.verse) out.push({n:c.verse, t: cleanText(c.text||'')}); if(Array.isArray(c.content)) c.content.forEach(x=>{ if(x.verse) out.push({n:x.verse, t: cleanText(x.text||'')}); }); });
      if(out.length) return out;
    }
    if(j && j.chapter && Array.isArray(j.chapter.verses)) return j.chapter.verses.map(v=>({n:v.verse, t: cleanText(v.text)}));
    return null;
  }catch(e){ return null; }
}
async function loadChapter(){
  let b=BOOKS[curBook];
  document.getElementById('loadMsg').textContent='⏳ లోడ్ అవుతోంది... 🙏';
  let cacheKey=`ms_bible3_${curBook}_${curChap}`;
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(cacheKey)||'null'); }catch(e){}
  if(cached && cached.te && cached.te.length){ lastTe=cached.te; lastEn=cached.en||cached.te; renderVerses(lastTe,lastEn); document.getElementById('loadMsg').textContent='✅ ఆఫ్ లైన్ - సేవ్ అయినది చూస్తున్నారు'; }
  let [te, en] = await Promise.all([
    fetchHelloao('IRV-TE', b[3], curChap),
    fetchHelloao('KJV', b[3], curChap)
  ]);
  // KJV రాకపోతే - BSB ప్రయత్నించు
  if(!en || !en.length){ en = await fetchHelloao('BSB', b[3], curChap); }
  // ✅ ముఖ్యం - తెలుగులో తెలుగు అక్షరాలు లేకపోతే - అది తెలుగు కాదు! ఇంగ్లీష్ ని తెలుగు అని చూపించొద్దు!
  if(te && te.length && !isTelugu(te.map(x=>x.t).join(' ').slice(0,500))){
    te = null; // ఇంగ్లీష్ వచ్చింది - తెలుగు కాదు - పక్కన పెట్టు
  }
  if(te && te.length){
    lastTe=te; lastEn=(en && en.length)?en:te;
    try{ localStorage.setItem(cacheKey, JSON.stringify({te:lastTe,en:lastEn})); }catch(e){}
    renderVerses(lastTe,lastEn);
    document.getElementById('loadMsg').textContent='✅ '+b[0]+' '+curChap+' - తెలుగు + English - సేవ్ అయ్యింది';
  } else if(en && en.length){
    // తెలుగు రాలేదు - ఇంగ్లీష్ మాత్రమే చూపించు - తెలుగు అని అబద్ధం చెప్పొద్దు
    lastTe=[]; lastEn=en;
    renderVerses([],en);
    document.getElementById('loadMsg').textContent='⚠️ తెలుగు ఈ అధ్యాయంలో దొరకలేదు - ఇంగ్లీష్ మాత్రమే చూపిస్తున్నాను - మళ్ళీ ప్రయత్నించండి';
  } else if(!cached){
    document.getElementById('loadMsg').textContent='⚠️ ఇంటర్నెట్ లేదు - మళ్ళీ ప్రయత్నించండి';
  }
}
function renderVerses(te,en){
  let b=BOOKS[curBook];
  let box=document.getElementById('verseList');
  let max=Math.max(te.length, en.length);
  let h=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ ముందు</button><button style="background:#FFF8E1;border:2px solid #FFD54F">${b[0]} ${curChap} - ${b[1]} ${curChap}</button><button class="next" onclick="nextChap()">తర్వాత ➡️</button></div>`;
  for(let i=0;i<max;i++){
    let t=te[i]||{n:i+1,t:''}; let e=en[i]||{n:i+1,t:''};
    let vn = t.n || e.n || (i+1);
    let teHtml = mode!=='en' && t.t ? `<div class="te">${t.t}</div>` : (mode==='te' ? `<div class="te" style="color:#888">⚠️ తెలుగు దొరకలేదు</div>` : '');
    let enHtml = mode!=='te' && e.t ? `<div class="en">${e.t}</div>` : '';
    // తెలుగు మాత్రమే మోడ్ లో - తెలుగు లేకపోతే - ఇంగ్లీష్ చూపించొద్దు
    if(mode==='te' && !t.t) enHtml='';
    h+=`<div class="verse"><div class="ref">${b[0]} ${curChap}:${vn}</div>${teHtml}${enHtml}<div class="shr"><button onclick="shareVerse(${vn})">📤 షేర్</button></div></div>`;
  }
  h+=`<div class="nav"><button class="prev" onclick="prevChap()">⬅️ ముందు</button><button class="next" onclick="nextChap()">తర్వాత ➡️</button></div>`;
  box.innerHTML=h;
}
function prevChap(){ if(curChap>1){ goChap(curChap-1); } else if(curBook>0){ openBook(curBook-1); goChap(BOOKS[curBook][2]); } }
function nextChap(){ if(curChap<BOOKS[curBook][2]){ goChap(curChap+1); } else if(curBook<BOOKS.length-1){ openBook(curBook+1); } }
function shareVerse(n){ let b=BOOKS[curBook]; let verses=document.querySelectorAll('.verse'); let txt=''; verses.forEach(v=>{ if(v.querySelector('.ref') && v.querySelector('.ref').textContent.includes(':'+n)) txt=v.innerText; }); window.open('https://wa.me/?text='+encodeURIComponent('🙏 '+b[0]+' '+curChap+':'+n+'\n\n'+txt+'\n\n📖 BM మహిమ సన్నిధి\nhttps://ms2biblemission-bit.github.io/BMmahimasannidhi/bible.html'),'_blank'); }
renderBooks();
</script></body></html>
