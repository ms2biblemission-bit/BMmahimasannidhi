<!DOCTYPE html>
<html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>👶 పిల్లల ప్రపంచం</title>
<style>
body{font-family:system-ui;margin:0;background:#FFF8E1;padding-bottom:30px}
.top{background:#FF7043;color:#fff;text-align:center;padding:14px 10px}
.top h1{margin:0;font-size:26px}.top p{margin:4px 0 0;font-size:14px}
.box{max-width:650px;margin:auto;padding:12px}
.card{background:#fff;border:2px solid #FFE082;border-radius:16px;padding:14px;margin:12px 0}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;font-size:16px}
button{border:0;border-radius:10px;padding:12px;cursor:pointer;font-size:16px;font-weight:bold}
.colorRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.colorBtn{width:44px!important;height:44px!important;padding:0!important;font-size:26px!important;border-radius:50%!important;border:3px solid #fff!important;box-shadow:0 2px 5px rgba(0,0,0,.25);line-height:1}
.colorBtn.on{border:3px solid #333!important;transform:scale(1.15)}
.toolBtn{width:auto!important;padding:10px 14px!important;background:#fff;border:2px solid #ddd!important;color:#333}
canvas{width:100%;background:#fff;border:2px solid #7A0C1D;border-radius:12px;touch-action:none}
.storyCard{background:#fff;border:2px solid #FFD54F;border-radius:16px;padding:14px;margin:12px 0}
.adminMsg{background:#E8F5E9;border:2px solid #2E7D32;border-radius:12px;padding:10px;margin:10px 0;font-size:15px}
.adminMsg b{color:#2E7D32}
.drawImg{width:100%;border-radius:12px;border:2px solid #FFE082;background:#FFFDE7}
.verseCard{background:#FFF3E0;border:2px solid #FFB300;border-radius:14px;padding:12px;margin:10px 0}
.linkBtn{display:block;text-align:center;background:#7A0C1D;color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:bold;margin:8px 0}
</style></head><body>
<div class="top"><h1>👶 పిల్లల ప్రపంచం</h1><p>BM మహిమ సన్నిధి - యేసు పిల్లలను ప్రేమిస్తాడు ❤️</p></div>
<div class="box">

<!-- C. డ్రాయింగ్ - ✅ ప్లేస్ పెంచాను - 420 నుండి 560 కి -->
<div class="card">
<h2 style="text-align:center;margin:0">🎨 డ్రాయింగ్ - గీయి - ఎరేజర్ తో సరి చెయి!</h2>
<input id="kidName" placeholder="✏️ నీ పేరు రాయి - చిన్నారి">
<div class="colorRow" id="colorRow"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
<button type="button" class="toolBtn" onclick="setTool('draw')">✏️ గీయి</button>
<button type="button" class="toolBtn" onclick="setTool('erase')">🧽 ఎరేజర్</button>
<button type="button" class="toolBtn" onclick="clearCanvas()">🧹 మొత్తం తుడిచేయి</button>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px">
<button type="button" class="toolBtn" onclick="setSize(3)">🖊️ చిన్నది</button>
<button type="button" class="toolBtn" onclick="setSize(7)">🖊️ మధ్య</button>
<button type="button" class="toolBtn" onclick="setSize(12)">🖊️ పెద్దది</button>
<button type="button" class="toolBtn" onclick="setSize(18)">🧽 చిన్న తప్పు</button>
<button type="button" class="toolBtn" onclick="setSize(30)">🧽 పెద్ద తప్పు</button>
</div>
<canvas id="cv" width="600" height="560"></canvas>
<button type="button" onclick="saveDrawing()" style="background:#FF7043;color:#fff;width:100%;margin-top:10px">💾 నా బొమ్మ సేవ్ చెయ్యి</button>
</div>

<!-- A. బొమ్మల ఫోల్డర్ -->
<div class="card">
<h2 style="text-align:center;margin:0">📁 నా బొమ్మల ఫోల్డర్</h2>
<p style="text-align:center;color:#666;font-size:13px">నా పేరుతో - నా బొమ్మలు</p>
<div id="myDraws"></div>
</div>

<!-- B. వాక్యం నేర్చుకో - ✅ ఇది లేదు - ఇప్పుడు పెట్టాను -->
<div class="card">
<h2 style="text-align:center;margin:0">🧠 వాక్యం నేర్చుకో</h2>
<div id="verseList"></div>
</div>

<!-- 📖 కథలు - ✅ ఇక్కడ కథలు లేవు - kathalu.html లోనే ఉంటాయి - బటన్ మాత్రమే! -->
<div class="card" style="background:#FFF3E0">
<h2 style="text-align:center;margin:0">📖 దేవుని కథలు</h2>
<p style="text-align:center;color:#666;font-size:13px">కథలు ఇక్కడ రాయకూడదు - కథల పేజీలోనే రాయాలి!</p>
<a class="linkBtn" href="kathalu.html">📖 అన్ని కథలు చూడండి →</a>
<a class="linkBtn" href="kathalu.html" style="background:#FF7043">✍️ నా కథ రాయండి →</a>
</div>

</div>
<script>
let cv=document.getElementById('cv'), ctx=cv.getContext('2d'), drawing=false, curColor='#E53935', curSize=7, curTool='draw';
ctx.lineCap='round'; ctx.lineJoin='round'; ctx.fillStyle='#fff'; ctx.fillRect(0,0,600,560);
let colors=['#E53935','#EC407A','#FF9800','#FFEB3B','#43A047','#2196F3','#7E57C2','#000000','#8D6E63','#FFFFFF'];
let colorEmojis=['❤️','🩷','🧡','💛','💚','💙','💜','🖤','🤎','🤍'];
let row=document.getElementById('colorRow');
colors.forEach((c,i)=>{
  let b=document.createElement('button'); b.type='button'; b.className='colorBtn'+(i==0?' on':''); b.textContent=colorEmojis[i];
  b.style.background=c; b.onclick=()=>{ curColor=c; curTool='draw'; document.querySelectorAll('.colorBtn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
  row.appendChild(b);
});
function setTool(t){ curTool=t; }
function setSize(s){ curSize=s; }
function getPos(e){ let r=cv.getBoundingClientRect(); let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x:x*600/r.width, y:y*560/r.height}; }
function startDraw(e){ e.preventDefault(); drawing=true; let p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
function moveDraw(e){ if(!drawing) return; e.preventDefault(); let p=getPos(e); ctx.strokeStyle = curTool=='erase' ? '#FFFFFF' : curColor; ctx.lineWidth=curSize; ctx.lineTo(p.x,p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
function endDraw(){ drawing=false; }
cv.addEventListener('mousedown',startDraw); cv.addEventListener('mousemove',moveDraw); window.addEventListener('mouseup',endDraw);
cv.addEventListener('touchstart',startDraw,{passive:false}); cv.addEventListener('touchmove',moveDraw,{passive:false}); cv.addEventListener('touchend',endDraw);
function clearCanvas(){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,600,560); }
function getDraws(){ try{ return JSON.parse(localStorage.getItem('kids_drawings')||'[]'); }catch(e){ return []; } }
function saveDrawing(){
  let name=document.getElementById('kidName').value.trim()||'చిన్నారి';
  let list=getDraws();
  list.unshift({name:name, img:cv.toDataURL('image/png'), date:new Date().toLocaleString('en-GB'), adminMsg:''});
  localStorage.setItem('kids_drawings',JSON.stringify(list));
  renderDraws(); alert('✅ బొమ్మ సేవ్ అయ్యింది '+name+'! 🎨'); clearCanvas();
}
function renderDraws(){
  let list=getDraws();
  let box=document.getElementById('myDraws');
  if(!list.length){ box.innerHTML='<p style="text-align:center;color:#666">ఇంకా బొమ్మలు లేవు - గీయి!</p>'; return; }
  box.innerHTML=list.map((d,i)=>`
    <div style="background:#FFFDE7;border:2px solid #FFE082;border-radius:14px;padding:10px;margin:10px 0">
      <b>🎨 ${d.name}</b><br><small>📅 ${d.date||''}</small>
      <img class="drawImg" src="${d.img}">
      ${d.adminMsg ? `<div class="adminMsg">💌 <b>అడ్మిన్ మాట - ${d.name} కి:</b><br>${d.adminMsg}</div>` : ''}
    </div>`).join('');
}
// B. వాక్యాలు
let verses=["ప్రభువు నా కాపరి - నాకు లేమి కలుగదు - కీర్తనలు 23:1","దేవుడు లోకమును ఎంతో ప్రేమించెను - యోహాను 3:16","నీ దేవుడైన యెహోవా నీకు తోడుగా ఉండును - ద్వితీయో 31:6","చిన్న పిల్లలను నా యొద్దకు రానియ్యుడి - మార్కు 10:14","యెహోవా నా వెలుగు - నా రక్షణ - కీర్తనలు 27:1","భయపడకుము - నేను నీకు తోడైయున్నాను - యెషయా 41:10","యేసు ప్రభువును నమ్ముము - అపొస్తలులు 16:31","సంతోషముగా ఉండుడి - ఎల్లప్పుడు ప్రార్థన చేయుడి - 1 థెస్స 5:16-17","తల్లిదండ్రులను గౌరవించు - నిర్గమ 20:12","నీ పొరుగువానిని నీ వలె ప్రేమించు - మత్తయి 22:39"];
document.getElementById('verseList').innerHTML=verses.map((v,i)=>`<div class="verseCard"><b>${i+1}. ${v}</b></div>`).join('');
renderDraws();
</script></body></html>
