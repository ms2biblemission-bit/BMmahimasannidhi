<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Chat - మహిమ సన్నిధి</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:12px}
h2{color:#8B0000;text-align:center}
.box{background:white;padding:12px;border-radius:12px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
select,input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:6px 0;font-size:15px}
button{padding:12px;background:#8B0000;color:white;border:none;border-radius:20px;font-weight:bold;width:100%;font-size:15px;cursor:pointer}
.msg{padding:10px;border-radius:12px;margin:8px 0;font-size:15px;position:relative}
.small{font-size:13px;color:gray}
.msgBtn{padding:6px 10px;font-size:12px;border-radius:20px;width:auto;margin:4px 4px 0 0}
.replyBox{background:#E3F2FD;border-left:4px solid #2196F3;padding:8px;border-radius:8px;font-size:13px;margin-bottom:8px}
.blocked{background:#FFEBEE;border:2px solid #E53935}
</style>
</head>
<body>
<h2>💬 Admin Chat</h2>

<div class="box" id="status">లోడ్ అవుతోంది...</div>

<div class="box">
<b>ఎవరికి రిప్లై ఇవ్వాలో ఎంచుకోండి:</b>
<select id="userSelect" onchange="showUser()"><option value="">-- ఎంచుకోండి --</option></select>
<button onclick="loadAll()" style="background:#4CAF50;margin-top:8px">🔄 రిఫ్రెష్</button>
<div id="blockedBox" style="margin-top:10px"></div>
</div>

<div class="box" id="chatBox">ఒకరిని ఎంచుకోండి</div>

<div class="box">
<div id="replyToBox" style="display:none" class="replyBox"><b>↩️ దీనికి రిప్లై ఇస్తున్నారు:</b><div id="replyToText"></div><button onclick="clearReplyTo()" style="background:#999;padding:6px;width:auto;font-size:12px;margin-top:6px">✖️ రిప్లై తీసేయి</button></div>
<textarea id="replyText" rows="3" placeholder="రిప్లై రాయండి..."></textarea>
<button onclick="sendReply()">📩 రిప్లై</button>
<button onclick="blockUser()" style="background:#E53935;margin-top:8px">🚫 ఈ భక్తుడిని టోటల్ గా బ్లాక్ చేయి</button>
<button onclick="deleteUser()" style="background:#FF9800;margin-top:8px">🗑️ ఈ భక్తుడిని తీసేయి (మీ దాంట్లో మాత్రమే)</button>
</div>

<script>
const TOPIC='ms2-mahima-sannidhi-chat-2026';
let allMsgs=[];
let selectedReply=null; // {id, msg}
function getDeleted(){ try{return JSON.parse(localStorage.getItem('ms_admin_deleted')||'[]')}catch(e){return []} }
function getBlocked(){ try{return JSON.parse(localStorage.getItem('ms_admin_blocked')||'[]')}catch(e){return []} }
function saveDeleted(a){ localStorage.setItem('ms_admin_deleted',JSON.stringify(a)); }
function saveBlocked(a){ localStorage.setItem('ms_admin_blocked',JSON.stringify(a)); }
function msgId(m){ return (m.userCode+'|'+m.time+'|'+m.msg).slice(0,200); }

async function loadAll(){
  document.getElementById('status').innerText='లోడ్ అవుతోంది...';
  try{
    let r=await fetch('https://ntfy.sh/'+TOPIC+'/json?since=all&poll=1');
    let txt=await r.text();
    allMsgs=[];
    txt.split('\n').filter(Boolean).forEach(l=>{
      try{
        let j=JSON.parse(l);
        if(j.message && j.message.startsWith('USER_MSG_')){
          let parts=j.message.replace('USER_MSG_','').split('|');
          // కొత్త ఫార్మాట్: CODE|NAME|VILLAGE|PHONE|MSG|TIME , పాతది: CODE|NAME|MSG|TIME
          let code=parts[0], name=parts[1]||'భక్తుడు', village='', phone='', msg='', time='';
          if(parts.length>=6){ village=parts[2]||''; phone=parts[3]||''; msg=parts.slice(4,parts.length-1).join('|'); time=parts[parts.length-1]; }
          else if(parts.length>=4){ msg=parts.slice(2,parts.length-1).join('|'); time=parts[parts.length-1]; }
          else { msg=parts[2]||''; time=''; }
          if(!time) time=new Date(j.time*1000).toLocaleString('te-IN',{day:'numeric',month:'short',hour:'numeric',minute:'numeric',hour12:true});
          allMsgs.push({userCode:code,userName:name,village:village,phone:phone,msg:msg,time:time});
        }
      }catch(e){}
    });
  }catch(e){}
  try{
    let r2=await fetch('chat.json?v='+Date.now());
    if(r2.ok){
      let old=await r2.json();
      old.forEach(m=>{ if(m.from==='user') allMsgs.push(m); });
    }
  }catch(e){}

  // ⭐ డిలీట్ చేసినవి + బ్లాక్ చేసినవి దాచేయి
  let del=getDeleted(); let blk=getBlocked();
  allMsgs=allMsgs.filter(m=>!del.includes(msgId(m)));
  renderBlockedBox();
  let users={};
  allMsgs.forEach(m=>{
    if(!users[m.userCode]) users[m.userCode]={name:m.userName,msgs:[],last:m.time,village:m.village,phone:m.phone};
    users[m.userCode].msgs.push(m);
    users[m.userCode].last=m.time;
    if(m.village) users[m.userCode].village=m.village;
    if(m.phone) users[m.userCode].phone=m.phone;
  });
  let sel=document.getElementById('userSelect');
  let cur=sel.value;
  sel.innerHTML='<option value="">-- ఎంచుకోండి --</option>'+Object.keys(users).map(code=>{
    let isB=blk.includes(code)?' 🚫 BLOCKED':''; 
    return `<option value="${code}">${users[code].last} - ${users[code].name} ${users[code].village?'| 🏡 '+users[code].village:''} ${users[code].phone?'| 📞 '+users[code].phone:''} (${users[code].msgs.length} మెసేజ్ లు) - ${code}${isB}</option>`;
  }).join('');
  if(cur) sel.value=cur;
  document.getElementById('status').innerText='✅ కనెక్ట్ అయ్యింది! మొత్తం మెసేజ్ లు: '+allMsgs.length;
  if(cur) showUser();
}
function renderBlockedBox(){
  let blk=getBlocked();
  let b=document.getElementById('blockedBox');
  if(!blk.length){ b.innerHTML=''; return; }
  b.innerHTML='<b>🚫 బ్లాక్ చేసినవారు: '+blk.length+'</b>'+blk.map(c=>`<div style="display:flex;gap:6px;margin-top:6px"><span style="flex:1">🚫 ${c}</span><button onclick="unblockUser('${c}')" style="width:auto;padding:6px 12px;background:#4CAF50;font-size:12px">✅ Unblock</button></div>`).join('');
}
function showUser(){
  let code=document.getElementById('userSelect').value;
  if(!code){ document.getElementById('chatBox').innerHTML='ఒకరిని ఎంచుకోండి'; return; }
  let blk=getBlocked();
  let isBlocked=blk.includes(code);
  let mine=allMsgs.filter(m=>String(m.userCode)===String(code));
  let head=isBlocked?'<div class="blocked" style="padding:10px;border-radius:10px;margin-bottom:10px"><b>🚫 ఈ వ్యక్తి బ్లాక్ అయ్యారు!</b><br><small>వీళ్ళ మెసేజ్ లు మీకు రావు - వీళ్ళకి కూడా మీ రిప్లై వెళ్ళదు.</small></div>':'';
  document.getElementById('chatBox').innerHTML=head+mine.map((m,idx)=>{
    let id=msgId(m);
    return `<div class="msg" style="background:#fff3cd"><b>భక్తుడు: ${m.msg}</b><br><small class="small">📅 ${m.time} ${m.village?(' | 🏡 '+m.village):''} ${m.phone?(' | 📞 '+m.phone):''}</small><br><button class="msgBtn" style="background:#2196F3" onclick="selectReply(${idx})">↩️ దీనికి రిప్లై</button><button class="msgBtn" style="background:#E53935" onclick="deleteOneMsg(${idx})">🗑️ ఈ మెసేజ్ డిలీట్</button></div>`;
  }).join('')||'ఏమీ లేదు';
  // idx మారకుండా - mine array ని గ్లోబల్ లో పెట్టు
  window._curMine=mine;
}
function selectReply(idx){
  let m=window._curMine[idx]; if(!m) return;
  selectedReply={id:msgId(m),msg:m.msg};
  document.getElementById('replyToBox').style.display='block';
  document.getElementById('replyToText').innerText='భక్తుడు: '+m.msg;
  document.getElementById('replyText').focus();
}
function clearReplyTo(){ selectedReply=null; document.getElementById('replyToBox').style.display='none'; }

async function sendReply(){
  let code=document.getElementById('userSelect').value;
  let txt=document.getElementById('replyText').value.trim();
  if(!code){ alert('ఒకరిని ఎంచుకోండి'); return; }
  if(!txt){ alert('రిప్లై రాయండి'); return; }
  let blk=getBlocked();
  if(blk.includes(code)){ if(!confirm('ఈ వ్యక్తి బ్లాక్ లో ఉన్నారు - అయినా రిప్లై పంపాలా? ముందు Unblock చేయండి!')) return; }
  // ⭐ Reply To ఉంటే - అది కలిపి పంపు - భక్తుడికి ఏదానికి రిప్లై ఇచ్చారో తెలుస్తుంది!
  let full=txt;
  if(selectedReply) full='[Reply to: '+selectedReply.msg.slice(0,80)+'] '+txt;
  await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'ADMIN_REPLY_'+code+':'+full});
  document.getElementById('replyText').value='';
  clearReplyTo();
  alert('✅ రిప్లై పంపించారు! భక్తుడికి - వాళ్ల ఫోన్ లో - వస్తుంది!');
}
// ⭐ ఒక్క మెసేజ్ డిలీట్ - భక్తుడి ఫోన్ లో కూడా డిలీట్ అవ్వాలి అంటే - index.html లో కూడా చిన్న ప్యాచ్ కావాలి - కింద చూడండి!
async function deleteOneMsg(idx){
  let m=window._curMine[idx]; if(!m) return;
  if(!confirm('ఈ ఒక్క మెసేజ్ డిలీట్ చేయాలా?\n\n"'+m.msg.slice(0,60)+'"')) return;
  let id=msgId(m);
  let del=getDeleted(); if(!del.includes(id)) del.push(id); saveDeleted(del);
  // భక్తుడి ఫోన్ కి - డిలీట్ సిగ్నల్ పంపు!
  try{ await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'ADMIN_DELETE_'+m.userCode+':'+id}); }catch(e){}
  allMsgs=allMsgs.filter(x=>msgId(x)!==id);
  alert('✅ ఈ మెసేజ్ డిలీట్ చేసారు! భక్తుడు చాట్ మళ్ళీ ఓపెన్ చేస్తే - వాడి దాంట్లో కూడా పోతుంది! (index.html ప్యాచ్ వేస్తేనే!)');
  showUser();
}
async function blockUser(){
  let code=document.getElementById('userSelect').value;
  if(!code) return;
  if(!confirm('🚫 ఈ భక్తుడిని టోటల్ గా బ్లాక్ చేయాలా?\nఇంక వీళ్ళ మెసేజ్ లు మీకు రావు!')) return;
  let blk=getBlocked(); if(!blk.includes(code)) blk.push(code); saveBlocked(blk);
  try{ await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:'ADMIN_BLOCK_'+code+':blocked'}); }catch(e){}
  alert('🚫 బ్లాక్ చేసారు! ఇంక వీళ్ళ మెసేజ్ లు రావు!');
  loadAll();
}
function unblockUser(code){
  let blk=getBlocked().filter(c=>c!==code); saveBlocked(blk);
  alert('✅ Unblock చేసారు!');
  loadAll();
}
function deleteUser(){
  let code=document.getElementById('userSelect').value;
  if(!code) return;
  if(!confirm('ఈ భక్తుడిని తీసేయాలా? (మీ దాంట్లో మాత్రమే - వాడి ఫోన్ లో ఉంటుంది!)')) return;
  allMsgs=allMsgs.filter(m=>String(m.userCode)!==String(code));
  document.getElementById('userSelect').value='';
  document.getElementById('chatBox').innerHTML='తీసేసారు';
  loadAll();
}
loadAll();
setInterval(loadAll,15000);
</script>
</body>
</html>
