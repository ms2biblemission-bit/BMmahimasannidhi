<!DOCTYPE html>
<html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📖 దేవుని కథలు</title>
<style>
body{font-family:system-ui;margin:0;background:#FFF8E1;padding-bottom:30px}
.top{background:#7A0C1D;color:#fff;text-align:center;padding:14px 10px}
.top h1{margin:0;font-size:24px}
.box{max-width:650px;margin:auto;padding:12px}
.card{background:#fff;border:2px solid #FFE082;border-radius:16px;padding:14px;margin:12px 0}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;font-size:16px}
button{border:0;border-radius:10px;padding:12px;cursor:pointer;font-size:16px;font-weight:bold}
.linkBtn{display:block;text-align:center;background:#7A0C1D;color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:bold;margin:8px 0}
.story{background:#FFFDE7;border:2px solid #FFE082;border-radius:14px;padding:12px;margin:10px 0}
</style></head><body>
<div class="top"><h1>📖 దేవుని కథలు</h1><p>BM మహిమ సన్నిధి - పిల్లల కోసం ❤️</p></div>
<div class="box">
<div class="card"><h2 style="text-align:center;margin:0">✍️ నా కథ రాయండి</h2><input id="sName" placeholder="✏️ నీ పేరు"><input id="sTitle" placeholder="📖 కథ పేరు - ఉదా: దావీదు కథ"><textarea id="sText" rows="5" placeholder="📝 ఇక్కడ నీ కథ రాయి..."></textarea><button onclick="saveStory()" style="background:#FF7043;color:#fff;width:100%">💾 కథ సేవ్ చెయ్యి</button><p style="text-align:center;color:#666;font-size:13px">సేవ్ చేస్తే - అందరికీ కనబడుతుంది!</p></div>
<div class="card"><h2 style="text-align:center;margin:0">📖 అన్ని కథలు</h2><div id="syncTxt" style="text-align:center;color:#888;font-size:12px">🔄 లోడ్ అవుతుంది...</div><div id="storyList"></div></div>
<a class="linkBtn" href="kids.html">⬅️ పిల్లల ప్రపంచానికి వెనక్కి</a>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxhBqhs53b1LdXVq-EQUGAxBCpYKq31ka7mmCOz7R_ANPpXQ7DXGpAoJqXJZuKpHIgT/exec";
let stories=[];
async function loadStories(){
try{let r=await fetch(API_URL);let d=await r.json();stories=d.stories||[];if(!stories.length){stories=JSON.parse(localStorage.getItem('ms_stories')||'[]');}document.getElementById('syncTxt').textContent='✅ అన్ని కథలు - లైవ్!';}catch(e){stories=JSON.parse(localStorage.getItem('ms_stories')||'[]');document.getElementById('syncTxt').textContent='📱 ఇంటర్నెట్ లేదు - ఫోన్ లో ఉన్నవి!';}
renderStories();
}
function renderStories(){let box=document.getElementById('storyList');if(!stories.length){box.innerHTML='<p style="text-align:center;color:#666">ఇంకా కథలు లేవు - నువ్వే మొదటిది రాయి!</p>';return;}box.innerHTML=stories.map(s=>`<div class="story"><b>📖 ${s.title}</b><br><small>✍️ ${s.name} - 📅 ${s.date||''}</small><p style="white-space:pre-wrap">${s.text}</p></div>`).join('');}
async function saveStory(){
let name=document.getElementById('sName').value.trim()||'చిన్నారి';
let title=document.getElementById('sTitle').value.trim();let text=document.getElementById('sText').value.trim();
if(!title||!text){alert('దయచేసి కథ పేరు + కథ రాయండి!');return;}
let item={name:name,title:title,text:text,date:new Date().toLocaleString('en-GB')};
stories.unshift(item);localStorage.setItem('ms_stories',JSON.stringify(stories));
try{await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'save',stories:stories})});}catch(e){}
alert('✅ కథ సేవ్ అయ్యింది '+name+'! 🎉');document.getElementById('sTitle').value='';document.getElementById('sText').value='';renderStories();
}
loadStories();
</script></body></html>
